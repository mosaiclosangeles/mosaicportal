<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaic Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---- sign-in gate (same accounts as Mosaic Metrics) ---- */
#gate{position:fixed;inset:0;background:#fafaf9;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.011em}
#gate.hide{display:none}
.gate-card{width:100%;max-width:360px;background:#fff;border:1px solid #e6e6e5;border-radius:12px;padding:32px 30px}
.gate-brand{display:flex;align-items:center;gap:9px;margin-bottom:20px}
.gate-brand .mark{width:18px;height:18px;border-radius:5px;background:#000;flex:none}
.gate-brand .name{font-size:13.5px;font-weight:600;color:#000}
.gate-card h1{font-size:22px;font-weight:600;letter-spacing:-.03em;margin:0 0 4px;color:#000}
.gate-card .gsub{font-size:13px;color:#8a8a8a;margin:0 0 22px}
.gate-card label{display:block;font-size:12px;font-weight:500;color:#8a8a8a;margin:14px 0 5px}
.gate-card input{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #e6e6e5;border-radius:7px;font-size:14px;font-family:inherit;letter-spacing:inherit;color:#000;background:#fff}
.gate-card input:focus{outline:none;border-color:#b5b5b3}
.gate-btn{width:100%;margin-top:20px;padding:10px;border:none;border-radius:8px;background:#000;color:#fff;font-size:14px;font-weight:500;font-family:inherit;letter-spacing:inherit;cursor:pointer}
.gate-btn:disabled{opacity:.55;cursor:default}
.gate-ghost{display:block;margin:14px auto 0;border:none;background:none;font-size:12.5px;color:#8a8a8a;cursor:pointer;font-family:inherit}
.gate-ghost:hover{color:#000;text-decoration:underline}
.gate-note{margin-top:14px;font-size:13px;line-height:1.45;border-radius:7px;display:none}
.gate-note.show{display:block;padding:9px 11px}
.gate-note.err{background:#fbebec;color:#8f2c32}
.gate-note.ok{background:#e6f6f1;color:#2f7a63}
.gate-note.warn{background:#fdf3e3;color:#8a5a12}

/* ---- embedded apps ---- */
.app-embed{width:100%;height:calc(100vh - 132px);border:1px solid #e6e6e5;border-radius:10px;background:#fff;display:block}

/* ---- account menu (rail foot) ---- */
.rail-foot{cursor:pointer;border-radius:8px}
.rail-foot:hover{background:#e6e6e4}
.um-pop{position:fixed;left:14px;bottom:64px;width:250px;background:#fff;border:1px solid #e6e6e5;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.12);padding:8px;z-index:900;display:none;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.011em}
.um-pop.open{display:block}
.um-head{padding:10px 10px 10px;border-bottom:1px solid #f0f0f0;margin-bottom:6px}
.um-name{font-weight:600;font-size:13.5px;color:#000}
.um-mail{font-size:12px;color:#8a8a8a;margin-top:1px}
.um-role{display:inline-block;margin-top:8px;font-size:10.5px;padding:3px 8px;border-radius:999px;background:#f2f2f1;color:#4a4a4a;font-weight:500}
.um-item{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;font-family:inherit;letter-spacing:inherit;font-size:13px;color:#000;padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left;text-decoration:none;box-sizing:border-box}
.um-item:hover{background:#f2f2f1}
.um-item svg{width:15px;height:15px;color:#5c5c5c;flex:none}
.um-item .hint{color:#8a8a8a;font-size:11px;margin-left:auto}
.um-sep{height:1px;background:#f0f0f0;margin:6px 0}

:root{
  --surface:#ffffff; --rail:#f3f3f2; --rail-active:#e6e6e4; --fill:#f2f2f1;
  --hairline:#e6e6e5; --separator:#f0f0f0; --grid:#d9d9d6;
  --text:#000000; --text2:#8a8a8a; --text3:#b5b5b3;
  --gathering:#4f7fd1; --gathering-t:#e8f0fa; --gathering-d:#2c4c85;
  --comms:#9a63d4;     --comms-t:#f0e9fb;     --comms-d:#5f3691;
  --milestone:#de6a45; --milestone-t:#fceee7; --milestone-d:#8f3c22;
  --session:#6ac5a7;   --session-t:#e6f6f1;   --session-d:#2f7a63;
  --amber:#e8a33d;  --amber-t:#fdf3e3;  --amber-d:#8a5a12;
  --magenta:#ca5391;--magenta-t:#f9eaf1;--magenta-d:#8c2f5e;
  --indigo:#6f6ede; --indigo-t:#ecebfc; --indigo-d:#3f3e9c;
  --lime:#a9c957;   --lime-t:#f2f7e5;   --lime-d:#5d7326;
  --red:#cf4b53;    --red-t:#fbebec;    --red-d:#8f2c32;
  --slate:#8d979e;  --slate-t:#eceef0;  --slate-d:#4e565b;
  --neutral:#9a9a92;--neutral-t:#f0f0ed;--neutral-d:#55554f;
  --gathering-s:#3f6cba; --comms-s:#7a44b4; --milestone-s:#a8482a;
  --session-s:#2f8a70;   --amber-s:#b8791b; --magenta-s:#a63a72;
  --indigo-s:#4f4ec4;    --lime-s:#6f8a2f;  --red-s:#a63238;
  --slate-s:#5f6a70;     --neutral-s:#6e6e67;
  --r-ctrl:7px; --r-btn:8px; --r-card:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  letter-spacing:-.011em; color:var(--text); background:var(--surface);
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45;
}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gathering);outline-offset:2px;border-radius:4px}
.app{display:flex;min-height:100vh}

/* ---------- rail ---------- */
.rail{width:196px;flex:none;background:var(--rail);border-right:1px solid var(--hairline);
  padding:16px 10px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;padding:0 6px 16px}
.brand-mark{width:18px;height:18px;border-radius:5px;background:#000;flex:none}
.brand-name{font-size:13.5px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--r-ctrl);
  font-size:13.5px;color:#5c5c5c;text-align:left;width:100%}
.nav button:hover{background:#eaeae8}
.nav button.on{background:var(--rail-active);color:#000;font-weight:500}
.nav svg{width:18px;height:18px;flex:none}
.navgroup{font-size:9.5px;letter-spacing:.09em;color:#a3a3a0;padding:14px 9px 4px}
.nav .lock{margin-left:auto;color:#a3a3a0;display:flex}
.nav .lock svg{width:13px;height:13px}
.nav .lock + .badge{margin-left:6px}
.nav .tile{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.nav .tile svg{width:15px;height:15px}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;max-width:330px}
.sw{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center}
.sw svg{width:13px;height:13px;color:#fff}
.sw.sel{box-shadow:0 0 0 2px #fff inset}
.badge{margin-left:auto;font-size:9px;font-weight:500;letter-spacing:.06em;
  color:#4a4a4a;background:#e2e2e0;border-radius:4px;padding:2px 5px}
.count{margin-left:auto;font-size:12px;color:var(--text3)}
.rail-foot{margin-top:auto;border-top:1px solid var(--rail-active);padding-top:11px;
  display:flex;align-items:center;gap:9px}
.avatar{width:24px;height:24px;border-radius:50%;background:#e2e2e0;font-size:10px;
  font-weight:500;display:flex;align-items:center;justify-content:center;flex:none}
.who{font-size:12.5px;color:var(--text2)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:24px 28px 60px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
h1{font-size:30px;font-weight:600;letter-spacing:-.03em;margin:0;line-height:1.1}
.sub{font-size:14px;color:var(--text2);margin-top:5px}
h2{font-size:16px;font-weight:600;letter-spacing:-.015em;margin:0 0 6px}
.btn-primary{background:var(--gathering);color:#fff;font-size:13px;font-weight:500;padding:9px 16px;border-radius:var(--r-btn)}
.btn-primary:hover{filter:brightness(.94)}
.btn-ghost{border:1px solid var(--hairline);font-size:13px;padding:8px 14px;border-radius:var(--r-btn)}
.btn-ghost:hover{background:var(--fill)}

.seg{display:inline-flex;background:var(--fill);border-radius:var(--r-ctrl);padding:2px}
.seg button{font-size:12px;padding:5px 11px;border-radius:6px;color:#5c5c5c}
.seg button.on{background:#fff;color:#000;font-weight:500;box-shadow:0 0 0 1px var(--hairline)}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:28px}
.card{border:1px solid var(--hairline);border-radius:var(--r-card);padding:13px 15px;text-align:left;width:100%}
.card:hover{background:#fcfcfc}
.card .k{font-size:12px;color:var(--text2)}
.card .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.05;margin-top:7px}
.card .n{font-size:12px;color:var(--text2);margin-top:3px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.row{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--separator);
  font-size:14px;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:#fcfcfc}
.row .txt{flex:1;min-width:0;display:block}
.row .txt > .name{display:block}
.row .meta{display:block;font-size:12px;color:var(--text2);margin-top:3px}
.row .when{font-size:13px;color:var(--text2);min-width:52px;flex:none;padding-top:1px}
.tick{width:17px;height:17px;border-radius:50%;border:1.5px solid #d4d4d4;flex:none;margin-top:2px;
  display:flex;align-items:center;justify-content:center}
.tick.done{background:#000;border-color:#000}
.tick.done svg{width:11px;height:11px;color:#fff}
.done-text{color:var(--text3);text-decoration:line-through}

/* ---------- filters ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:12px;padding:5px 10px;border-radius:var(--r-ctrl);border:1px solid var(--hairline);
  color:#5c5c5c;display:inline-flex;align-items:center;gap:7px;background:#fff}
.chip:hover{background:#fafafa}
.chip.on{background:var(--fill);border-color:#dedede;color:#000;font-weight:500}
.chip.off{opacity:.45}
.swatch{width:7px;height:7px;border-radius:2px;flex:none}

/* ---------- calendar ---------- */
.wk-head,.wk-body{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk-head div{font-size:11.5px;color:var(--text2);padding:0 0 7px 4px}
.wk-head div.today{color:#000;font-weight:500}
.wk-body{border-top:1px solid var(--grid)}
.cell{border-left:1px solid var(--grid);padding:5px 4px 8px;min-height:120px}
.cell:first-child{border-left:0}
.cell.sun{background:#fcfcfc}
.daynum{font-size:11.5px;color:var(--text2);margin-bottom:4px}
.daynum.today span{background:#000;color:#fff;border-radius:50%;width:19px;height:19px;
  display:inline-flex;align-items:center;justify-content:center;font-size:10.5px}
.ev{display:block;width:100%;text-align:left;font-size:10.5px;line-height:1.28;padding:3px 5px;
  border-radius:4px;margin-bottom:3px;border-left:2.5px solid;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ev:hover{filter:brightness(.97)}
.more{font-size:10px;color:var(--text3);padding-left:5px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding-top:4px}
.bar{font-size:10px;padding:2px 7px;border-radius:4px;margin:0 3px 4px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;text-align:left;width:calc(100% - 6px)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--text2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}

/* ---------- timeline ---------- */
.tl-scale{display:flex;font-size:11.5px;color:var(--text2);margin-left:118px;margin-bottom:4px}
.tl-scale div{border-left:1px solid var(--grid);padding-left:6px}
.tl-scale div:first-child{border-left:0;padding-left:0}
.tl-row{display:flex;align-items:center;border-top:1px solid var(--grid);min-height:38px}
.tl-label{width:118px;flex:none;font-size:12.5px;padding-right:10px}
.tl-label .meta{font-size:10.5px;color:var(--text2)}
.tl-track{flex:1;position:relative;height:38px}
.tl-bar{position:absolute;top:9px;height:20px;border-radius:5px;font-size:10.5px;
  padding:0 7px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.tl-now{position:absolute;top:0;bottom:0;width:1px;background:#000;opacity:.35}

/* ---------- misc ---------- */
.bars-chart{display:flex;align-items:flex-end;gap:9px;height:120px}
.bar-v{flex:1;background:var(--fill);border-radius:3px 3px 0 0}
.bar-v.hi{background:var(--gathering)}
.bar-labels{display:flex;gap:9px;margin-top:6px}
.bar-labels div{flex:1;text-align:center;font-size:11px;color:var(--text2)}
.goal{border:1px solid var(--hairline);border-radius:var(--r-card);padding:14px 15px}
.goal .k{font-size:12px;color:var(--text2)}
.goal .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:5px}
.goal .of{font-size:13px;color:var(--text3);font-weight:400}
.track{height:6px;border-radius:3px;background:var(--fill);margin-top:12px;position:relative}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.track .pace{position:absolute;top:-3px;width:1.5px;height:12px;background:#000}
.pill{font-size:11px;padding:3px 8px;border-radius:6px;display:inline-block;margin-top:11px}
.note{font-size:12.5px;color:var(--text2);margin-top:14px}
.banner{border:1px solid var(--hairline);background:#fafafa;border-radius:var(--r-card);
  padding:12px 14px;font-size:13px;color:#5c5c5c;margin-bottom:20px;display:flex;gap:10px;align-items:flex-start}
.banner svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--text2)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:396px;max-width:92vw;background:#fff;
  border-left:1px solid var(--hairline);transform:translateX(100%);transition:transform .22s ease;
  overflow-y:auto;padding:20px 22px 40px;z-index:2}
.drawer.open{transform:none}
.drawer-close{position:absolute;top:16px;right:18px;color:var(--text2)}
.drawer-close svg{width:18px;height:18px}
.tag{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--fill);color:#4a4a4a;margin-right:5px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--separator)}
.kv span:first-child{color:var(--text2)}
.eyebrow{font-size:10.5px;letter-spacing:.06em;color:var(--text2);margin:20px 0 4px}
.mini{display:flex;gap:22px;margin:4px 0 2px}
.mini .v{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.mini .k{font-size:11.5px;color:var(--text2);margin-top:2px}
.linkout{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--gathering);margin-top:16px}
.linkout svg{width:14px;height:14px}
.empty{font-size:13px;color:var(--text2);background:var(--fill);border-radius:var(--r-card);padding:12px 14px}

/* ---------- settings ---------- */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:13px 0;border-bottom:1px solid var(--separator)}
.set-row .k{font-size:14px}
.set-row .d{font-size:12.5px;color:var(--text2);margin-top:2px}
select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--hairline);
  border-radius:var(--r-btn);background:#fff}

/* ---------- event page ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);margin-bottom:14px}
.back svg{width:15px;height:15px}
.ecard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px;margin-top:22px}
.desc{font-size:14px;line-height:1.55;color:#2c2c2a}
.nm2{border-radius:9px;padding:10px 12px;flex:1;min-width:0}
.nm2 .v{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.nm2 .k{font-size:11px;color:var(--text2);margin-top:3px}
.pg{height:5px;border-radius:3px;background:var(--fill);position:relative;margin:7px 0 4px}
.pg i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--gathering)}
.bar-v.q{background:repeating-linear-gradient(45deg,#efefec,#efefec 3px,#fbfbf9 3px,#fbfbf9 6px);
  border:1px dashed var(--grid);border-bottom:0}
.foot-links{display:flex;gap:20px;flex-wrap:wrap;margin-top:26px;padding-top:16px;
  border-top:1px solid var(--hairline);font-size:13px}
.foot-links a{color:var(--gathering);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.foot-links svg{width:13px;height:13px}
@media (max-width:860px){.ecard{grid-template-columns:1fr;gap:24px}}

/* ---------- responsive ---------- */
.mobile-only{display:none}
@media (max-width:860px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:1fr;gap:22px}
}
@media (max-width:760px){
  .app{flex-direction:column}
  .rail{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;
    flex-direction:row;border-right:0;border-top:1px solid var(--hairline);
    padding:6px 4px;z-index:3;overflow-x:auto}
  .brand,.rail-foot{display:none}
  .nav{flex-direction:row;gap:2px;width:100%}
  .nav button{flex-direction:column;gap:3px;font-size:10px;padding:6px 4px;justify-content:center;text-align:center}
  .nav .badge,.nav .count{display:none}
  .main{padding:18px 16px 96px}
  h1{font-size:24px}
  .desktop-only{display:none!important}
  .mobile-only{display:block}
  .drawer{width:100%;max-width:100%}
}
</style>
</head>
<body>

<!-- ============ sign-in gate — same accounts as Mosaic Metrics ============ -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-brand"><div class="mark"></div><div class="name">Mosaic Portal</div></div>
    <h1>Welcome</h1>
    <p class="gsub">Sign in with your Mosaic Metrics account.</p>
    <div id="g-email-row">
      <label for="gEmail">Email</label>
      <input id="gEmail" type="email" autocomplete="email" placeholder="you@mosaic.org">
    </div>
    <div id="g-pass-row">
      <label for="gPass">Password</label>
      <input id="gPass" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div id="g-newpass-rows" style="display:none">
      <div>
        <label for="gNewPass">New password</label>
        <input id="gNewPass" type="password" autocomplete="new-password" placeholder="At least 8 characters">
      </div>
      <div>
        <label for="gNewPass2">Confirm new password</label>
        <input id="gNewPass2" type="password" autocomplete="new-password" placeholder="Type it again">
      </div>
    </div>
    <button id="gLoginBtn" class="gate-btn">Sign in</button>
    <button id="gSendResetBtn" class="gate-btn" style="display:none">Email me a reset link</button>
    <button id="gUpdatePassBtn" class="gate-btn" style="display:none">Set new password</button>
    <button id="gForgotLink" class="gate-ghost">Forgot your password?</button>
    <button id="gBackToSignIn" class="gate-ghost" style="display:none">← Back to sign in</button>
    <div id="gateNote" class="gate-note"></div>
  </div>
</div>

<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand"><div class="brand-mark"></div><div class="brand-name">Mosaic Portal</div></div>
    <div class="nav" id="nav"></div>
    <div class="rail-foot"><div class="avatar">L</div><div class="who" id="who">Loyda</div></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Details" aria-hidden="true">

function ic(n,s){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"'+(s?' style="'+s+'"':'')+'><path d="'+P[n]+'"/></svg>';}

/* ============================ dates ============================ */
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
function D(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function key(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function addDays(dt,n){const x=new Date(dt);x.setDate(x.getDate()+n);return x;}
function weekStartOf(dt){return addDays(dt,-dt.getDay());}
function same(a,b){return key(a)===key(b);}
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmt(dt){return MON[dt.getMonth()].slice(0,3)+' '+dt.getDate();}
function fmtLong(dt){return DOW[dt.getDay()]+'day, '.replace('day,','')+MON[dt.getMonth()]+' '+dt.getDate();}
function pretty(dt){return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dt.getDay()]+', '+MON[dt.getMonth()]+' '+dt.getDate();}

// status: done | scheduled | waiting | drafting
/* ---- live data ----------------------------------------------------------
   EVENTS / CAMPAIGNS come from the planning board's queryable mirror
   (planning_items) and the comms calendar (comm_events) in the mosaic-comm
   Supabase — read-only, with the public key both apps already expose.
   METRICS comes from the Mosaic Metrics view v_service_totals using the
   signed-in person's own session. The four apps stay the systems of record;
   the portal reads and arranges. */
let EVENTS=[], CAMPAIGNS=[], METRICS={}, TASKS=[], ATTN=[], CLOSEOUT=0, DATA_ERR=null;
const PM_URL='https://yrviwbqhjcrlxgozrgay.supabase.co';
const PM_KEY='sb_publishable_3o7Avv4DEhHW7i_k5DrH6Q_tYFLrgwg';
async function pmGet(q){
  const r=await fetch(PM_URL+'/rest/v1/'+q,{headers:{apikey:PM_KEY,Authorization:'Bearer '+PM_KEY}});
  if(!r.ok)throw new Error('planning read failed ('+r.status+')');
  return r.json();
}
const CE_STATUS={sent:'done',approved:'done',complete:'done',scheduled:'scheduled',waiting:'waiting','waiting for approval':'waiting',proposed:'drafting','in progress':'drafting',incomplete:'drafting'};
function mapLive(pis,ces){
  EVENTS=[];CAMPAIGNS=[];ATTN=[];CLOSEOUT=0;
  pis.forEach(r=>{
    if(r.deleted)return;
    const title=r.title||(r.is_sunday?'Sunday Gathering':'(untitled)');
    const past=D(r.date)<TODAY;
    const base={type:'event',title,campus:r.campus,level:r.level,phase:r.phase_now,speaker:r.speaker,
      series:r.is_series?title:undefined,owner:(r.owners||[]).join(', '),desc:r.description,
      detail:(r.speaker?r.speaker+(r.is_sunday?' speaking':''):(r.type||''))+(r.campus&&r.campus!=='LA'?' · '+r.campus:'')};
    if(r.recur==='weekly'&&r.date_end){
      let d=D(r.date),i=0;
      while(d<=D(r.date_end)&&i<60){
        EVENTS.push(Object.assign({},base,{id:'pm:'+r.id+':'+key(d),date:key(d),status:(r.status==='Complete'||d<TODAY)?'done':'scheduled'}));
        d=addDays(d,7);i++;
      }
      return;
    }
    if(r.date_end&&r.date_end!==r.date){CAMPAIGNS.push({title,start:r.date,end:r.date_end,type:'event'});return;}
    const id='pm:'+r.id;
    EVENTS.push(Object.assign({},base,{id,date:r.date,status:(r.status==='Complete'||past)?'done':'scheduled'}));
    if(past&&!r.parent_id&&r.status&&r.status!=='Complete')CLOSEOUT++;
    if(r.is_sunday&&!r.speaker&&!past&&D(r.date)<=addDays(TODAY,42))
      ATTN.push({evId:id,title:'No speaker yet — '+title,date:r.date,meta:(r.campus||'')+' · '+((r.owners||[])[0]||'')});
    if(r.needs_review&&!past)
      ATTN.push({evId:id,title:'Flagged to review — '+title,date:r.date,meta:(r.campus||'')+' · '+((r.owners||[])[0]||'')});
  });
  ATTN.sort((a,b)=>D(a.date)-D(b.date));
  ces.forEach(r=>{
    if(r.archived||!r.event_date)return;
    EVENTS.push({id:'ce:'+r.id,date:r.event_date,type:'comms',
      status:CE_STATUS[String(r.status||'').toLowerCase()]||'drafting',
      title:r.title||(r.type||'Comm'),
      detail:(r.subtitle||r.type||'')+(r.sender?' · '+r.sender:'')});
  });
  EVENTS.sort((a,b)=>D(a.date)-D(b.date));
}
async function loadLive(){
  DATA_ERR=null;
  try{
    const [pis,ces]=await Promise.all([
      pmGet('planning_items?select=*&deleted=eq.false'),
      pmGet('comm_events?select=id,event_date,type,title,subtitle,status,sender,archived&archived=eq.false')
    ]);
    mapLive(pis,ces);
  }catch(e){DATA_ERR="Couldn't load live planning data — "+e.message+". Showing an empty calendar; the planning board itself is unaffected.";}
  try{
    if(sb){
      let {data,error}=await sb.from('v_service_totals').select('date,gathering_type,in_person_total,online_views,baptisms').order('date',{ascending:false}).limit(80);
      if(!error&&data&&data.length){
        const sun=data.filter(r=>String(r.gathering_type||'sunday').toLowerCase().includes('sun'));
        const rows=sun.length?sun:data;
        const byDate={};
        rows.forEach(r=>{const k=r.date;byDate[k]=byDate[k]||{a:0,k:0,n:0};byDate[k].a+=(r.in_person_total||0);byDate[k].k+=(r.online_views||0);byDate[k].n+=(r.baptisms||0);});
        METRICS={};Object.keys(byDate).sort().slice(-6).forEach(k=>METRICS[k]=byDate[k]);
      }
    }
  }catch(e){/* metrics card stays empty */}
}

/* ============================ helpers ============================ */
function evOn(dt){return EVENTS.filter(e=>e.date===key(dt) && S.filters.has(e.type));}
function statusStyle(e){
  const t=TYPES[e.type];
  if(e.status==='done')      return 'border-left-color:'+(t.solid||t.hue)+';background:'+(t.solid||t.hue)+';color:#fff';
  if(e.status==='scheduled') return 'border-left-color:'+t.hue+';background:'+t.tint+';color:'+t.deep;
  if(e.status==='waiting')   return 'border-left-color:'+t.hue+';background:#fff;color:'+t.deep+';border-top:1px dashed '+t.hue+';border-right:1px dashed '+t.hue+';border-bottom:1px dashed '+t.hue;
  return 'border-left-color:'+t.hue+';background:#fcfcfb;color:'+t.deep+';opacity:.8';
}
const STATUS_LABEL={done:'Sent',scheduled:'Scheduled',waiting:'Waiting on someone',drafting:'Drafting'};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function lastSunday(){let d=addDays(TODAY,0);while(d.getDay()!==0)d=addDays(d,-1);return d;}
function metricFor(dt){return METRICS[key(dt)]||null;}
function dueThisWeek(){
  const ws=weekStartOf(S.anchor), we=addDays(ws,6);
  return TASKS.filter(t=>{const d=D(t.due);return d>=ws&&d<=we&&!t.done;});
}
function dueSoon(){return TASKS.filter(t=>!t.done && D(t.due)>=addDays(TODAY,-1) && D(t.due)<=addDays(TODAY,21));}
function waiting(){return EVENTS.filter(e=>e.status==='waiting').length;}

/* ============================ nav ============================ */
function renderNav(){
  const allowed=ROLES[S.role].sections;
  const items=[];
  SECTIONS.forEach(sec=>{
    if(sec.group!==undefined){ items.push({divider:sec.group}); return; }
    if(!allowed.includes(sec.id)) return;
    items.push(sec);
  });
  // drop a divider if the group below it is empty
  const out=[];
  items.forEach((it,i)=>{
    if(it.divider!==undefined){
      const next=items[i+1];
      if(!next||next.divider!==undefined) return;
      out.push('<div class="navgroup">'+it.divider+'</div>');
      return;
    }
    out.push('<button data-go="'+it.id+'" class="'+(S.section===it.id?'on':'')+'">'+
      '<span class="tile" style="background:'+it.t+';color:'+it.h+'">'+ic(it.icon)+'</span>'+
      '<span>'+it.label+'</span>'+
      (it.restricted?'<span class="lock" title="Restricted">'+ic('lock')+'</span>':'')+
      (it.beta?'<span class="badge">BETA</span>':(it.count?'<span class="count">'+it.count+'</span>':''))+
      '</button>');
  });
  document.getElementById('nav').innerHTML=out.join('');
  const _who=document.getElementById('who'),_av=document.querySelector('.rail-foot .avatar');
  const _nm=(typeof ME!=='undefined'&&ME.name)?ME.name:'';
  if(_nm){_who.textContent=_nm;if(_av)_av.textContent=_nm.charAt(0).toUpperCase();}
}

/* ============================ pages ============================ */
function pageHome(){
  const ks=Object.keys(METRICS).sort();
  const lastK=ks[ks.length-1], m=lastK?METRICS[lastK]:null;
  const prev=ks.slice(0,-1).map(k=>METRICS[k].a);
  const avg=prev.length?Math.round(prev.reduce((a,b)=>a+b,0)/prev.length):0;
  const delta=(m&&avg)?Math.round(((m.a-avg)/avg)*1000)/10:0;
  const ws=weekStartOf(TODAY), we=addDays(ws,6);
  const twEvents=EVENTS.filter(e=>{const d=D(e.date);return d>=ws&&d<=we&&e.type==='event';});
  const twComms=EVENTS.filter(e=>{const d=D(e.date);return d>=ws&&d<=we&&e.type==='comms';});
  const upcoming=EVENTS.filter(e=>D(e.date)>=TODAY && e.type==='event').slice(0,5);
  const attn=ATTN.slice(0,6);
  return '<div class="page-head"><div><h1>Home</h1><div class="sub">'+pretty(TODAY)+' · week '+weekNum(TODAY)+'</div></div>'+
   '<a class="btn-primary" href="https://pm.mosaic.org" target="_blank" rel="noopener" style="text-decoration:none">New event</a></div>'+
   (DATA_ERR?'<div class="banner">'+ic('info')+'<div>'+esc(DATA_ERR)+'</div></div>':'')+
   '<div class="cards">'+
     card('This week',twEvents.length,twComms.length+' comms alongside','calendar','--session')+
     card('Waiting',attn.length,'speakers + flagged items','calendar','--magenta')+
     card('To close out',CLOSEOUT,'passed date, still open','planning','--milestone')+
     card('Attendance',m?m.a:'—',m?((delta>=0?'+':'')+delta+'% vs recent avg'):'no data yet','numbers','--gathering')+
   '</div>'+
   '<div class="cols"><div><h2>Worth a look</h2>'+
     (attn.length?attn.map(t=>'<button class="row" data-ev="'+t.evId+'"><span class="when">'+fmt(D(t.date))+'</span>'+
       '<span class="txt"><span class="name">'+esc(t.title)+'</span><span class="meta">'+esc(t.meta||'')+'</span></span></button>').join('')
       :'<div class="empty">Nothing waiting on anyone right now.</div>')+
   '</div><div><h2>Coming up</h2>'+
     (upcoming.length?upcoming.map(e=>'<button class="row" data-ev="'+e.id+'"><span class="when">'+fmt(D(e.date))+'</span>'+
       '<span class="txt"><span class="name">'+esc(e.title)+'</span><span class="meta">'+esc(e.detail||'')+'</span></span></button>').join('')
       :'<div class="empty">No upcoming events loaded.</div>')+
   '</div></div>';
}
function card(k,v,n,go,c){
  const bg=c?'background:var('+c+'-t);border-color:transparent':'';
  const fg=c?'color:var('+c+'-d)':'';
  return '<button class="card" data-go="'+go+'" style="'+bg+'"><div class="k" style="'+fg+';font-weight:500">'+k+
   '</div><div class="v" style="'+fg+'">'+v+'</div><div class="n">'+n+'</div></button>';
}
function taskRow(t){
  return '<button class="row" data-task="'+t.id+'"><span class="tick'+(t.done?' done':'')+'">'+(t.done?ic('check'):'')+'</span>'+
    '<span class="txt"><span class="name '+(t.done?'done-text':'')+'">'+esc(t.title)+'</span>'+
    '<span class="meta">'+(t.blocked?'Waiting on Carlos':esc(t.parent))+' · '+fmt(D(t.due))+' · '+esc(t.owner)+'</span></span></button>';

    '<button class="btn-ghost" data-nav="0">Today</button>'+

function filterBar(){

function legend(){

   '<span><i style="background:'+TYPES.comms.solid+'"></i>Sent</span>'+
   '<span><i style="background:'+TYPES.comms.tint+';border:1px solid '+TYPES.comms.hue+'"></i>Scheduled</span>'+
   '<span><i style="background:#fff;border:1px dashed '+TYPES.comms.hue+'"></i>Waiting on someone</span>'+
   '<span><i style="background:#fcfcfb;border:1px solid var(--grid)"></i>Drafting</span>'+
   '<span style="margin-left:auto">Hue = type · fill = status</span></div>';

function barsFor(ws){
  const we=addDays(ws,6);
  const rows=CAMPAIGNS.filter(c=>S.filters.has(c.type)&&D(c.start)<=we&&D(c.end)>=ws);
  if(!rows.length) return '';
  return rows.map(c=>{
    const s=Math.max(0,Math.round((D(c.start)-ws)/86400000));
    const e=Math.min(6,Math.round((D(c.end)-ws)/86400000));
    const t=TYPES[c.type];
    return '<div class="bars"><div style="grid-column:'+(s+1)+' / '+(e+2)+'">'+
      '<button class="bar" style="background:'+t.tint+';color:'+t.deep+'">'+esc(c.title)+'</button></div></div>';
  }).join('');
}
function weekGrid(ws){
  let h='<div class="wk-head">';
  for(let i=0;i<7;i++){const d=addDays(ws,i);
    h+='<div class="'+(same(d,TODAY)?'today':'')+'">'+DOW[i]+' '+d.getDate()+'</div>';}
  h+='</div>'+barsFor(ws)+'<div class="wk-body">';
  for(let i=0;i<7;i++){
    const d=addDays(ws,i), evs=evOn(d);
    h+='<div class="cell'+(i===0?' sun':'')+'">'+
      evs.map(e=>'<button class="ev" data-ev="'+e.id+'" style="'+statusStyle(e)+'">'+esc(e.title)+'</button>').join('')+
      '</div>';
  }
  return h+'</div>';
}
function monthGrid(){
  const first=new Date(S.month.getFullYear(),S.month.getMonth(),1);
  const start=weekStartOf(first);
  let h='<div class="wk-head">'+DOW.map(d=>'<div>'+d+'</div>').join('')+'</div>';
  for(let w=0;w<6;w++){
    const ws=addDays(start,w*7);
    if(w>0 && ws.getMonth()!==S.month.getMonth() && ws>first) break;
    h+='<div style="border-top:1px solid var(--grid)">'+barsFor(ws)+'<div class="wk-body" style="border-top:0">';
    for(let i=0;i<7;i++){
      const d=addDays(ws,i), evs=evOn(d), out=d.getMonth()!==S.month.getMonth();
      const show=evs.slice(0,2), rest=evs.length-show.length;
      h+='<div class="cell'+(i===0?' sun':'')+'" style="min-height:82px'+(out?';opacity:.4':'')+'">'+
        '<div class="daynum'+(same(d,TODAY)?' today':'')+'">'+(same(d,TODAY)?'<span>'+d.getDate()+'</span>':d.getDate())+'</div>'+
        show.map(e=>'<button class="ev" data-ev="'+e.id+'" style="'+statusStyle(e)+'">'+esc(e.title)+'</button>').join('')+
        (rest>0?'<button class="more" data-day="'+key(d)+'">+'+rest+' more</button>':'')+
      '</div>';
    }
    h+='</div></div>';
  }
  return h;
}

function pageEvent(){

  const d=D(e.date), t=TYPES[e.type], isSunday=(e.type==='event'&&d.getDay()===0);
  const m=isSunday?metricFor(d):null;
  const days=Math.round((d-TODAY)/86400000);
  const camp=e.campaign||null;
  const comms=EVENTS.filter(x=>x.type==='comms'&&((camp&&x.campaign===camp)||(!camp&&x.date===e.date)))
                    .sort((a,b)=>D(a.date)-D(b.date));

  const doneN=subs.filter(x=>x.done).length;
  const ks=Object.keys(METRICS).sort(), vals=ks.map(k=>METRICS[k].a);

  let h='<button class="back" data-back="1">'+ic('left')+'Back</button>'+
    '<div style="margin-bottom:6px">'+
      '<span class="tag" style="background:'+t.tint+';color:'+t.deep+'">'+t.label+'</span>'+
      (e.level?'<span class="tag">'+e.level+'</span>':'')+
      '<span class="tag">'+STATUS_LABEL[e.status]+'</span>'+

        '">'+STATUS_LABEL[c.status]+'</span></button>').join('')

          '<span class="meta" style="'+(overdue?'color:var(--red-d)':'')+'">'+esc(x.owner)+' · '+
          (overdue?(same(D(x.due),TODAY)?'due today':'overdue'):fmt(D(x.due)))+'</span></span></button>';

  h+='</div></div>'+

    '</div>';
  return h;

function render(){
  renderNav();

    : S.section==='giving'?pageGiving()
    : pageSettings();
  window.scrollTo(0,0);
  const rs=document.getElementById('roleSel');
  if(rs) rs.addEventListener('change',e=>{S.role=e.target.value;
    if(!ROLES[S.role].sections.includes(S.section))S.section='home'; render();});
}

/* ============================ events ============================ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-view],[data-nav],[data-filter],[data-ev],[data-day],[data-task],[data-new],[data-pick],[data-everyone],[data-tl],[data-back],[data-logout],[data-preview],[data-profile]');
  if(!t) return;
  if(t.dataset.logout){ (sb?sb.auth.signOut():Promise.resolve()).then(()=>location.reload()); return; }
  if(t.dataset.preview){
    ME.preview=!ME.preview;
    S.role=ME.preview?'comms':(ROLE_PRESET[ME.role]||'comms');
    if(!ROLES[S.role].sections.includes(S.section))S.section='home';
    umClose(); render(); return;
  }
  if(t.dataset.profile){ umClose(); profileDrawer(); return; }
  if(t.dataset.pick){
    const [type,tok]=t.dataset.pick.split('|');
    TYPES[type].hue='var('+tok+')';
    TYPES[type].tint='var('+tok+'-t)';
    TYPES[type].deep='var('+tok+'-d)';
    TYPES[type].solid='var('+tok+'-s)';
    render(); return;
  }
  if(t.dataset.everyone){ S.forEveryone=!S.forEveryone; render(); return; }
  if(t.dataset.tl!==undefined){ const n=Number(t.dataset.tl); S.tlShift = n===0?0:S.tlShift+n; render(); return; }
  if(t.dataset.go){ if(ROLES[S.role].sections.includes(t.dataset.go)){S.section=t.dataset.go; closeDrawer(); render();} return; }
  if(t.dataset.view){ S.view=t.dataset.view; render(); return; }
  if(t.dataset.nav!==undefined){
    const n=Number(t.dataset.nav);
    if(n===0){ S.anchor=new Date(TODAY); S.month=new Date(TODAY.getFullYear(),TODAY.getMonth(),1); }
    else if(S.view==='week'){ S.anchor=addDays(S.anchor,n*7); }
    else { S.month=new Date(S.month.getFullYear(),S.month.getMonth()+n,1); }
    render(); return;
  }
  if(t.dataset.filter){
    if(t.dataset.filter==='__all'){ S.filters=new Set(Object.keys(TYPES)); }
    else if(S.filters.has(t.dataset.filter)){ S.filters.delete(t.dataset.filter); }
    else { S.filters.add(t.dataset.filter); }
    render(); return;
  }
  if(t.dataset.ev){
    const ev=EVENTS.find(x=>x.id===t.dataset.ev);
    if(ev && ev.type==='event'){ S.from=S.section==='event'?(S.from||'calendar'):S.section; S.eventId=ev.id; S.section='event'; closeDrawer(); render(); }
    else { eventDrawer(t.dataset.ev); }
    return;
  }
  if(t.dataset.back){ S.section=S.from||'calendar'; render(); return; }
  if(t.dataset.day){ dayDrawer(t.dataset.day); return; }
  if(t.dataset.new){ newDrawer(); return; }
  if(t.dataset.task){
    const k=TASKS.find(x=>x.id===t.dataset.task); if(k) k.done=!k.done;
    const open=document.getElementById('drawer').classList.contains('open');
    render(); if(open) closeDrawer(); return;
  }
});

/* ============================ sign-in ============================
   Same Supabase project + accounts as Mosaic Metrics — every existing
   Metrics user, role and password works here unchanged. The session is
   stored in a cookie on .mosaic.org (chunked; sessions can exceed the
   ~4KB cookie limit) so future *.mosaic.org apps can share the sign-in;
   off mosaic.org it falls back to localStorage. */
const SUPABASE_URL="https://iknjgrltglwupxjtegfh.supabase.co";
const SUPABASE_ANON="sb_publishable_XUAFMzykMPBN2dBZJ0Z9jw__2MGNGIK";
const AUTH_COOKIE_OK=/\.mosaic\.org$/.test(location.hostname);
const AUTH_CHUNK=3000;
function _cookieAll(){const all={};document.cookie.split(/;\s*/).forEach(p=>{const i=p.indexOf("=");if(i>0)all[p.slice(0,i)]=p.slice(i+1);});return all;}
function _cookieGet(name){
  const all=_cookieAll();
  let raw=all[name];
  if(raw===undefined){raw="";let i=0;while(all[name+"."+i]!==undefined){raw+=all[name+"."+i];i++;}}
  if(!raw)return null;
  try{return decodeURIComponent(raw);}catch(e){return null;}
}
function _cookieSetRaw(k,v,maxAge){document.cookie=k+"="+v+";domain=.mosaic.org;path=/;max-age="+maxAge+";secure;samesite=lax";}
function _cookieClear(name){_cookieSetRaw(name,"",0);for(let i=0;i<20;i++)_cookieSetRaw(name+"."+i,"",0);}
const mosaicAuthStorage={
  getItem(key){
    if(AUTH_COOKIE_OK){const v=_cookieGet(key);if(v)return v;}
    try{return localStorage.getItem(key);}catch(e){return null;}
  },
  setItem(key,value){
    if(AUTH_COOKIE_OK){
      _cookieClear(key);
      const enc=encodeURIComponent(value);
      if(enc.length<=AUTH_CHUNK)_cookieSetRaw(key,enc,31536000);
      else for(let i=0;i*AUTH_CHUNK<enc.length;i++)_cookieSetRaw(key+"."+i,enc.slice(i*AUTH_CHUNK,(i+1)*AUTH_CHUNK),31536000);
    }
    try{localStorage.setItem(key,value);}catch(e){}
  },
  removeItem(key){
    if(AUTH_COOKIE_OK)_cookieClear(key);
    try{localStorage.removeItem(key);}catch(e){}
  }
};
const sb=(typeof supabase!=="undefined")?supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{storage:mosaicAuthStorage}}):null;
const ME={email:null,role:null,name:null};
/* Metrics roles → prototype role presets (which sections the rail shows).
   The Settings role switcher still works on top of this default. */
const ROLE_PRESET={admin:"leadership",staff:"comms",leader:"ops",volunteer:"volunteer"};
const $g=id=>document.getElementById(id);
function gateNote(msg,kind){const n=$g("gateNote");n.textContent=msg;n.className="gate-note show "+(kind||"err");}
function gateMode(mode){
  const show=(id,on)=>{const el=$g(id);if(el)el.style.display=on?"":"none";};
  show("g-email-row",mode!=="recover");
  show("g-pass-row",mode==="signin");
  show("g-newpass-rows",mode==="recover");
  show("gLoginBtn",mode==="signin");
  show("gSendResetBtn",mode==="forgot");
  show("gUpdatePassBtn",mode==="recover");
  show("gForgotLink",mode==="signin");
  show("gBackToSignIn",mode==="forgot");
  const n=$g("gateNote");if(n)n.className="gate-note";
  if(mode==="recover")gateNote("You're resetting your password — choose a new one below.","ok");
}
$g("gForgotLink").addEventListener("click",()=>gateMode("forgot"));
$g("gBackToSignIn").addEventListener("click",()=>gateMode("signin"));
async function gateSignIn(){
  if(!sb){gateNote("Can't reach the sign-in service — check your connection and reload the page.","err");return;}
  const email=$g("gEmail").value.trim(),password=$g("gPass").value;
  if(!email||!password){gateNote("Enter your email and password.","warn");return;}
  const btn=$g("gLoginBtn");btn.disabled=true;btn.textContent="Signing in…";
  const {error}=await sb.auth.signInWithPassword({email,password});
  btn.disabled=false;btn.textContent="Sign in";
  if(error){gateNote(error.message,"err");return;}
  enterPortal();
}
$g("gLoginBtn").addEventListener("click",gateSignIn);
$g("gPass").addEventListener("keydown",e=>{if(e.key==="Enter")gateSignIn();});
$g("gSendResetBtn").addEventListener("click",async()=>{
  if(!sb){gateNote("Can't reach the sign-in service — check your connection and reload the page.","err");return;}
  const email=$g("gEmail").value.trim();
  if(!email){gateNote("Enter your email first.","warn");return;}
  const btn=$g("gSendResetBtn");btn.disabled=true;btn.textContent="Sending…";
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  btn.disabled=false;btn.textContent="Email me a reset link";
  if(error){gateNote((error.message&&error.message!=="{}")?error.message:"Couldn't send the reset email — please try again in a minute, or contact an admin.","err");return;}
  gateNote("Reset link sent — check your inbox (it can take a minute; look in spam too).","ok");
});
$g("gUpdatePassBtn").addEventListener("click",async()=>{
  if(!sb){gateNote("Can't reach the sign-in service — check your connection and reload the page.","err");return;}
  const p1=$g("gNewPass").value,p2=$g("gNewPass2").value;
  if(p1.length<8){gateNote("Password needs at least 8 characters.","warn");return;}
  if(p1!==p2){gateNote("The two passwords don't match.","warn");return;}
  const btn=$g("gUpdatePassBtn");btn.disabled=true;btn.textContent="Saving…";
  const {error}=await sb.auth.updateUser({password:p1});
  btn.disabled=false;btn.textContent="Set new password";
  if(error){gateNote(error.message,"err");return;}
  history.replaceState(null,"",location.pathname);
  gateNote("Password updated — signing you in…","ok");
  setTimeout(()=>enterPortal(),600);
});
function prettyNameFromEmail(email){
  if(!email)return "";
  return email.split("@")[0].split(/[._-]+/).filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(" ");
}
/* ---- account menu (metrics-style, at the rail foot) ---- */
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):"";
const umPop=document.createElement("div");umPop.className="um-pop";document.body.appendChild(umPop);
function umClose(){umPop.classList.remove("open");}

    '<div class="um-sep"></div><button class="um-item" data-logout="1">'+ic("x")+'Log Out</button>';

document.addEventListener("click",e=>{

let BOOTED=false;
const PATH_SECTION={"/":"home","/home":"home","/calendar":"calendar","/comms":"comms","/pm":"planning","/planning":"planning","/metrics":"numbers","/numbers":"numbers","/goals":"goals","/budgets":"budgets","/giving":"giving","/settings":"settings"};
async function enterPortal(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return;
  ME.email=user.email;
  const {data:prof}=await sb.from("profiles").select("role,display_name,full_name").eq("id",user.id).single();
  if(prof){ME.role=prof.role;ME.name=prof.display_name||prof.full_name;}
  if(!ME.name||ME.name.includes("@"))ME.name=prettyNameFromEmail(ME.email);
  if(ROLE_PRESET[ME.role])S.role=ROLE_PRESET[ME.role];
  const want=PATH_SECTION[location.pathname.replace(/\/+$/,"")||"/"];
  if(want&&ROLES[S.role].sections.includes(want))S.section=want;
  const who=document.getElementById("who"),av=document.querySelector(".rail-foot .avatar");
  if(who)who.textContent=ME.name;
  if(av)av.textContent=(ME.name||"?").charAt(0).toUpperCase();
  $g("gate").classList.add("hide");
  if(!BOOTED){BOOTED=true;await loadLive();render();}
}
(function initAuth(){
  if(!sb){gateNote("Can't reach the sign-in service — check your connection and reload the page.","err");return;}
  const inviting=location.hash.includes("type=invite");
  const recovering=location.hash.includes("type=recovery")||inviting;
  if(recovering)gateMode("recover");
  if(inviting)gateNote("Welcome to the Mosaic Portal! Choose a password to finish setting up your account.","ok");
  sb.auth.onAuthStateChange(event=>{if(event==="PASSWORD_RECOVERY")gateMode("recover");});
  sb.auth.getSession().then(({data})=>{if(data.session&&!recovering)enterPortal();});
})();
