/* ---- handing the sign-in to an embedded app ----
   The portal signs a person in once for every app. That used to travel
   entirely in the cookie on .mosaic.org, which works in a normal window and
   does not work in every one — a private window is where it failed, and
   Chrome is narrowing what a framed page may read from storage regardless.

   So the frame asks its parent instead, and the parent is us. Both ends check
   the other's origin against *.mosaic.org and reply to that exact origin,
   never "*", so no other page can ask for a token or receive one. The
   localhost arm only opens when the portal itself is being served from
   localhost, which is only ever the test harness.

   The embedded app runs with autoRefreshToken off, so handing over the
   refresh token does not restart the rotation race that broke this: the
   portal stays the only client refreshing. */
const EMBED_TRUSTED=o=>/^https:\/\/[a-z0-9-]+\.mosaic\.org$/.test(o)||
  ((location.hostname==='127.0.0.1'||location.hostname==='localhost')&&
   /^https?:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/.test(o));
window.addEventListener('message',async e=>{
  if(!EMBED_TRUSTED(e.origin))return;
  if((e.data||{}).type!=='mosaic-auth-request')return;
  if(!sb||!e.source)return;
  const {data}=await sb.auth.getSession();
  const s=data&&data.session;
  // No session yet means the person is still signing in here. Staying quiet
  // is right: the frame keeps asking, and gets an answer when there is one.
  if(!s||!s.access_token||!s.refresh_token)return;
  try{e.source.postMessage(
    {type:'mosaic-auth',access_token:s.access_token,refresh_token:s.refresh_token},e.origin);}catch(_){}
});

/* An embedded app asking the portal to go somewhere else in the portal.
   Everything is meant to speak to each other in here rather than throwing
   people into a new tab, and until now only the portal could start a move: the
   planning board had no way to say "open Facilities on the new-request form
   with this event in it".

   Only two sections accept this, and only the fields those forms actually read.
   An allowlist rather than a pass-through, because this arrives from a framed
   page: anything it can put in the URL, it could put anything in. Origin is
   already checked above against *.mosaic.org. */
/* The portal answering for the apps that need a sign-in.
   ------------------------------------------------------
   The planning board shows what the other apps hold about an event, on the
   event. Comms it reads itself — same Supabase project, readable without a
   sign-in by decision. Rooms and attendance it cannot: both live in the Mosaic
   Metrics project behind RLS keyed to auth.uid(), and the board runs on a
   publishable key with no session at all.

   So it asks, and the portal answers with the signed-in person's own session.
   That is the point rather than a workaround: the panel shows exactly what
   THIS person is allowed to see, decided by the same policies the Facilities
   and Metrics apps enforce, instead of a fixed projection somebody has to
   remember to keep narrow.

   Only the fields the panel draws are sent back. A booking carries internal
   notes and a requester's phone number, and a card on the planning board is
   not where either belongs. */
const FAC_CONN_FIELDS='id,ref,title,status,campus_name,space_name,block_start,block_end,'+
  'resource_count,resource_pending_count,archived_at,board_item_id';
async function connectedFor(item){
  const out={facilities:[],metrics:[]};
  if(!sb||!item||!item.id)return out;
  try{
    const {data}=await sb.from('v_fac_requests').select(FAC_CONN_FIELDS)
      .eq('board_item_id',item.id).is('archived_at',null).order('block_start');
    out.facilities=(data||[]).map(r=>({ref:r.ref,title:r.title,status:r.status,
      campus_name:r.campus_name,space_name:r.space_name,
      resource_pending_count:r.resource_pending_count||0,
      when:r.block_start?new Date(r.block_start).toLocaleString([],
        {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''}));
  }catch(_){/* the panel says nothing rather than guessing */}
  /* Attendance has no board_item_id to match on, so it is matched on the date
     and the campus and the board labels it as such. For a Sunday that is the
     definition of the thing; for anything else it is a suggestion, and saying
     otherwise is how the wrong numbers get attached to an event. */
  try{
    if(item.date){
      const cid=await campusIdFor(item.campus);
      let q=sb.from('v_service_totals')
        .select('campus_id,date,service_label,in_person_total,online_views')
        .eq('date',item.date);
      if(cid)q=q.eq('campus_id',cid);
      const {data}=await q;
      out.metrics=(data||[]).map(r=>({service_label:r.service_label,
        campus_name:CAMPUS_NAME[r.campus_id]||'',
        in_person_total:r.in_person_total,online_views:r.online_views}));
    }
  }catch(_){}
  return out;
}
/* The board's campus vocabulary is "LA"/"NYC"/"Global"; this project's is
   "Los Angeles"/"New York City". Matching on the name alone matches nothing —
   the same trap the Facilities prefill hit. Fetched once and kept. */
const BOARD_CAMPUS={la:['Los Angeles'],nyc:['New York City','New York']};
let CAMPUS_NAME={},CAMPUS_BY_NAME=null;
async function campusIdFor(boardName){
  if(!boardName||!sb)return null;
  if(!CAMPUS_BY_NAME){
    try{
      const {data}=await sb.from('campuses').select('id,name');
      CAMPUS_BY_NAME={};(data||[]).forEach(c=>{
        CAMPUS_BY_NAME[(c.name||'').toLowerCase()]=c.id;CAMPUS_NAME[c.id]=c.name;});
    }catch(_){CAMPUS_BY_NAME={};}
  }
  const want=BOARD_CAMPUS[String(boardName).toLowerCase()]||[boardName];
  for(const w of want){const id=CAMPUS_BY_NAME[String(w).toLowerCase()];if(id)return id;}
  return null;
}
window.addEventListener('message',async e=>{
  if(!EMBED_TRUSTED(e.origin))return;
  const d=e.data||{};
  if(d.type!=='mosaic-connected-request')return;
  const item=d.item||{};
  if(!item.id||typeof item.id!=='string'||!e.source)return;
  const got=await connectedFor(item);
  try{e.source.postMessage(Object.assign({type:'mosaic-connected',item_id:item.id},got),e.origin);}catch(_){}
});

const NAV_ALLOWED={
  facilities:['board_item','title','date','end_date','start','end','campus','purpose'],
  comms:     ['board_item','title','date','campus','purpose'],
  numbers:   ['board_item','title','date','campus'],
  /* Planning is the one the facilities event card actually asks for, and it
     was the only section missing here — "Planning board" on that card fell
     through the `if(!allowed)` below and opened a new tab, which is exactly
     what Hannita asked it to stop doing on 10 Sep: "when we're looking at it
     from the portal, it shouldn't open a new link — it should just open up
     the section in the app of the portal." */
  planning:  ['board_item','item','title','date','campus']};
window.addEventListener('message',e=>{
  if(!EMBED_TRUSTED(e.origin))return;
  const d=e.data||{};
  /* "CAN YOU?" BEFORE "PLEASE DO."
     A framed app cannot tell whether the portal around it listens for this,
     and finding out by trying is worse than it sounds: the answer arrives
     after the click, and window.open from inside a frame with no user gesture
     behind it is silently blocked. So the frame asks once on load and renders
     either a button or a plain link, and this replies. */
  if(d.type==='mosaic-can-navigate'){
    try{if(e.source)e.source.postMessage({type:'mosaic-navigate-ok'},e.origin);}catch(_){}
    return;
  }
  if(d.type!=='mosaic-navigate')return;
  const sec=SECTIONS.find(x=>x.id===d.section);
  // Silently ignoring an unknown or locked section is right: a framed app should
  // not be able to reach a part of the portal this person cannot see anyway.
  if(!sec||!allowedSections().includes(sec.id))return;
  const allowed=NAV_ALLOWED[sec.id];
  if(!allowed)return;   // a section nobody has said may be arrived at this way
  /* Kept per section, not in one shared bag: arriving at Comms must not leave
     an event's details sitting on the Facilities frame's URL.

     And only when the frame actually asked for a form. "Open Planning" with
     no page and no params is just a move between sections, and defaulting it
     to page=new would land somebody on the board's new-item form when all
     they clicked was the name of the app they were already looking at. */
  const page=(typeof d.page==='string'&&/^[a-z]{1,20}$/.test(d.page))?d.page:'';
  const params={};
  for(const k of allowed){
    const v=d.params&&d.params[k];
    if(typeof v==='string'&&v)params[k]=v.slice(0,2000);
  }
  if(page||Object.keys(params).length){
    S.navBook=S.navBook||{};
    S.navBook[sec.id]={page:page||'new',params};
  } else if(S.navBook){ delete S.navBook[sec.id]; }
  if(sec.id==='facilities')S.facPath=(page==='new')?'new':(S.facPath||'requests');
  S.section=sec.id;
  try{history.pushState({},'',SECTION_PATH[sec.id]||'/');}catch(_){}
  render();
  // Tell the frame it landed, so it does not open a tab as well.
  try{if(e.source)e.source.postMessage({type:'mosaic-navigated',section:sec.id},e.origin);}catch(_){}
});

/* ============================ preview (view as staff/leader/volunteer) ============================ */
const PREVIEW_ROLE_PRESET={staff:'comms',campus_pastor:'comms',leader:'ops',volunteer:'volunteer'};

function _previewPickCampus(){
  // Use already-loaded campuses list, falling back gracefully if not loaded yet
  const campuses=(ADMIN.campuses||[]).filter(c=>c.active!==false);
  if(!campuses.length)return null;
  return (campuses.find(c=>c.id===ME.campus_id)||campuses[0]).id;
}

async function enterPreview(role){
  if(ME.preview)exitPreview(); // exit any existing preview first
  if(!ADMIN.campuses)await loadAdmin().catch(()=>{});
  ME.preview=true;
  ME.previewRole=role;
  _previewRealCampus=ME.campus_id;
  if(!_previewCampusId)_previewCampusId=_previewPickCampus();
  S.role=PREVIEW_ROLE_PRESET[role]||'comms';
  if(!allowedSections().includes(S.section))S.section='home';
  document.body.classList.add('previewing');
  _showPreviewBanner();
  render();
}

function exitPreview(){
  if(!ME.preview)return;
  ME.preview=false;
  ME.previewRole=null;
  ME.campus_id=_previewRealCampus;
  _previewRealCampus=null;
  _previewCampusId=null;
  S.role=ROLE_PRESET[ME.role]||'comms';
  if(!allowedSections().includes(S.section))S.section='home';
  document.body.classList.remove('previewing');
  _hidePreviewBanner();
  render();
}

function _showPreviewBanner(){
  let bar=document.getElementById('previewBar');
  if(!bar){
    bar=document.createElement('div');
    bar.id='previewBar';
    document.body.appendChild(bar);
    bar.addEventListener('click',e=>{if(e.target.classList.contains('pb-exit'))exitPreview();});
    bar.addEventListener('change',e=>{
      if(e.target.classList.contains('pb-campus')){
        _previewCampusId=e.target.value;
      }
      if(e.target.classList.contains('pb-role')){
        const newRole=e.target.value;
        ME.previewRole=newRole;
        S.role=PREVIEW_ROLE_PRESET[newRole]||'comms';
        if(!allowedSections().includes(S.section))S.section='home';
        _showPreviewBanner(); // re-render to update exit button label
        render();
      }
    });
  }
  const ROLE_ACCENT={staff:'var(--gathering)',campus_pastor:'var(--indigo)',leader:'var(--milestone)',volunteer:'var(--session)'};
  bar.style.setProperty('--pb-accent',ROLE_ACCENT[ME.previewRole]||'var(--comms)');
  const campuses=(ADMIN.campuses||[]).filter(c=>c.active!==false);
  const roleLabel=PREVIEW_ROLE_LABEL[ME.previewRole]||ME.previewRole||'';
  const eyeSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const roleOpts=Object.keys(PREVIEW_ROLE_LABEL).map(r=>'<option value="'+r+'"'+(r===ME.previewRole?' selected':'')+'>'+PREVIEW_ROLE_LABEL[r]+'</option>').join('');
  let campusHtml='';
  if(campuses.length>1){
    const opts=campuses.map(c=>'<option value="'+c.id+'"'+(c.id===_previewCampusId?' selected':'')+'>'+esc(c.name)+'</option>').join('');
    campusHtml=' · <select class="pb-campus" aria-label="Switch campus">'+opts+'</select>';
  } else if(campuses.length===1){
    campusHtml=' · <span>'+esc(campuses[0].name)+'</span>';
  }
  bar.innerHTML=eyeSvg+
    '<span><span class="pb-label">Previewing as </span>'+
    '<select class="pb-role" aria-label="Switch role">'+roleOpts+'</select>'+
    campusHtml+'</span>'+
    '<button class="pb-exit" type="button">Exit '+esc(roleLabel)+' view</button>';
}

function _hidePreviewBanner(){
  const bar=document.getElementById('previewBar');
  if(bar)bar.remove();
}

/* ============================ sign-in ============================
   Same Supabase project + accounts as Mosaic Metrics — every existing
   Metrics user, role and password works here unchanged. The session is
   stored in a cookie on .mosaic.org (chunked; sessions can exceed the
   ~4KB cookie limit) so future *.mosaic.org apps can share the sign-in;
   off mosaic.org it falls back to localStorage. */
const SUPABASE_URL="https://iknjgrltglwupxjtegfh.supabase.co";
const SUPABASE_ANON="sb_publishable_XUAFMzykMPBN2dBZJ0Z9jw__2MGNGIK";
const AUTH_COOKIE_OK=/\.mosaic\.org$/.test(location.hostname);
const AUTH_CHUNK=3000;
function _cookieAll(){const all={};document.cookie.split(/;\s*/).forEach(p=>{const i=p.indexOf("=");if(i>0)all[p.slice(0,i)]=p.slice(i+1);});return all;}
function _cookieGet(name){
  const all=_cookieAll();
  let raw=all[name];
  if(raw===undefined){raw="";let i=0;while(all[name+"."+i]!==undefined){raw+=all[name+"."+i];i++;}}
  if(!raw)return null;
  try{return decodeURIComponent(raw);}catch(e){return null;}
}
function _cookieSetRaw(k,v,maxAge){document.cookie=k+"="+v+";domain=.mosaic.org;path=/;max-age="+maxAge+";secure;samesite=lax";}
function _cookieClear(name){_cookieSetRaw(name,"",0);for(let i=0;i<20;i++)_cookieSetRaw(name+"."+i,"",0);}
const mosaicAuthStorage={
  getItem(key){
    if(AUTH_COOKIE_OK){const v=_cookieGet(key);if(v)return v;}
    try{return localStorage.getItem(key);}catch(e){return null;}
  },
  setItem(key,value){
    if(AUTH_COOKIE_OK){
      _cookieClear(key);
      const enc=encodeURIComponent(value);
      if(enc.length<=AUTH_CHUNK)_cookieSetRaw(key,enc,31536000);
      else for(let i=0;i*AUTH_CHUNK<enc.length;i++)_cookieSetRaw(key+"."+i,enc.slice(i*AUTH_CHUNK,(i+1)*AUTH_CHUNK),31536000);
    }
    try{localStorage.setItem(key,value);}catch(e){}
  },
  removeItem(key){
    if(AUTH_COOKIE_OK)_cookieClear(key);
    try{localStorage.removeItem(key);}catch(e){}
  }
};
const sb=(typeof supabase!=="undefined")?supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{storage:mosaicAuthStorage}}):null;
/* Supabase only writes to storage when the session changes, so anyone who
   signed in before the shared cookie existed still has their session in
   localStorage only — and the embedded apps, which read the cookie, would
   show their own login. Copy it across on load so one sign-in really is one
   sign-in. */
function primeSharedSession(session){
  if(!AUTH_COOKIE_OK||!session)return;
  const ref=SUPABASE_URL.replace(/^https?:\/\//,'').split('.')[0];
  const key='sb-'+ref+'-auth-token';
  if(_cookieGet(key))return;
  let raw=null;try{raw=localStorage.getItem(key);}catch(e){}
  try{mosaicAuthStorage.setItem(key,raw||JSON.stringify(session));}catch(e){}
}

  if(!sb){gateNote("Can't reach the sign-in service — check your connection and reload the page.","err");return;}
  const p1=$g("gNewPass").value,p2=$g("gNewPass2").value;
  if(p1.length<8){gateNote("Password needs at least 8 characters.","warn");return;}
  if(p1!==p2){gateNote("The two passwords don't match.","warn");return;}
  const btn=$g("gUpdatePassBtn");btn.disabled=true;btn.textContent="Saving…";
  const {error}=await sb.auth.updateUser({password:p1});
  btn.disabled=false;btn.textContent="Set new password";
  if(error){gateNote(error.message,"err");return;}
  history.replaceState(null,"",location.pathname);
  gateNote("Password updated — signing you in…","ok");
  setTimeout(()=>enterPortal(),600);
});
function prettyNameFromEmail(email){
  if(!email)return "";
  return email.split("@")[0].split(/[._-]+/).filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(" ");
}

const ROLE_LABEL={admin:'Admin',staff:'Staff',campus_pastor:'Campus Pastor',leader:'Leader',volunteer:'Volunteer'};
const roleLabel=r=>ROLE_LABEL[r]||cap(r);

/* Appearance — per person, per device. Stored under the signed-in email so a

let THEME='system';
let RAILMIN=false;
function railKey(){return 'mosaic-rail:'+(ME.email||'anon');}
function applyRail(){

        b.title=(RAILMIN?'Expand':'Collapse')+' sidebar (⌘\\)';}

function themeKey(){return 'mosaic-theme:'+(ME.email||'anon');}
function applyTheme(){

const initialsOf=n=>{const p=String(n||"").trim().split(/\s+/).filter(Boolean);return !p.length?"?":(p.length===1?p[0].slice(0,2):p[0][0]+p[p.length-1][0]).toUpperCase();};
/* If the photo file has gone (deleted from storage, bad URL), fall back to
   the initials rather than leaving a broken-image icon in the circle. */
function avatarHtml(url,name){

  return url
    ? '<img src="'+esc(url)+'" alt="" onerror="if(this.parentNode)this.parentNode.textContent=\''+ini.replace(/'/g,"\\'")+'\'">'

}

async function profilePage(){

  if(!document.getElementById('pfBody'))return;   // they navigated away while it loaded
  const roleLab=ME.role==='admin'?'Admin':cap(ME.role||'');

  const eyebrow='letter-spacing:.13em;text-transform:uppercase;color:var(--text2);font-size:11px;font-weight:700';

    '<div class="pf-grid">'+
      '<div class="pa-card pf-main">'+
        '<div class="pf-cardsec" style="'+eyebrow+'">Your account</div>'+
        '<div class="pf-av"><span class="ring" id="pfRing">'+avatarHtml(ME.avatar_url,ME.name)+'</span>'+
          '<div><button class="btn-primary" id="pfPhotoBtn" style="padding:7px 13px;font-size:12.5px">'+(ME.avatar_url?'Change photo':'Upload photo')+'</button>'+

        '<div class="kv"><span>Email</span><span>'+esc(ME.email||'')+'</span></div>'+
        '<div class="kv"><span>Role</span><span>'+esc(roleLab)+'</span></div>'+
        '<div class="kv" style="border-bottom:0"><span>Campus</span><span>'+esc(campusLab)+'</span></div>'+
        '<button class="btn-primary" id="pfSaveName" style="margin-top:14px">Save name</button>'+
        '<p style="font-size:12.5px;color:var(--text2);margin:14px 0 0;line-height:1.5">Role and campus are set by an administrator.</p>'+
      '</div>'+
      '<div class="pf-side">'+
        '<div class="pa-card">'+
          '<div class="pf-cardsec" style="'+eyebrow+'">Password</div>'+
          '<p style="font-size:13px;color:var(--text2);margin:0 0 12px">We\'ll email you a secure link to set a new password.</p>'+
          '<button class="btn-primary" id="pfReset">Email me a reset link</button>'+
        '</div>'+
        '<div class="pa-card">'+
          '<div class="pf-cardsec" style="'+eyebrow+'">Appearance</div>'+
          '<div class="ap-seg" id="pfTheme">'+
            ['light','dark','system'].map(t=>'<button data-theme="'+t+'" class="'+(THEME===t?'on':'')+'">'+cap(t)+'</button>').join('')+
          '</div>'+
          '<p style="font-size:12.5px;color:var(--text2);margin:10px 0 0;line-height:1.5">Just for you, on this device — nobody else\'s view changes. System follows your computer\'s setting. The apps shown inside the portal (Metrics, Comms, Planning) still render in their own light theme.</p>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div id="pfNote" style="font-size:12.5px;margin-top:14px;color:var(--text2)"></div>';
  /* photo upload — stored at avatars/<your user id>/<file>, which is the only
     folder the storage policy lets you write to. */
  const fileIn=document.getElementById('pfPhotoIn');
  document.getElementById('pfPhotoBtn').addEventListener('click',()=>fileIn.click());
  fileIn.addEventListener('change',async()=>{
    const f=fileIn.files&&fileIn.files[0];if(!f)return;
    const n=document.getElementById('pfNote');
    if(f.size>2*1024*1024){n.textContent='That photo is over 2 MB — please pick a smaller one.';return;}

let BOOTED=false;
const PATH_SECTION={"/":"home","/home":"home","/calendar":"calendar","/comms":"comms","/pm":"planning","/planning":"planning","/facilities":"facilities","/numbers":"numbers","/metrics":"numbers","/goals":"goals","/budgets":"budgets","/giving":"giving","/settings":"settings","/admin":"admin"};
async function enterPortal(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return;
  try{const {data:s}=await sb.auth.getSession();primeSharedSession(s&&s.session);}catch(e){}
  ME.email=user.email;
  const {data:prof}=await sb.from("profiles").select("role,display_name,full_name,campus_id,avatar_url,app_access,campus_ids").eq("id",user.id).single();
  if(prof){ME.role=prof.role;ME.name=prof.display_name||prof.full_name;ME.campus_id=prof.campus_id;ME.avatar_url=prof.avatar_url;ME.app_access=prof.app_access;ME.campus_ids=prof.campus_ids;}
  if(!ME.name||ME.name.includes("@"))ME.name=prettyNameFromEmail(ME.email);
  if(ROLE_PRESET[ME.role])S.role=ROLE_PRESET[ME.role];
  /* The calendar opens on your own campus, because that is what you came to
     look at — "the default campus would be based off of the campus that
     you're a part of" (Hannita, 8 Sep). Everything with no campus of its own
     still shows, and All campuses is one click away. */
  if(prof&&prof.campus_id){
    try{
      const {data:c}=await sb.from('campuses').select('name').eq('id',prof.campus_id).single();
      if(c&&c.name)S.campus=CAMPUS_ALIAS[c.name.toLowerCase()]||c.name;
    }catch(_){/* no campus name, no default — All campuses is a fine start */}
  }
  loadTheme();
  const want=PATH_SECTION[location.pathname.replace(/\/+$/,"")||"/"];
  if(want&&allowedSections().includes(want))S.section=want;
  const who=document.getElementById("who"),av=document.querySelector(".rail-foot .avatar");
  if(who)who.textContent=ME.name;
  if(av)av.innerHTML=avatarHtml(ME.avatar_url,ME.name);
  $g("gate").classList.add("hide");
  if(!BOOTED){
    BOOTED=true;await loadLive();render();
    // The shared calendar is extra context, so it loads after the page is
    // usable and re-renders when it lands. Awaiting it before the first paint
    // meant one slow Microsoft call left staff staring at an empty screen.
    // Same reasoning for both of the extras: load after the first paint, and
    // repaint when each one lands.
    loadCalendar().then(()=>{if(BOOTED)render();});
    loadFacilities().then(()=>{if(BOOTED)render();});
    /* Come back to the tab and you get current data. There's no push from
       Outlook or the planning board, so a tab left open all afternoon would
       otherwise still show the morning. Refetch on return, at most once a
       minute, and never while someone is mid-edit in a drawer. */
    let lastLoad=Date.now();
    document.addEventListener('visibilitychange',async()=>{
      if(document.hidden)return;
      if(Date.now()-lastLoad<60000)return;
      if(document.getElementById('drawer').classList.contains('open'))return;
      lastLoad=Date.now();await loadLive();render();
      loadCalendar().then(()=>render());
      loadFacilities().then(()=>render());
    });
  }
}
(function initAuth(){
  if(!sb){gateNote("Can't reach the sign-in service — check your connection and reload the page.","err");return;}
  /* A reset or invite link reaches us one of two ways. The old implicit flow
     puts type=recovery or type=invite in the hash. PKCE puts ?code= in the
     query string and, on its own, says NOTHING about which of the two it was —
     which is why an invited person was being shown the recovery copy.
     So: read the type wherever it turns up, and when there is none, use
     wording true of either until supabase-js tells us. It fires
     PASSWORD_RECOVERY for a recovery link and not for an invite, so the card
     corrects itself a moment later.
     (The lasting fix is on the email side: point the invite template at
     ?token_hash=…&type=invite so the type is always there.) */
  const hash=new URLSearchParams(location.hash.replace(/^#/,""));
  const qs=new URLSearchParams(location.search);
  /* ?t=invite is ours, set on redirect_to when the invite goes out, because a
     PKCE link on its own says nothing about which kind it was. It is read
     last, so a real type= from Supabase always wins.
     Not done in the email template instead: the Invite user template is shared
     with Metrics, which sends its own invites with its own redirect_to, and a
     template that composes the URL itself would send everybody to the portal. */
  const linkType=hash.get("type")||qs.get("type")||(qs.get("t")==="invite"?"invite":"")||"";
  const hasPkceCode=qs.has("code");
  const inviting=linkType==="invite";
  const recovering=linkType==="recovery";
  // Any of the three means the person is here to set a password, so don't
  // drop them into the portal before they have one.
  const settingPassword=inviting||recovering||hasPkceCode;
  if(inviting)gateMode("invite");
  else if(recovering)gateMode("recover");
  else if(hasPkceCode)gateMode("setpass");
  sb.auth.onAuthStateChange(event=>{if(event==="PASSWORD_RECOVERY"&&!inviting)gateMode("recover");});
  sb.auth.getSession().then(({data})=>{if(data.session){primeSharedSession(data.session);if(!settingPassword)enterPortal();}});
})();
</script>
