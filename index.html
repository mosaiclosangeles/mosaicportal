/* ============================ helpers ============================ */
/* ONE CARD PER EVENT, NOT ONE LINE PER CALENDAR.
   Hannita, 10 Sep: "have the calendar have event cards instead of actually
   showing the lines from each calendar. So 1 card has the info from all the
   places that event is seen." Which is Loyda's architecture applied to the
   grid — the same event was drawn three times because three systems hold it:
   Men's Camp arrived as a planning item, as "Mens Camp" on the shared Outlook
   calendar and as a room booking, and the week looked three times as busy as
   it was.

   Matching is deliberately strict — same day, and the same title once
   punctuation, case and a leading "MON 09/07" prefix are taken off. Nothing
   fuzzy: "Mens Camp" and "Men's Camp" merge, "Choir" and "Choir Rehearsal" do
   not. Two different events that really do share a name on one day would
   merge, which is why the card shows a dot per source it drew from — the
   merge is visible, not silent, and clicking still lists every part.

   The card keeps the LEAD part's id, so every existing path — the drawer, the
   deep links into Planning and Comms — works untouched. The rest hang off
   .parts. */
const SOURCE_RANK=['event','other','away','facility','comms'];
function normTitle(t){
  return String(t||'')
    // "MON 09/07 Mens Camp" — someone's own note to themselves, not the name
    .replace(/^\s*(mon|tue|tues|wed|weds|thu|thur|thurs|fri|sat|sun)[a-z]*\.?\s*\d{1,2}[\/.-]\d{1,2}([\/.-]\d{2,4})?\s*/i,'')
    // Apostrophes come out, they do not become spaces: the board writes
    // "Men's Camp" and the Outlook calendar writes "Mens Camp", and turning
    // the first into "men s camp" is precisely how the two would fail to meet.
    .replace(/[\u2019'\u00b4\u02bc]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
/* WHICH COMMS BELONG TO AN EVENT — by subject, not by date.
   Hannita, 10 Sep: "a Team Huddle has nothing to do with an ERM text. For the
   men's event it will be a men's text or the men's email. Even if it was a
   past date or a future date within that week."

   Both earlier rules were wrong in opposite directions. Same-day swept in
   anything that happened to share a date; exact title matched almost nothing,
   because a comm is named for its channel as much as its subject — "Bible
   Studies" against "Regional Bible Study PM Staff Lead".

   So: strip the words that describe the channel or the timing rather than the
   subject, stem the plurals, and ask whether every distinctive word left in
   the COMM's name appears in the event's. "Bible Studies" → bible, study, both
   in "Regional Bible Study PM Staff Lead" — related. "ERM Text" → erm, which
   is in neither Team Huddle nor Men's Camp — not related. It reads one way on
   purpose: a comm is usually named more narrowly than the event it serves. */
const COMM_GENERIC=/^(email|text|script|reminder|promo|invite|announcement|post|social|newsletter|recap|update|opportunitie|opportunity|tomorrow|today|week|weekly|thi|next|last|the|and|for|of|to|in|on|at|mosaic|sunday|monday|tuesday|wednesday|thursday|friday|saturday|mon|tue|wed|thu|fri|sat|sun)$/;
function subjectWords(t){
  return normTitle(t).split(' ')
    .map(w=>w.replace(/s$/,''))              // studies → studie → study is close enough
    .map(w=>w.replace(/ie$/,'y'))
    .filter(w=>w.length>2&&!COMM_GENERIC.test(w));
}
/* How far either side of an event a comm can still be about it. With the
   milestones now in the mirror that is the item's own runway — Kick-Off to
   Debrief, which is exactly the window its promotion runs in. Without them,
   three weeks either side. */
function commWindow(e){
  const ms=e.milestones;
  if(ms&&ms.kickoff&&ms.debrief)return [D(ms.kickoff),D(ms.debrief)];
  const a=D(e.date), b=D(e.dateEnd||e.date);
  return [addDays(a,-21),addDays(b,21)];
}
/* Whether a comm belongs to an event.

   When the comm carries board_item_id, that is not a guess — somebody said so,
   by starting the message from that event's card — and it is the answer, both
   ways: a comm claimed by one event must not also attach itself to another it
   happens to share words with. This is the upstream fix the subject matching
   below was always waiting for; it applies to messages written since
   comm_events gained the column, and the inference still carries everything
   written before that. */
function commRelated(c,e){
  const cw=subjectWords(c.title), ew=new Set(subjectWords(e.title));
  if(!cw.length||!ew.size)return false;
  return cw.every(w=>ew.has(w));
}
/* WHEN SOMEBODY HAS SAID, WE DO NOT GUESS.
   comm_events.board_item_id is the comms app's "For which event?" picker.
   Set, it is the whole answer: no window and no word matching, and the comm
   belongs to that item and to no other — a message named for Men's Camp does
   not also drift onto Regional Bible Studies because two words happened to
   line up. Null means nobody has said, so the inference above still runs.
   That is the one-way door this needs: filling the field can only ever make
   the answer more right, never less. */
function commLink(c,e){
  if(c.boardItemId)return c.boardItemId===e.boardId;
  const d=D(c.date), [a,b]=commWindow(e);
  return d>=a&&d<=b&&commRelated(c,e);
}
function mergeCards(list){
  const groups=new Map(), loose=[];
  list.forEach(e=>{
    const n=normTitle(e.title);
    if(!n){loose.push(Object.assign({},e,{parts:[e]}));return;}
    const k=e.date+'|'+n;
    if(!groups.has(k))groups.set(k,[]);
    groups.get(k).push(e);
  });
  const out=loose;
  groups.forEach(parts=>{
    // The planning board holds the richest record, so it leads when present —
    // but only among the parts still on screen, or turning a row off would
    // leave a card wearing the colour of a row that is not showing.
    const pick=f=>SOURCE_RANK.map(t=>parts.find(x=>x.type===t&&f(x))).find(Boolean);
    const lead=pick(shown)||pick(()=>true)||parts[0];
    out.push(Object.assign({},lead,{parts}));
  });
  return out;
}
/* MERGE FIRST, THEN FILTER — the order matters, and getting it backwards cost
   Men's Camp its whole record. Filtering first meant each part was judged
   alone: with the campus picker on Mexico, the board's LA item was dropped and
   the shared calendar's "Mens Camp", which carries no campus, survived on its
   own. The card left standing was the thin copy — a title, two dates, nothing
   else — while the record with David, the phase and the description had been
   thrown away before the merge could reach it.
   So: group everything on the day, then keep the cards where SOMETHING is
   still on screen. A filter decides which cards appear, never what a card is
   allowed to know about itself. */
function evOn(dt){
  return mergeCards(EVENTS.filter(e=>e.date===key(dt)&&laneOf(e)))
         .filter(c=>(c.parts||[c]).some(shown));
}
/* The dots under a merged card's name: one per source it drew from, in the
   order the sources are listed on the filter row. */
function partDots(e){
  if(!e.parts||e.parts.length<2)return '';
  const seen=[];
  e.parts.forEach(x=>{const src=laneOf(x);if(src&&!seen.includes(src))seen.push(src);});
  if(seen.length<2)return '';
  return '<span class="evdots">'+seen.map(src=>
    '<i style="background:'+SOURCES[src].hue+'" title="'+esc(SOURCES[src].label)+'"></i>').join('')+'</span>';
}
/* What a merged card knows that no single part does: the room booking's
   decision, alongside the board's owner and phase. This is the "facilities
   check or pending" Loyda asked to see on an event, and it is honest now
   because a booking actually merged into this card. */
function partFacts(e){
  const parts=e.parts||[e], f={};
  const fac=parts.find(x=>x.type==='facility');
  if(fac)f.facility=fac;
  parts.forEach(x=>{
    if(x.owner&&!f.owner)f.owner=x.owner;
    if(x.phase&&!f.phase)f.phase=x.phase;
    if(x.speaker&&!f.speaker)f.speaker=x.speaker;
    if(x.campus&&!f.campus)f.campus=campusOf(x);
    if(x.level&&!f.level)f.level=x.level;
  });
  return f;
}
/* A LOCATION THAT IS A LINK IS "ONLINE".
   Outlook keeps the meeting URL in the location field, so an Arena call
   arrived with "https://us06web.zoom.us/meeting/register/zBMZF-CySGeLrpoiNaKiig"
   standing where the room should be — on the card's own subtitle, in the list,
   and a third time under Where. Hannita, 10 Sep: "if an event has a zoom link
   then location should be ONLINE", and "any card with a link should have the
   hyperlink".

   So the two are separated rather than one printed over the other: placeOf()
   answers where it is, meetLink() answers how to get in, and linkify() makes
   any address left in the text followable instead of something to select and
   copy out of a modal. A hybrid location keeps its room and gains "· Online",
   because "Rialto Auditorium; https://zoom…" means both.

   The URL is never dropped from the data, only from the place — a card that
   quietly lost the only way into the meeting would be worse than an ugly one. */
const URL_RX=()=>/https?:\/\/[^\s<>"')\]]+/g;
const MEET_HOST=/(^|\.)(zoom\.us|teams\.microsoft\.com|teams\.live\.com|meet\.google\.com|webex\.com|whereby\.com|gotomeeting\.com|bluejeans\.com|chime\.aws)$/i;
const MEET_NAME={'zoom.us':'Zoom','teams.microsoft.com':'Teams','teams.live.com':'Teams',
  'meet.google.com':'Google Meet','webex.com':'Webex','whereby.com':'Whereby',
  'gotomeeting.com':'GoToMeeting','bluejeans.com':'BlueJeans','chime.aws':'Chime'};
function urlsIn(v){return String(v==null?'':v).match(URL_RX())||[];}
function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(_){return '';}}
function meetName(u){
  const h=hostOf(u);
  for(const k in MEET_NAME)if(h===k||h.endsWith('.'+k))return MEET_NAME[k];
  return h||'the link';
}
/* The way in, wherever it happens to sit: Outlook's location, the entry's own
   link, or the description somebody pasted it into. */
function meetLink(e){
  if(!e)return '';
  const all=urlsIn(e.detail).concat(urlsIn(e.location),urlsIn(e.desc));
  if(e.link&&MEET_HOST.test(hostOf(e.link)))all.unshift(e.link);
  return all.find(u=>MEET_HOST.test(hostOf(u)))||'';
}
/* Where it is, with any address lifted out. Trailing separators go with it,
   or "Rialto Auditorium; https://…" would read "Rialto Auditorium; · Online". */
function placeOf(v){
  const raw=String(v==null?'':v);
  if(!raw)return '';
  if(!urlsIn(raw).length)return raw;
  const rest=raw.replace(URL_RX(),' ').replace(/\s{2,}/g,' ')
    .replace(/^[\s;,·|>-]+/,'').replace(/[\s;,·|>-]+$/,'');
  return rest?rest+' · Online':'Online';
}
/* Escape first, then make the addresses clickable — the text is user and
   Outlook content, so nothing here may reach innerHTML unescaped. */
function linkify(v){
  const raw=String(v==null?'':v), rx=URL_RX();
  let out='', last=0, m;
  while((m=rx.exec(raw))){
    const u=m[0].replace(/[.,;:)\]]+$/,'');
    out+=esc(raw.slice(last,m.index))+
      '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+
      esc(u.length>56?u.slice(0,53)+'…':u)+'</a>';
    last=m.index+u.length;
    rx.lastIndex=last;
  }
  return out+esc(raw.slice(last));
}
function statusStyle(e){
  const t=palOf(e);
  if(e.status==='done')      return 'background:'+(t.solid||t.hue)+';color:#fff';
  if(e.status==='scheduled') return 'background:'+t.tint+';color:'+t.deep;
  if(e.status==='waiting')   return 'background:var(--surface);color:'+t.deep+';border:1px dashed '+t.hue;
  return 'border-left-color:'+t.hue+';background:#fcfcfb;color:'+t.deep+';opacity:.8';
}
const STATUS_LABEL={done:'Sent',scheduled:'Scheduled',waiting:'Waiting on someone',drafting:'Drafting'};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function lastSunday(){let d=addDays(TODAY,0);while(d.getDay()!==0)d=addDays(d,-1);return d;}
function metricFor(dt){return METRICS[key(dt)]||null;}
function dueThisWeek(){
  const ws=weekStartOf(S.anchor), we=addDays(ws,6);
  return TASKS.filter(t=>{const d=D(t.due);return d>=ws&&d<=we&&!t.done;});
}
function dueSoon(){return TASKS.filter(t=>!t.done && D(t.due)>=addDays(TODAY,-1) && D(t.due)<=addDays(TODAY,21));}
function waiting(){return EVENTS.filter(e=>e.status==='waiting').length;}

/* Which sections this person actually sees: the role preset, then any
   per-person override an admin set in Admin > Users. */
function allowedSections(){
  const base=ROLES[S.role].sections.slice();
  const ov=(!ME.preview&&ME.app_access)?ME.app_access:null;
  if(!ov)return base;
  const out=base.filter(id=>ov[id]!==false);
  Object.keys(ov).forEach(id=>{if(ov[id]===true&&!out.includes(id))out.push(id);});
  return out;
}
function renderNav(){
  const allowed=allowedSections();
  const items=[];
  SECTIONS.forEach(sec=>{
    if(sec.group!==undefined){ items.push({divider:sec.group}); return; }
    if(sec.inMenu) return;                       // lives in the account menu
    if(!allowed.includes(sec.id)) return;
    items.push(sec);
  });
  // drop a divider if the group below it is empty
  const out=[];
  items.forEach((it,i)=>{
    if(it.divider!==undefined){
      const next=items[i+1];
      if(!next||next.divider!==undefined) return;
      out.push('<div class="navgroup">'+it.divider+'</div>');
      return;
    }
    out.push('<button data-go="'+it.id+'" data-tip="'+esc(it.label)+'" class="'+(S.section===it.id?'on':'')+'">'+
      '<span class="tile" style="background:'+it.t+';color:'+it.h+'">'+ic(it.icon)+'</span>'+
      '<span>'+it.label+'</span>'+
      (it.restricted?'<span class="lock" title="Restricted">'+ic('lock')+'</span>':'')+
      (it.beta?'<span class="badge">BETA</span>':(it.count?'<span class="count">'+it.count+'</span>':''))+
      '</button>');
    if(it.id==='numbers'&&S.section==='numbers'){
      out.push('<div class="subnav">'+metricsNavItems().map(m=>
        '<button data-mp="'+esc(m.page)+'" class="'+(S.numPath===m.page?'on':'')+'">'+
        esc(m.label)+'</button>').join('')+'</div>');
    }
    if(it.id==='facilities'&&S.section==='facilities'){
      out.push('<div class="subnav">'+facNavItems().map(f=>
        '<button data-fp="'+esc(f.page)+'" class="'+(S.facPath===f.page?'on':'')+'">'+
        esc(f.label)+'</button>').join('')+'</div>');
    }
    // Goals' own pages hang off its rail button instead of a second sidebar
    if(it.id==='goals'&&S.section==='goals'){
      out.push('<div class="subnav">'+goalsNavItems().map(g=>g.group
        ?'<div class="subgroup">'+esc(g.group)+'</div>'
        :'<button data-gp="'+esc(g.path)+'" class="'+(S.goalsPath===g.path?'on':'')+'">'+esc(g.label)+'</button>'
      ).join('')+'</div>');
    }
  });
  document.getElementById('nav').innerHTML=out.join('');
  const _who=document.getElementById('who'),_av=document.querySelector('.rail-foot .avatar');
  const _nm=(typeof ME!=='undefined'&&ME.name)?ME.name:'';
  if(_nm){_who.textContent=_nm;if(_av)_av.innerHTML=avatarHtml(ME.avatar_url,_nm);
    const _mav=document.querySelector('.mtop-av .avatar');
    if(_mav)_mav.innerHTML=avatarHtml(ME.avatar_url,_nm);}
}

/* ============================ pages ============================ */
/* One place to start anything, and it starts it in the app that owns it.
   The portal keeps no create forms of its own for other apps' data: each app
   holds its own fields, its own rules and its own permissions — Facilities'
   policies key off auth.uid(), Metrics is the project holding every Mosaic
   login, and the counting rule that decides what an attendance number means
   lives there too. A second form here would be a second set of rules, drifting
   from the first from the day it shipped.

   Only what this person can actually reach is offered. Someone without Metrics
   should not be shown "Submit attendance" and then refused by the app. */
const NEW_THINGS=[
  ['planning',  'event',     'board', 'An event or project',   'Goes on the planning board'],
  ['facilities','new',       'door',  'A room or a space',     'A request for Alicia to confirm'],
  ['comms',     'new',       'mail',  'An email or a text',    'Goes on the comms calendar'],
  ['numbers',   'new',       'chart', 'Attendance numbers',    'Submit a service to Metrics']
];

}
function pageHome(){

   '<button class="btn-primary" data-newmenu="1">'+ic('plus')+' New</button>'+
   newMenu()+'</div>'+
   (DATA_ERR?'<div class="banner">'+ic('info')+'<div>'+esc(DATA_ERR)+'</div></div>':'')+
   '<div class="cards">'+
     card('This week',twEvents.length,twComms.length+' comms alongside','calendar','--session')+
     card('Waiting',attn.length,'speakers + flagged items','calendar','--magenta')+
     card('To close out',CLOSEOUT,'passed date, still open','planning','--milestone')+
     card('Attendance',m?m.a:'—',m?((delta>=0?'+':'')+delta+'% vs recent avg'):'no data yet','numbers','--gathering')+
   '</div>'+
   '<div class="cols"><div><h2>Worth a look</h2>'+
     (attn.length?attn.map(t=>'<button class="row" data-ev="'+t.evId+'"><span class="when">'+fmt(D(t.date))+'</span>'+
       '<span class="txt"><span class="name">'+esc(t.title)+'</span><span class="meta">'+esc(t.meta||'')+'</span></span></button>').join('')
       :'<div class="empty">Nothing waiting on anyone right now.</div>')+
   '</div><div><h2>Coming up</h2>'+
     (upcoming.length?upcoming.map(e=>'<button class="row" data-ev="'+e.id+'"><span class="when">'+fmt(D(e.date))+'</span>'+
       '<span class="txt"><span class="name">'+esc(e.title)+'</span><span class="meta">'+esc(placeOf(e.detail))+'</span></span></button>').join('')
       :'<div class="empty">No upcoming events loaded.</div>')+
   '</div></div>'+
   '<div class="fb-card">'+
     '<span class="fb-mark" style="background:var(--comms-t);color:var(--comms)">'+ic('heart')+'</span>'+
     '<div class="fb-txt"><div class="fb-h">Help us make this better</div>'+

}

/* Feedback — goes to portal_feedback, and admins read it in Admin > Feedback.
   A form that writes somewhere nobody looks is worse than no form at all. */
function feedbackDrawer(kind){
  const bug=kind==='bug';
  openDrawer('<h2 style="margin-top:0">'+(bug?'Report a problem':'Suggest an idea')+'</h2>'+
    '<div class="sub">'+(bug?'What happened, and what did you expect instead?':'What would make this more useful for you?')+'</div>'+
    '<textarea id="fbMsg" class="pa-in" rows="6" style="margin-top:16px;resize:vertical;line-height:1.5" placeholder="'+
      (bug?'When I click…':'It would help if…')+'"></textarea>'+
    '<button class="btn-primary" id="fbSend" style="margin-top:14px">Send</button>'+
    '<div id="fbNote" style="font-size:12.5px;color:var(--text2);margin-top:10px"></div>');
  const ta=document.getElementById('fbMsg');ta.focus();
  document.getElementById('fbSend').addEventListener('click',async()=>{
    const msg=ta.value.trim(),n=document.getElementById('fbNote');
    if(!msg){n.textContent='Please write a little about it first.';return;}
    const btn=document.getElementById('fbSend');btn.disabled=true;btn.textContent='Sending…';
    const {data,error}=await sb.from('portal_feedback')
      .insert({type:bug?'bug':'idea',message:msg,section:S.section}).select('id').single();
    btn.disabled=false;btn.textContent='Send';
    if(error){n.textContent="Couldn't send — "+(error.message||'please try again.');return;}
    // The saved row is the record; the email is a nudge, so a mail failure
    // must not look like the feedback was lost.
    if(data&&data.id)sb.functions.invoke('feedback-notify',{body:{id:data.id}}).catch(()=>{});
    n.textContent='Thank you — this is with the team now.';
    ta.value='';setTimeout(closeDrawer,1200);
  });
}
function card(k,v,n,go,c){
  const bg=c?'background:var('+c+'-t);border-color:transparent':'';

function barsFor(ws){
  const we=addDays(ws,6);
  const rows=CAMPAIGNS.filter(c=>shown(c)&&D(c.start)<=we&&D(c.end)>=ws);
  if(!rows.length) return '';
  return rows.map(c=>{
    const s=Math.max(0,Math.round((D(c.start)-ws)/86400000));
    const e=Math.min(6,Math.round((D(c.end)-ws)/86400000));
    const t=TYPES[c.type];
    return '<div class="bars"><div style="grid-column:'+(s+1)+' / '+(e+2)+'">'+
      '<button class="bar" style="background:'+t.tint+';color:'+t.deep+'">'+esc(c.title)+'</button></div></div>';
  }).join('');
}
/* The same month, read down the page instead of across a grid. It draws from
   evOn() like the grid does, so it is the same merged cards, the same three
   sources and the same campus filter — a row here and a pill there can never
   disagree about what is on a day. Days with nothing on them are left out;
   an empty month says so once. */
function monthList(){
  const first=new Date(S.month.getFullYear(),S.month.getMonth(),1);
  const last=new Date(S.month.getFullYear(),S.month.getMonth()+1,0);
  let h='<div class="callist">', any=false;
  for(let d=new Date(first);d<=last;d=addDays(d,1)){
    const evs=evOn(d);
    if(!evs.length)continue;
    any=true;
    h+='<div class="cl-day'+(same(d,TODAY)?' today':'')+'">'+
       '<div class="cl-when"><span class="cl-dow">'+DOW[d.getDay()]+'</span>'+
       '<span class="cl-num">'+d.getDate()+'</span></div><div class="cl-evs">'+
       evs.map(e=>{
         const t=palOf(e);
         return '<button class="cl-ev" data-ev="'+e.id+'">'+
           '<span class="cl-dot" style="background:'+t.hue+'"></span>'+
           '<span class="cl-txt"><span class="cl-name">'+esc(e.title)+'</span>'+
           (placeOf(e.detail)?'<span class="cl-meta">'+esc(placeOf(e.detail))+'</span>':'')+'</span>'+
           partDots(e)+
           '<span class="tag" style="background:'+t.tint+';color:'+t.deep+'">'+t.label+'</span>'+
           '</button>';
       }).join('')+
       '</div></div>';
  }
  if(!any)h+='<div class="empty">Nothing on the calendar this month — check the filters above, or try another month.</div>';
  return h+'</div>';
}
function monthGrid(){
  const first=new Date(S.month.getFullYear(),S.month.getMonth(),1);
  const start=weekStartOf(first);
  let h='<div class="calwrap"><div class="wk-head">'+DOW.map(d=>'<div>'+d+'</div>').join('')+'</div>';
  for(let w=0;w<6;w++){
    const ws=addDays(start,w*7);
    if(w>0 && ws.getMonth()!==S.month.getMonth() && ws>first) break;
    h+='<div style="border-top:1px solid var(--grid)">'+barsFor(ws)+'<div class="wk-body" style="border-top:0">';
    for(let i=0;i<7;i++){
      const d=addDays(ws,i), evs=evOn(d), out=d.getMonth()!==S.month.getMonth();
      const show=evs.slice(0,2), rest=evs.length-show.length;
      h+='<div class="cell'+(out?' out':'')+'" style="min-height:104px">'+
        '<div class="daynum'+(same(d,TODAY)?' today':'')+'">'+(same(d,TODAY)?'<span>'+d.getDate()+'</span>':d.getDate())+'</div>'+
        show.map(e=>'<button class="ev" data-ev="'+e.id+'" style="'+statusStyle(e)+'">'+esc(e.title)+partDots(e)+'</button>').join('')+
        (rest>0?'<button class="more" data-day="'+key(d)+'">+'+rest+' more</button>':'')+
      '</div>';
    }
    h+='</div></div>';
  }
  return h+'</div>';
}

/* Sections that embed one of the existing apps. The app stays the system of
   record; the portal just gives it a room. Metrics gets ?embed=portal so it
   hides its own account menu — those controls live in the portal now. */
function pageEmbed(id){
  const sec=SECTIONS.find(x=>x.id===id);
  let src=sec.url;
  if(id==='goals')src+=(S.goalsPath==='/'?'':S.goalsPath);
  if(id==='facilities')src+=(src.includes('?')?'&':'?')+'page='+(S.facPath||'requests');
  if(id==='numbers'){
    // Metrics would bounce a view this role cannot see to Overview anyway;
    // asking for Overview in the first place keeps the rail's highlight and
    // the frame saying the same thing.
    const ok=metricsNavItems().some(m=>m.page===S.numPath);
    src+=(src.includes('?')?'&':'?')+'view='+(ok?S.numPath:'overview');
  }
  /* Starting something for an event on the planning board — a room, a message,
     a set of numbers. None of those apps can be written from the board: it has
     no sign-in, and the tables behind them are RLS'd to auth.uid(). So it asks
     the portal to open the app's own form with the event already in it.
     Nothing here bypasses a check; it saves retyping, and it carries
     board_item so what gets created stays tied to the event.

     After the rail's own page/view, so page=new wins for the one arrival that
     asked for a form. Metrics reads both and page=new takes precedence there. */
  const book=S.navBook&&S.navBook[id];
  if(book){
    if(book.page&&id!=='facilities')src+=(src.includes('?')?'&':'?')+'page='+encodeURIComponent(book.page);
    for(const [k,v] of Object.entries(book.params||{}))
      if(v)src+=(src.includes('?')?'&':'?')+encodeURIComponent(k)+'='+encodeURIComponent(v);
  }
  if(id==='numbers'||id==='comms'||id==='planning'||id==='goals'||id==='facilities')
    src+=(src.includes('?')?'&':'?')+'embed=portal';
  // Arriving from an event: tell the app which one, so people land on the
  // thing they clicked instead of the app's front page.
  const want=S.deep&&S.deep[id];
  if(want){
    // comms takes either: an id opens that message, a date lands on its month
    const k=id==='planning'?'item':id==='numbers'?'date'
      :(/^\d{4}-\d{2}-\d{2}$/.test(want)?'on':'item');
    src+='&'+k+'='+encodeURIComponent(want);
  }
  // The sub-page this section is asking for, as the app's own vocabulary.
  // Used to move an ALREADY-LOADED frame without reloading it.
  const nav=id==='numbers'?{view:S.numPath||'overview'}
          :id==='facilities'?{page:S.facPath||'requests'}
          :id==='goals'?{path:S.goalsPath||'/'}:null;
  showFrame(id,src,sec,nav);
  return '';   // the frame is not in #main; see the embed host
}

/* THE FRAME IS NOT THROWN AWAY BETWEEN RENDERS.
   render() replaces #main's innerHTML, and an iframe that is detached and put
   back RELOADS — so the frame used to be rebuilt on every render. Metrics is
   ~790KB and boots its whole app and its sign-in handshake from scratch, which
   is why a change of sub-tab cost seconds of "Signing you in…" for what is
   only a change of tab.
   So each app keeps one iframe, parked in #embedHost, which render() never
   touches. Switching sections hides one and shows another; switching sub-tabs
   inside an app POSTS the new view to the frame instead of reloading it, and
   only reloads if the frame does not acknowledge — which is what an app
   deployed before this understands. */
const FRAMES={};
const embedBase=u=>String(u).replace(/[?&](view|page|path)=[^&]*/g,'');
function showFrame(id,src,sec,nav){
  const host=document.getElementById('embedHost');
  if(!host)return;
  host.hidden=false;
  let f=FRAMES[id];
  if(!f){
    f=FRAMES[id]=document.createElement('iframe');
    f.setAttribute('allow','clipboard-write');
    f.title=sec.label;
    f.src=src; f.dataset.src=src;
    host.appendChild(f);
  }else if(f.dataset.src!==src){
    if(embedBase(f.dataset.src)===embedBase(src)&&nav)askFrame(f,src,sec,nav);
    else { f.src=src; f.dataset.src=src; }
  }
  Object.keys(FRAMES).forEach(k=>{FRAMES[k].hidden=(k!==id);});
  const open=document.getElementById('embedOpen');
  if(open){
    open.href=sec.url;
    open.title='Open '+sec.label+' in its own tab';
    open.innerHTML=ic('ext','width:12px;height:12px')+'open';
  }
}
function askFrame(f,src,sec,nav){
  f.dataset.src=src;                 // what it is now being asked to show
  let acked=false;
  const onAck=e=>{
    if(!EMBED_TRUSTED(e.origin))return;
    if((e.data||{}).type!=='mosaic-nav-ok')return;
    acked=true; window.removeEventListener('message',onAck);
  };
  window.addEventListener('message',onAck);
  try{ f.contentWindow.postMessage(Object.assign({type:'mosaic-nav'},nav),new URL(src).origin); }
  catch(_){ }
  setTimeout(()=>{
    window.removeEventListener('message',onAck);
    // Not acknowledged: an app that predates this, so fall back to the reload
    // it has always done. Only if nothing has asked for something else since.
    if(!acked&&f.dataset.src===src)f.src=src;
  },900);
}
function hideFrames(){
  const host=document.getElementById('embedHost');
  if(host)host.hidden=true;
}

/* ---- Admin: user management for the whole app (same profiles the four
   apps share). Reads/writes the Metrics Supabase with the signed-in
   admin's own session — RLS enforces that only admins can. ---- */
/* Campus display order isn't in the database, and Metrics itself doesn't sort by any
   column there — it's a fixed list radiating out from LA: LA itself, then the rest of
   the US, then Mexico (next in North America), Ecuador (rest of the Americas), London
   (Europe), Online last. Paola set this on 26 Aug 2026 (this session). Atlanta shows
   despite being marked inactive in the database — an intentional exception, per Paola,
   not a bug to "fix" by hiding it. A new campus needs a human to slot it into this list
   at the right geographic point; unrecognized names fall back to just before Online. */
const CAMPUS_ORDER=['Los Angeles','Orange County','New York City','Chicago','Atlanta','Seattle','Mexico','Ecuador','London','Mosaic Online'];
const CAMPUS_ALWAYS_SHOW=['Atlanta'];
function campusSortIndex(name){
  const i=CAMPUS_ORDER.indexOf(name);
  if(i>=0)return i;
  const onlineIdx=CAMPUS_ORDER.indexOf('Mosaic Online');
  return onlineIdx>=0?onlineIdx-0.5:CAMPUS_ORDER.length;
}
const ADMIN={notice:null,profs:null,campuses:null,pending:null,err:null,fb:null,fbErr:null,q:'',role:'all',loading:false,tab:'users',apps:null,appPerms:null,appDefaults:null,campusOpen:new Set(),showInactiveCampuses:false,campusUsersOpen:new Set(),regions:null};
const ROLE_LIST=['admin','staff','campus_pastor','leader','volunteer'];
const SECTION_LABEL=id=>{const s=SECTIONS.find(x=>x.id===id);return s?s.label:id;};
function adminName(p){const n=p.display_name||p.full_name||'—';return n.includes('@')?prettyNameFromEmail(n):n;}
async function loadAdmin(){
  if(ADMIN.loading)return;ADMIN.loading=true;
  /* r4-r6 are the permission registry: the apps, the named permissions inside
     each, and which of them a role gets by default. Roles & permissions reads
     these so the table describes what the database actually says, rather than
     a list kept in step by hand. */
  const [r1,r2,r3,r4,r5,r6,r7,r8,r9]=await Promise.all([
    sb.from('profiles').select('id,display_name,full_name,role,campus_id,avatar_url,app_access,campus_ids,archived_at'),
    sb.from('campuses').select('id,name,parent_campus_id,active,region_id,timezone,language'),
    sb.from('pending_invites').select('id,email,name,role,campus_id,created_at').order('created_at'),
    sb.from('apps').select('key,name').order('name'),
    sb.from('app_permissions').select('app_key,perm_key,label,sort_order').order('app_key').order('sort_order'),
    sb.from('role_app_defaults').select('role,app_key,perm_key,granted'),
    // The real, attendance-tracked meeting locations per campus (same table Metrics
    // itself reads) — separate from, and richer than, the campuses table's own
    // parent/child rows, which exist only to scope portal permissions by sub-campus.
    // Admins can write any campus's locations; staff only their own (my_campuses()).
    sb.from('campus_locations').select('id,campus_id,location,active,note').eq('active',true),
    // Gathering times per location — admin-write only, joined to a location by id.
    sb.from('campus_service_times').select('id,campus_id,location_id,gathering_type,service_label,sort_order,active').eq('active',true).order('sort_order'),
    // Regions group campuses for reporting — ordered closest-to-LA first (see campus_regions).
    sb.from('campus_regions').select('id,name,sort_order').order('sort_order')
  ]);
  ADMIN.apps=r4.data||[];
  ADMIN.appPerms=r5.data||[];
  ADMIN.appDefaults=r6.data||[];
  ADMIN.err=(r1.error&&r1.error.message)||(r2.error&&r2.error.message)||null;
  ADMIN.profs=r1.data||[];
  ADMIN.pending=r3.data||[];
  ADMIN.campuses=(r2.data||[]).filter(c=>!c.parent_campus_id).sort((a,b)=>campusSortIndex(a.name)-campusSortIndex(b.name));
  ADMIN.campusLocations=r7.data||[];
  ADMIN.serviceTimes=r8.data||[];
  ADMIN.regions=r9.data||[];
  ADMIN.loading=false;
  if(S.section==='admin')render();
}
/* Effective permissions for one user, one app: start from the role that
   applies (a section_role_overrides row for this app if set, else the
   person's global role), grant whatever role_app_defaults says for it,
   then let any per-permission row in section_permissions override that
   field specifically. Returns [{perm_key,label,granted}]. */
function effectiveAppPerms(appKey,globalRole,roleOverride,permOverrides){
  const effRole=roleOverride||globalRole;
  const perms=(ADMIN.appPerms||[]).filter(p=>p.app_key===appKey);
  return perms.map(p=>{
    const def=(ADMIN.appDefaults||[]).some(d=>d.role===effRole&&d.app_key===appKey&&d.perm_key===p.perm_key&&d.granted);
    const ov=(permOverrides||[]).find(o=>o.app_key===appKey&&o.perm_key===p.perm_key);
    return {perm_key:p.perm_key,label:p.label,granted:ov?ov.granted:def,overridden:!!ov};
  });
}
function appHasAccess(appKey,globalRole,roleOverride,permOverrides){
  return effectiveAppPerms(appKey,globalRole,roleOverride,permOverrides).some(p=>p.granted);
}
function roleDefaultHasAny(appKey,role){
  return (ADMIN.appDefaults||[]).some(d=>d.role===role&&d.app_key===appKey&&d.granted);
}
// Mirrors the campus_locations_write RLS policy: is_admin() OR (is_staff() AND
// campus_id = ANY(my_campuses())) — so the UI never offers a control the database
// would reject. Gathering times stay admin-only, matching campus_service_times_admin_write.
function canEditLocations(campusId){
  if(ME.role==='admin')return true;
  if(ME.role!=='staff')return false;
  const mine=[ME.campus_id,...(ME.campus_ids||[])].filter(Boolean);
  return mine.includes(campusId);
}

/* The sections a person can reach, and the campuses they can see, resolving
   role defaults plus any per-person override. */
const PERM_SECTIONS=SECTIONS.filter(s=>s.id&&s.id!=='settings');
function sectionsFor(p){
  const preset=ROLE_PRESET[p.role]||'volunteer';
  const base=(ROLES[preset]||ROLES.volunteer).sections.filter(id=>id!=='settings'&&id!=='admin');
  const ov=p.app_access||null;
  if(!ov)return base;
  const out=base.filter(id=>ov[id]!==false);
  Object.keys(ov).forEach(id=>{if(ov[id]===true&&!out.includes(id))out.push(id);});
  return out;
}
function campusesFor(p){
  if(p.campus_ids&&p.campus_ids.length)return p.campus_ids;
  if(p.role==='admin')return (ADMIN.campuses||[]).map(c=>c.id);
  return p.campus_id?[p.campus_id]:[];
}
function relDays(ts){
  const d=new Date(ts);if(isNaN(d))return '';
  const days=Math.round((TODAY-d)/86400000);
  if(days<=0)return 'today';
  if(days===1)return 'yesterday';
  if(days<30)return days+' days ago';
  if(days<365)return Math.round(days/30)+' months ago';
  return Math.round(days/365)+'y ago';
}
function permSummary(p){
  const secs=sectionsFor(p), cams=campusesFor(p);
  const allCam=(ADMIN.campuses||[]).length;
  const camLab=(p.role==='admin'&&!(p.campus_ids||[]).length)?'all campuses'
    :cams.length===0?'no campus'
    :cams.length===1?campusName(cams[0])
    :cams.length===allCam?'all campuses'
    :cams.length+' campuses';
  const custom=!!(p.app_access||(p.campus_ids&&p.campus_ids.length));
  return '<span class="pa-pill">'+secs.length+' of '+PERM_SECTIONS.length+' apps</span>'+
    '<span class="pa-pill">'+esc(camLab)+'</span>'+
    (custom?'<span class="pa-pill custom">custom</span>':'');
}

function rpCell(v){
  if(v==='yes')return '<span class="rp-yes">✓</span>';
  if(v==='no')return '<span class="rp-no">—</span>';
  if(v==='all')return '<span class="rp-all">All campuses</span>';
  if(v==='own')return '<span class="rp-lim">Own campus</span>';
  return esc(v);
}
/* The permission rows come from the database: one group per app, one row per
   named permission, a tick where that role has it by default. RP_ROLES and
   ROLE_LIST are in the same order, which is what keeps the ticks under the
   right heading. If the registry hasn't loaded we fall back to the written
   table rather than showing an empty grid. */
function rolesTableRows(){
  const perms=ADMIN.appPerms||[], defaults=ADMIN.appDefaults||[];
  if(!perms.length)return null;
  const cols=ROLE_LIST.length+1;
  return (ADMIN.apps||[]).map(a=>{
    const mine=perms.filter(p=>p.app_key===a.key);
    if(!mine.length)return '';
    return '<tr class="rp-sec"><td colspan="'+cols+'">'+esc(a.name)+'</td></tr>'+
      mine.map(p=>'<tr><td>'+esc(p.label||p.perm_key)+'</td>'+
        ROLE_LIST.map(role=>'<td>'+(defaults.some(d=>d.role===role&&d.app_key===a.key&&d.perm_key===p.perm_key&&d.granted)
          ?'<span class="rp-yes">✓</span>':'<span class="rp-no">—</span>')+'</td>').join('')+
      '</tr>').join('');
  }).join('');
}
function pageAdminRoles(){
  const live=rolesTableRows();
  const body=live!==null&&live.trim()
    ? live
    : RP_SECTIONS.map(sec=>'<tr class="rp-sec"><td colspan="5">'+esc(sec.title)+'</td></tr>'+
        sec.rows.map(row=>'<tr><td>'+esc(row[0])+'</td>'+row.slice(1).map(v=>'<td>'+rpCell(v)+'</td>').join('')+'</tr>').join('')
      ).join('');
  return '<div class="rp-desc">'+RP_ROLES.map(r=>'<div class="rp-card"><div class="rp-role" style="color:'+r.color+'">'+esc(r.name)+'</div><p>'+esc(r.desc)+'</p></div>').join('')+'</div>'+
    '<div class="pa-card rp-scroll"><table class="rp-table"><thead><tr><th>Permission</th>'+
    RP_ROLES.map(r=>'<th style="color:'+r.color+'">'+esc(r.name)+'</th>').join('')+'</tr></thead><tbody>'+
    body+'</tbody></table></div>'+
    '<p style="font-size:12.5px;color:var(--text2);margin-top:14px;max-width:640px;line-height:1.5">A reference, not a control panel — change someone\'s access by changing their role on the Users tab. Section visibility is enforced by the portal; campus scope and who can edit what are enforced by the database itself, so the rules hold no matter which app you\'re in.</p>';
}

async function loadFeedback(){
  if(ADMIN.fbLoading)return;
  ADMIN.fbLoading=true;
  const {data,error}=await sb.from('portal_feedback').select('*').order('created_at',{ascending:false});
  ADMIN.fbLoading=false;

/* The rail calls Metrics 'numbers'; the permission tables call it 'metrics'.
   Everything else matches. Without this the Metrics row would quietly show no
   permissions at all, which reads as "this app has none" rather than a typo. */
const APP_KEY={numbers:'metrics'};
const appKeyFor=id=>APP_KEY[id]||id;
/* What this person can actually do in an app: what their role grants by
   default, with any per-person entry in section_permissions winning. Mirrors
   can() in Supabase so the screen and the database agree. */
function effectiveAppPerms(appKey,role,permOverrides){
  return (ADMIN.appPerms||[]).filter(p=>p.app_key===appKey).map(p=>{
    const def=(ADMIN.appDefaults||[]).some(d=>d.role===role&&d.app_key===appKey&&d.perm_key===p.perm_key&&d.granted);
    const ov=(permOverrides||[]).find(o=>o.app_key===appKey&&o.perm_key===p.perm_key);
    return {perm_key:p.perm_key,label:p.label,granted:ov?ov.granted:def,overridden:!!ov};
  });
}
/* Perm hierarchy: parent key -> [child keys] */
const PERM_CHILDREN={
  calendar:{
    view:['view_events','view_comms','view_mosaic_cal','view_travel_pto','view_facility_bookings'],
    read_write:['write_planning','write_comms','write_facilities']
  },
  comms:{
    view:['view_sunday','view_email','view_text','view_script','view_archive']
  },
  metrics:{
    view:['view_overview','view_campuses','view_kids_future','view_trends','view_report','view_history'],
    read_write:['submit_attendance','edit_entries','restore_entries']
  },
  goals:{
    read_write:['create_assign_goals','edit_publish_goals','manage_team_assessments']
  },
  planning:{
    edit:['edit_own','edit_all']
  },
  facilities:{
    view:['view_own','view_all'],
    read_write:['submit_request','manage_requests','manage_spaces']
  }
};
/* Calendar write_* sub-perms require Read/Write on another app */
const PERM_DEP={
  write_planning:{app_key:'planning',perm_key:'read_write',label:'Planning'},
  write_comms:   {app_key:'comms',   perm_key:'read_write',label:'Comms'},
  write_facilities:{app_key:'facilities',perm_key:'read_write',label:'Facilities'}
};
/* The named permissions inside one app, as tickboxes. A tick that differs
   from what the role gives is marked, so an exception is visible as an
   exception rather than looking like the default.
   For calendar, child perms render indented under their parent; write_*
   sub-perms are locked unless the user has read_write on the source app. */
function puPermRow(sectionId,role,permOverrides,appOn){
  const key=appKeyFor(sectionId);
  const perms=effectiveAppPerms(key,role,permOverrides);
  if(!perms.length)return '';
  const ch=PERM_CHILDREN[key]||{};
  const childSet=new Set(Object.values(ch).flat());
  const grouped=!!Object.keys(ch).length;
  const renderPerm=(p,isChild)=>{
    const dep=isChild?PERM_DEP[p.perm_key]:null;
    let locked=false;
    if(dep){
      const dp=effectiveAppPerms(dep.app_key,role,permOverrides);
      locked=!dp.some(x=>x.perm_key===dep.perm_key&&x.granted);
    }
    const cls='pu-perm'+(p.overridden?' pu-perm-ov':'')+(locked?' pu-perm-locked':'');
    return '<label class="'+cls+'"'+(dep?' data-dep="'+esc(p.perm_key)+'"':'')+'>'+
      '<input type="checkbox" data-perm data-papp="'+esc(key)+'" data-pkey="'+esc(p.perm_key)+'"'+
        (p.granted&&!locked?' checked':'')+'>'+
      '<span>'+esc(p.label||p.perm_key)+'</span>'+
      (locked?'<span class="pu-lock-ico">🔒</span>':'')+
      (!locked&&p.overridden?'<span class="pu-perm-tag">changed</span>':'')+
    '</label>';
  };
  const rows=perms.filter(p=>!childSet.has(p.perm_key)).map(p=>{
    const childKeys=ch[p.perm_key]||[];
    if(!childKeys.length)return renderPerm(p,false);
    const childPerms=childKeys.map(ck=>perms.find(x=>x.perm_key===ck)).filter(Boolean);
    const total=childPerms.length;
    const on=childPerms.filter(c=>c.granted).length;
    const badge=(on===total?total+' of '+total:on+' of '+total)+' ▸';
    const panelId='pgp-'+esc(sectionId)+'-'+esc(p.perm_key);
    const kids=childPerms.map(cp=>renderPerm(cp,true)).join('');
    return '<div class="pu-perm-group">'+
      '<div class="pu-perm-group-head" data-pghead="'+panelId+'">'+
        '<input type="checkbox" data-perm data-papp="'+esc(key)+'" data-pkey="'+esc(p.perm_key)+'"'+(p.granted?' checked':'')+'>'+(p.label||p.perm_key)+
        '<button class="pu-perm-badge" data-pgbadge="'+panelId+'" type="button">'+esc(badge)+'</button>'+
      '</div>'+
      '<div class="pu-perm-panel" id="'+panelId+'" hidden>'+kids+'</div>'+
    '</div>';
  }).join('');
  return '<div class="pu-perms" data-permrow="'+esc(sectionId)+'"'+(appOn?'':' hidden')+'>'+
    rows+'</div>';
}
/* Per-campus permission matrix: permissions as rows, campuses as columns.
   Shown instead of general permissions when per-campus mode is on. */
function puCampusPermMatrix(appKey,campusIds,allCampuses,role,permOverrides,campusPermOv,pcOn,appOn){
  const perms=effectiveAppPerms(appKey,role,permOverrides).filter(p=>!p.perm_key.startsWith('view_')&&!p.perm_key.startsWith('write_'));
  if(!perms.length)return '';
  const camps=allCampuses.filter(c=>campusIds.includes(c.id));
  if(!camps.length)return '';
  const heads=camps.map(c=>'<th class="pu-pcm-hc campus-col">'+esc(c.name)+'</th>').join('');
  const rows=perms.map(p=>{
    const cells=camps.map(c=>{
      const ov=(campusPermOv||[]).find(o=>o.app_key===appKey&&o.campus_id===c.id&&o.perm_key===p.perm_key);
      const chk=ov?ov.granted:p.granted;
      return '<td class="pu-pcm-cell c"><input type="checkbox" data-campusperm data-capp="'+esc(appKey)+'" data-cid="'+esc(c.id)+'" data-cpkey="'+esc(p.perm_key)+'"'+(chk?' checked':'')+' aria-label="'+esc(p.label||p.perm_key)+' for '+esc(c.name)+'"></td>';
    }).join('');
    return '<tr><td class="pu-pcm-cell">'+esc(p.label||p.perm_key)+'</td>'+cells+'</tr>';
  }).join('');
  return '<div class="pu-pcmatrix" data-pcmatrix="'+esc(appKey)+'"'+(pcOn&&appOn?'':' hidden')+'>'+
    '<table><thead><tr><th class="pu-pcm-hc">Permission</th>'+heads+'</tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>';
}
/* The campuses a person can see inside one app: chips for the ones they have,
   a dropdown to add another. Hidden until the app itself is ticked, and never
   shown for admins — they see every campus everywhere. */
function puCampusRow(appKey,selectedIds,allCampuses,isAdminUser,appOn,personCampusIds){
  const wrap=inner=>'<div class="pu-campuses" data-campusrow="'+esc(appKey)+'"'+(appOn?'':' hidden')+'>'+inner+'</div>';
  /* Admins are not limited anywhere, so one short line - repeating every
     campus under all eight apps says the same thing eight times. */
  if(isAdminUser)return wrap('<span class="pu-chip-none">All campuses</span>');
  const cams=allCampuses.slice().sort((a,b)=>a.name.localeCompare(b.name));
  /* With nothing chosen for this app, they get their main campus - not every
     campus. Saying "Every campus" here overstated what they can reach. */
  const inherited=!selectedIds||!selectedIds.length;
  const ids=inherited?(personCampusIds||[]):selectedIds;
  const sel=cams.filter(c=>ids.includes(c.id));
  const avail=cams.filter(c=>!ids.includes(c.id));
  const chips=sel.length
    ? sel.map(c=>'<span class="pu-chip'+(inherited?' pu-chip-locked':'')+'">'+esc(c.name)+
        (inherited?'':'<button type="button" data-rmcampus data-capp="'+esc(appKey)+'" data-cid="'+esc(c.id)+'" aria-label="Remove '+esc(c.name)+'">×</button>')+
      '</span>').join('')+(inherited?'<span class="pu-chip-none">their main campus</span>':'')
    : '<span class="pu-chip-none">No campus set — add one below</span>';
  const add=avail.length
    ? '<select class="pu-addcampus" data-addcampus data-capp="'+esc(appKey)+'">'+
        '<option value="">+ Add campus</option>'+
        avail.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('')+
      '</select>'
    : '';
  return wrap(chips+add);
}
/* HELD IN STATE, NOT JUST IN THE DOM. Sending an invite nulls ADMIN.profs on
   the way out, so the page repaints as "Loading users…" — a branch that has no
   banner element in it at all — and a message written straight to the DOM was
   gone before anyone could read it. Nobody could tell an invite from a
   no-op. Keep it in ADMIN.notice and let the page draw it, so it survives the
   reload and the re-render that follows. */
function paNote(msg,err){
  ADMIN.notice={msg:String(msg),err:!!err};
  clearTimeout(paNote._t);
  paNote._t=setTimeout(()=>{ADMIN.notice=null;if(S.section==='admin')render();},6000);
  if(S.section==='admin')render();
}
function paNoticeHTML(){
  const n=ADMIN.notice;
  if(!n)return '<div id="paNote" class="banner" style="display:none"></div>';
  return '<div id="paNote" class="banner" style="border-color:'+(n.err?'var(--red)':'var(--hairline)')+'">'+
    ic('info')+'<div>'+esc(n.msg)+'</div></div>';
}
async function paSaveGlobalRole(id,next){
  const note=document.getElementById('paRoleNote');
  const result=await paSaveRole(id,next);
  if(result===false)return;
  if(typeof result==='string'){
    // Setting the global role resets this person back to that role's normal
    // access everywhere — any per-app exceptions they had are cleared, so
    // there's nothing left over contradicting the role just assigned. An
    // admin can still carve out new per-app exceptions afterward.
    await Promise.all([
      sb.from('section_role_overrides').delete().eq('user_id',id),
      sb.from('section_permissions').delete().eq('user_id',id)
    ]);
    if(note)note.textContent=result;
    if(S.section==='admin-user'&&S.adminUserId===id)render();
  }
}
async function paSaveRole(id,next){
  const p=ADMIN.profs.find(x=>x.id===id);if(!p||p.role===next)return true;
  const who=adminName(p);
  if(p.role==='admin'&&next!=='admin'&&ADMIN.profs.filter(x=>x.role==='admin'&&!x.archived_at).length<=1){alert("You can't change the last admin's role — promote someone else to Admin first.");return false;}
  const self=(p.full_name===ME.email);
  let msg='Change '+who+"'s role from “"+p.role+'” to “'+next+'”?';
  if(next==='admin')msg='Make '+who+' an Admin?\n\nAdmins can view and edit every campus and manage all users.';
  if(self&&next!=='admin')msg="Heads up — you're changing YOUR OWN role to “"+next+"”.\n\nYou'll lose admin access immediately and the page will reload. Continue?";
  if(!confirm(msg))return false;
  const {error}=await sb.from('profiles').update({role:next}).eq('id',id);
  if(error){alert("Couldn't update role: "+(error.message||'please try again.'));return false;}
  p.role=next;
  if(self&&next!=='admin'){location.reload();return true;}
  return 'Updated '+who+' to '+cap(next)+'.';
}
async function paSaveCampus(id,next){
  const p=ADMIN.profs.find(x=>x.id===id);if(!p||(p.campus_id||'')===(next||''))return true;
  const {error}=await sb.from('profiles').update({campus_id:next||null}).eq('id',id);
  if(error){alert("Couldn't update campus: "+(error.message||'please try again.'));return false;}
  p.campus_id=next||null;
  return 'Set '+adminName(p)+"'s campus to "+(next?campusName(next):'No campus')+'.';
}

/* Send the actual invite email for a person (used by the drawer and by the

  if(error){let m=error.message||'please try again.';try{const b=await error.context.json();if(b&&b.error)m=b.error;}catch(_){}return m;}

// fallback (Region "Europe" defaults to London, which would silently
// overwrite a Paris/Berlin-specific pick otherwise). Rather than hand-listing
// cities (easy to miss one, as Sydney was), this matches the campus name
// straight against every city already named in TIMEZONE_OPTIONS/
// TIMEZONE_WORLD — the same master list the "Other…" search already covers —
// so any of those ~35 world cities works automatically. Only a few true
// exceptions need an override: a campus named after a country rather than
// its city (Mexico, Ecuador), or a city that isn't any label's parenthetical
// (Toronto, Vancouver ride on the generic "US & Canada" zones). Kept in sync
// with mosaic-metrics' copy.
const CAMPUS_TZ_OVERRIDES={
  'mexico':'America/Mexico_City','ecuador':'America/Guayaquil',
  'toronto':'America/New_York','vancouver':'America/Los_Angeles',
  'quebec':'America/New_York','quebec city':'America/New_York',

function normalizeCityName(s){
  return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

function campusTzHint(campusName){
  const key=normalizeCityName(campusName);
  if(!key)return null;
  if(CAMPUS_TZ_OVERRIDES[key])return CAMPUS_TZ_OVERRIDES[key];
  const all=TIMEZONE_OPTIONS.concat(TIMEZONE_WORLD);
  const exact=all.find(o=>{
    const m=o.label.match(/\(([^)]+)\)/);
    return m&&normalizeCityName(m[1])===key;

  const partial=all.find(o=>o.q&&normalizeCityName(o.q).includes(key));
  return partial?partial.tz:null;

    '<div id="ncNote" style="font-size:12.5px;color:var(--text2);margin-top:10px"></div>');
  // Region preselects the time zone/language to a best guess; changing either
  // field by hand always works regardless — this is a nudge, not a restriction.
  let tzTouched=false,langTouched=false;
  document.getElementById('ncTz').addEventListener('change',()=>{
    tzTouched=true;
    const showOther=document.getElementById('ncTz').value===TIMEZONE_OTHER;
    document.getElementById('ncTzOtherWrap').style.display=showOther?'':'none';
    if(showOther)document.getElementById('ncTzOther').focus();
  });
  document.getElementById('ncLang').addEventListener('change',()=>{
    langTouched=true;
    const showOther=document.getElementById('ncLang').value===LANGUAGE_OTHER;
    document.getElementById('ncLangOtherWrap').style.display=showOther?'':'none';
    if(showOther)document.getElementById('ncLangOther').focus();
  });
  document.getElementById('ncLangOther').addEventListener('input',()=>{langTouched=true;});
  // Sets the time zone field, using the "Other" search slot when the zone
  // isn't one of the 7 common ones (e.g. Europe/Paris) so it still shows the
  // real "Zone Time (place)" label instead of a blank/raw select value.
  const setTz=tz=>{
    if(TIMEZONE_OPTIONS.some(o=>o.tz===tz)){
      document.getElementById('ncTz').value=tz;
      document.getElementById('ncTzOtherWrap').style.display='none';
      return;
    }
    const match=TIMEZONE_WORLD.find(o=>o.tz===tz);
    document.getElementById('ncTz').value=TIMEZONE_OTHER;
    document.getElementById('ncTzOtherWrap').style.display='';
    document.getElementById('ncTzOther').value=match?match.label:tz;
    document.getElementById('ncTzOther').dataset.tz=tz;
  };
  // Same pattern for Language: pick it from the list when it's one of the
  // 8 common ones, otherwise drop it into the "Other" free-text slot.
  const setLang=lang=>{
    if(LANGUAGE_OPTIONS.includes(lang)){
      document.getElementById('ncLang').value=lang;
      document.getElementById('ncLangOtherWrap').style.display='none';
      return;
    }
    document.getElementById('ncLang').value=LANGUAGE_OTHER;
    document.getElementById('ncLangOtherWrap').style.display='';
    document.getElementById('ncLangOther').value=lang;
  };
  // The campus name (city) is the more specific guess — Paris implies French
  // and its own zone even inside a "Europe" region that's mostly
  // English/German/London elsewhere — so it wins over the region's hint
  // whenever both are available.
  const applyLangHint=()=>{
    if(langTouched)return;
    const nameHint=campusLangHint(document.getElementById('ncName').value);
    const regionKey=document.getElementById('ncRegion').value.trim().toLowerCase();
    setLang(nameHint||REGION_LANG_HINTS[regionKey]||'English');
  };
  const applyTzHint=()=>{
    if(tzTouched)return;
    const name=document.getElementById('ncName').value.trim();
    const nameHint=campusTzHint(name);
    const regionKey=document.getElementById('ncRegion').value.trim().toLowerCase();
    const hint=nameHint||REGION_TZ_HINTS[regionKey];
    if(hint){setTz(hint);return;}
    // A name has been typed but doesn't match any known city or region — drop
    // into "Other" with an empty search box rather than silently leaving
    // whatever an earlier, different name happened to match (a real, if
    // confusing, bug: type "Dubai", then rename to "Quebec" before saving,
    // and it stayed on Dubai's zone). Nothing typed yet keeps the plain
    // Pacific Time default rather than popping "Other" open immediately.
    if(name){
      document.getElementById('ncTz').value=TIMEZONE_OTHER;
      document.getElementById('ncTzOtherWrap').style.display='';
      document.getElementById('ncTzOther').value='';
      delete document.getElementById('ncTzOther').dataset.tz;
    }
  };
  document.getElementById('ncName').addEventListener('input',()=>{applyTzHint();applyLangHint();});
  document.getElementById('ncRegion').addEventListener('input',()=>{applyTzHint();applyLangHint();});

  // "Other…" search: type a city/country, pick a match — same "Zone Time
  // (place)" labels as the main list, never a raw IANA string to read.
  document.getElementById('ncTzOther').addEventListener('input',()=>{
    delete document.getElementById('ncTzOther').dataset.tz;
    const matches=searchTimezones(document.getElementById('ncTzOther').value);
    const pop=document.getElementById('ncTzOtherPop');
    if(!matches.length){pop.style.display='none';return;}
    pop.innerHTML=matches.map((m,i)=>'<div class="tz-sugg" data-tz-idx="'+i+'" style="padding:7px 8px;border-radius:8px;font-size:13.5px;cursor:pointer">'+esc(m.label)+'</div>').join('');
    pop.style.display='';
    pop.querySelectorAll('[data-tz-idx]').forEach(row=>{
      row.addEventListener('mouseenter',()=>{row.style.background='#f5f5f4';});
      row.addEventListener('mouseleave',()=>{row.style.background='';});
      row.addEventListener('click',()=>{
        const m=matches[Number(row.dataset.tzIdx)];
        document.getElementById('ncTzOther').value=m.label;
        document.getElementById('ncTzOther').dataset.tz=m.tz;
        pop.style.display='none';
      });
    });
  });
  document.addEventListener('click',e=>{
    if(!e.target.closest('#ncTzOtherWrap'))document.getElementById('ncTzOtherPop').style.display='none';
  });
  document.getElementById('ncSave').addEventListener('click',async()=>{
    const name=document.getElementById('ncName').value.trim();
    const note=document.getElementById('ncNote');
    if(!name){note.textContent='Please enter a name.';return;}
    const btn=document.getElementById('ncSave');btn.disabled=true;btn.textContent='Saving…';
    // Region can be typed freehand — resolve to an existing row by name, or
    // create one on the fly. New regions slot in just before "Online" (bumping
    // it back one place) so Online stays last, per how regions are ordered;
    // where exactly a new continent belongs relative to the others is not
    // assumed beyond that.
    const regionText=document.getElementById('ncRegion').value.trim();
    let region_id=null;
    if(regionText){
      const existing=regions.find(r=>r.name.toLowerCase()===regionText.toLowerCase());
      if(existing){
        region_id=existing.id;
      }else{
        btn.textContent='Adding region…';
        const online=regions.find(r=>r.name.toLowerCase()==='online');
        const insertOrder=online?online.sort_order:(Math.max(0,...regions.map(r=>r.sort_order))+1);
        if(online){
          await sb.from('campus_regions').update({sort_order:online.sort_order+1}).eq('id',online.id);
          online.sort_order+=1;
        }
        const {data:newRegion,error:regionErr}=await sb.from('campus_regions')
          .insert({name:regionText,sort_order:insertOrder}).select('id,name,sort_order').single();
        if(regionErr){btn.disabled=false;btn.textContent='Save';note.textContent="Couldn't add that region — "+(regionErr.message||'try again.');return;}
        regions.push(newRegion);regions.sort((a,b)=>a.sort_order-b.sort_order);
        region_id=newRegion.id;
      }
    }
    let timezone=document.getElementById('ncTz').value;
    if(timezone===TIMEZONE_OTHER){
      const typed=document.getElementById('ncTzOther').value.trim();
      // A picked suggestion carries the real IANA id in data-tz; typing without
      // picking one is only valid if it's already an exact identifier (has a
      // "/", e.g. Asia/Tokyo) — otherwise "Paris" would silently save as a
      // literal, invalid time zone string.
      timezone=document.getElementById('ncTzOther').dataset.tz||(typed.includes('/')?typed:'');
      if(!timezone){btn.disabled=false;btn.textContent='Save';note.textContent='Pick a suggested time zone, or type the exact identifier (e.g. Asia/Tokyo).';return;}
    }
    let language=document.getElementById('ncLang').value;
    if(language===LANGUAGE_OTHER)language=document.getElementById('ncLangOther').value.trim()||'English';
    const fields={
      name,
      region_id,
      timezone,
      language,
    };
    // Slug and the CCB check only happen on create — renaming an existing
    // campus doesn't touch either, same as Metrics: the slug is a stable
    // identity set once, not something that should shift under a rename,
    // and re-running the CCB check on every edit would be pointless (the
    // campus, if it exists there, was already found the first time).
    let ccbFlag='';
    if(!c){
      fields.slug=name.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
      btn.textContent='Checking CCB…';
      try{
        const {data:ccb,error:ccbErr}=await sb.functions.invoke('check-ccb-campus',{body:{name}});
        if(!ccbErr&&ccb){
          if(ccb.matched){fields.ccb_campus_id=ccb.ccb_campus_id;}
          else if(ccb.matched===false){ccbFlag=' No matching campus found in CCB — you may want to add it there too.';}
        }
      }catch(e){/* CCB check is best-effort; never blocks campus creation */}
    }
    btn.textContent='Saving…';
    const {data:saved,error}=c
      ?await sb.from('campuses').update(fields).eq('id',c.id)
      :await sb.from('campuses').insert(fields).select('id').single();
    btn.disabled=false;btn.textContent='Save';
    if(error){note.textContent="Couldn't save — "+(error.message||'please try again.');return;}
    // Best-effort short-code alias(es) — real city/airport-style abbreviations
    // from CAMPUS_SHORT_CODES (Seattle -> sea, New York City -> nyc; Ecuador
    // gets both uio and ecu), falling back to the first three letters of the
    // first word for a city not yet in that list. Each is silently skipped if
    // it collides with another campus's alias, or is identical to the real
    // slug — never blocks campus creation.
    if(!c&&saved){
      for(const shortCode of campusShortCodes(name)){
        if(!shortCode||shortCode===fields.slug)continue;
        try{await sb.from('campus_slug_aliases').insert({campus_id:saved.id,alias_slug:shortCode});}
        catch(e){/* best-effort; a collision or failure here never blocks campus creation */}
      }
    }
    note.textContent='Saved.'+ccbFlag;
    ADMIN.campuses=null;setTimeout(()=>{closeDrawer();loadAdmin().then(()=>{if(S.section==='admin')render();});},ccbFlag?2600:700);
  });
}

/* The planning board's own id for an event. Repeats carry the occurrence date
   too ('pm:123:2026-08-09'); the board only knows the item, so trim it. */
/* The comms app's id for a message ('ce:42' here, 42 there). */
function ceId(e){
  const raw=String(e&&e.id||'');
  return raw.startsWith('ce:')?raw.slice(3):'';
}
function pmId(e){
  const raw=String(e&&e.id||'');
  if(!raw.startsWith('pm:'))return '';
  const rest=raw.slice(3);
  const cut=rest.lastIndexOf(':');
  return (cut>0&&/^\d{4}-\d{2}-\d{2}$/.test(rest.slice(cut+1)))?rest.slice(0,cut):rest;
}
/* ONE CARD, FLOATING OVER WHAT YOU WERE READING.
   This used to replace the whole page, so opening an entry from the month grid
   cost you the month — you came back to the calendar by way of a Back button
   and had to find your place again. Hannita, 10 Sep: "the calendar main view
   should have this experience where it's a pop up card with the information,
   just how it works for the planning board."
   It is the SAME renderer as before (pageEvent), moved into an overlay rather
   than copied into one. The card is deliberately not a section: there is no
   URL for it and no history entry, because the thing behind it has not
   changed. Clicking an entry inside the card — a comm, a related row — swaps
   the card's contents rather than stacking another. */

      (placeOf(e.detail)?' · '+esc(placeOf(e.detail)):'')+

                +(fac.detail&&fac.detail!==e.detail?' · '+placeOf(fac.detail):''):null]]
             .filter(r=>r[1]);
  if(rows.length){
    h+='<div class="eyebrow">DETAILS</div>'+rows.map((r,i)=>

  const commsRow=c=>'<button class="row" data-ev="'+c.id+'"><span class="when">'+fmt(D(c.date))+'</span>'+

  if(isSunday&&!ks.length){
    h+='<div class="eyebrow">NUMBERS</div><div class="empty">No attendance data available yet.</div>';
  } else if(isSunday){
    h+='<div class="eyebrow">NUMBERS</div>';
    if(m){
      const dl=Math.round(((m.a-avg6)/avg6)*1000)/10;
      h+='<div style="display:flex;gap:8px">'+
        '<div class="nm2" style="background:var(--gathering-t)"><div class="v" style="color:var(--gathering-d)">'+m.a+'</div><div class="k">attendance</div></div>'+

        '<div class="nm2" style="background:var(--fill)"><div class="v">'+m.n+'</div><div class="k">baptisms</div></div></div>'+
        '<div style="font-size:12.5px;color:'+(dl>=0?'var(--session-d)':'var(--red-d)')+';margin-top:10px">'+

        '<div class="nm2" style="background:var(--fill)"><div class="v">'+avg6+'</div><div class="k">recent Sunday avg</div></div></div>';
    }
    h+='<div style="font-size:12px;color:var(--text2);margin:16px 0 7px">Attendance · last 5 Sundays'+(m?'':' and this one')+'</div>'+

      ks.map(k=>'<div class="bar-v'+(k===key(d)?' hi':'')+'" style="height:'+Math.round(METRICS[k].a/mx*100)+'%"></div>').join('')+

    h+='<div class="eyebrow">NUMBERS</div><div class="empty">Attendance is only tracked for Sunday services. Midweek and Houses numbers are recorded in Metrics by type, not per event.</div>';

  }

  h+='</div></div>'+
    '<div class="foot-links">'+

    (isSunday?'<button data-go="numbers" data-item="'+esc(e.date||'')+'">'+(m?'View in Metrics':'Submit attendance')+'</button>':'')+

        esc((card.parts||[e]).map(meetLink).find(Boolean))+'">Join on '+

    ((card.parts||[e]).find(x=>x.link&&x.type!=='facility')

  return h;

/* What one entry says without being opened. Only what we actually know:
   an invented "Facilities: approved" on an event that has no booking would be
   worse than no row at all. A booking knows its own status; a gathering has no
   link to one yet, so it does not claim one. */
function hoverCardHTML(e){
  const t=palOf(e), d=D(e.date);
  const when=e.dateEnd&&e.dateEnd!==e.date
    ? DOW[d.getDay()]+' '+fmt(d)+' – '+DOW[D(e.dateEnd).getDay()]+' '+fmt(D(e.dateEnd))
    : pretty(d);
  const f=partFacts(e), rows=[];
  rows.push(['When',when]);
  if(e.type!=='facility')rows.push(['Status',esc(STATUS_LABEL[e.status]||'')]);
  // The room decision, from whichever part of this card is the booking.
  if(f.facility){
    const st=f.facility.status;
    const label=st==='waiting'?'Waiting on a decision':st==='done'?'Finished':'Approved';
    const col=st==='waiting'?'var(--amber-d)':st==='done'?'var(--text2)':'var(--session-d)';
    rows.push(['Facilities','<span style="color:'+col+'">'+label+'</span>']);
  }
  if(f.phase)rows.push(['Phase',esc(f.phase)]);
  if(f.campus)rows.push(['Campus',esc(f.campus)]);
  if(f.owner)rows.push(['Owner',esc(f.owner)]);
  return '<div class="hc-t">'+esc(e.title)+'</div>'+
    '<div class="hc-tags"><span class="hc-pill" style="background:'+t.tint+';color:'+t.deep+'">'+
      esc(t.label||'')+'</span>'+(f.level?'<span class="hc-lvl">'+esc(f.level)+'</span>':'')+
      partDots(e)+'</div>'+
    rows.map(r=>'<div class="hc-row"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('');
}
(function hoverCards(){
  if(!window.matchMedia||!matchMedia('(hover: hover) and (pointer: fine)').matches)return;
  let el=null,timer=null;
  const hide=()=>{clearTimeout(timer);if(el){el.classList.remove('on');el.remove();el=null;}};
  document.addEventListener('mouseover',ev=>{
    const btn=ev.target.closest&&ev.target.closest('.ev[data-ev]');
    if(!btn){if(el&&!ev.target.closest('.hovercard'))hide();return;}
    // Hover the merged card, not the part underneath it, so the tooltip can
    // say what the booking decided as well as what the board owns.
    const raw=EVENTS.find(x=>x.id===btn.dataset.ev);
    const e=raw?mergeCards(EVENTS.filter(x=>x.date===raw.date&&laneOf(x)))
                  .find(x=>x.id===raw.id)||raw:null;
    if(!e||(el&&el.dataset.for===e.id))return;
    hide();
    timer=setTimeout(()=>{
      el=document.createElement('div');
      el.className='hovercard';el.dataset.for=e.id;
      el.innerHTML=hoverCardHTML(e);
      document.body.appendChild(el);
      // Placed off the entry, not the cursor, so it does not jitter; flipped
      // when there is no room, because a card off the edge says nothing.
      const r=btn.getBoundingClientRect(), h=el.offsetHeight, w=el.offsetWidth;
      let left=r.left, top=r.bottom+8;
      if(left+w>innerWidth-12)left=Math.max(12,innerWidth-w-12);
      if(top+h>innerHeight-12)top=Math.max(12,r.top-h-8);
      el.style.left=left+'px';el.style.top=top+'px';
      requestAnimationFrame(()=>el&&el.classList.add('on'));
    },130);
  });
  document.addEventListener('mouseout',ev=>{
    if(ev.target.closest&&ev.target.closest('.ev[data-ev]'))hide();
  });
  ['scroll','click','keydown'].forEach(t=>document.addEventListener(t,hide,true));
})();

/* Milestones and the Rhythm, drawn the way the board draws them: diamonds for
   the five key moments because they are not phases, and the three affirmations
   as what is true rather than as tasks — no owner, no due date. The wording is
   the Rhythm's own, carried through the mirror rather than restated here. */
function milestonesHTML(ms){
  if(!ms)return '';
  const NAMES=[['kickoff','Kick-Off'],['public','Public'],['ready','Ready'],
               ['launch','Launch'],['debrief','Debrief']];
  const rows=NAMES.filter(([k])=>ms[k]);
  if(!rows.length)return '';
  return '<div class="eyebrow">MILESTONES</div><div class="mstrip">'+
    rows.map(([k,name])=>{
      const past=D(ms[k])<TODAY, pinned=(ms.pinned||[]).includes(k);
      return '<div class="mspt'+(past?' past':'')+'">'+
        '<span class="msdia"'+(pinned?' title="Pinned by hand"':'')+'></span>'+
        '<b>'+esc(name)+'</b>'+fmt(D(ms[k]))+'</div>';
    }).join('')+'</div>';
}
function rhythmHTML(r){
  if(!r)return '';
  const done=(r.affirmations||[]).filter(a=>a.done).length;
  return '<div class="eyebrow">THE RHYTHM · '+esc(r.phase)+' · '+done+' OF '+
    (r.affirmations||[]).length+'</div>'+
    (r.question?'<div class="rq">'+esc(r.question)+'</div>':'')+
    (r.affirmations||[]).map(a=>'<div class="aff'+(a.done?' on':'')+'">'+
      '<span class="affbox">'+(a.done?ic('check'):'')+'</span>'+esc(a.text)+'</div>').join('');
}
