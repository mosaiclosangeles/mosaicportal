<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaic Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---- sign-in gate (same accounts as Mosaic Metrics) ---- */
#gate{position:fixed;inset:0;background:#fafaf9;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.011em}
#gate.hide{display:none}
.gate-card{width:100%;max-width:360px;background:#fff;border:1px solid #e6e6e5;border-radius:12px;padding:32px 30px}
.gate-brand{display:flex;align-items:center;gap:9px;margin-bottom:20px}
.gate-brand .mark{width:18px;height:18px;border-radius:5px;background:#000;flex:none}
.gate-brand .name{font-size:13.5px;font-weight:600;color:#000}
.gate-card h1{font-size:22px;font-weight:600;letter-spacing:-.03em;margin:0 0 4px;color:#000}
.gate-card .gsub{font-size:13px;color:#8a8a8a;margin:0 0 22px}
.gate-card label{display:block;font-size:12px;font-weight:500;color:#8a8a8a;margin:14px 0 5px}
.gate-card input{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #e6e6e5;border-radius:7px;font-size:14px;font-family:inherit;letter-spacing:inherit;color:#000;background:#fff}
.gate-card input:focus{outline:none;border-color:#b5b5b3}
.gate-btn{width:100%;margin-top:20px;padding:10px;border:none;border-radius:8px;background:#000;color:#fff;font-size:14px;font-weight:500;font-family:inherit;letter-spacing:inherit;cursor:pointer}
.gate-btn:disabled{opacity:.55;cursor:default}
.gate-ghost{display:block;margin:14px auto 0;border:none;background:none;font-size:12.5px;color:#8a8a8a;cursor:pointer;font-family:inherit}
.gate-ghost:hover{color:#000;text-decoration:underline}
.gate-note{margin-top:14px;font-size:13px;line-height:1.45;border-radius:7px;display:none}
.gate-note.show{display:block;padding:9px 11px}
.gate-note.err{background:#fbebec;color:#8f2c32}
.gate-note.ok{background:#e6f6f1;color:#2f7a63}
.gate-note.warn{background:#fdf3e3;color:#8a5a12}

/* ---- embedded apps (full-bleed: the app starts immediately, no header) ---- */
/* With a frame showing, #main is only the section's own chrome (today: none),
   so it must not hold a column open beside it. */
.main-embedded{flex:0;padding:0;min-width:0}
.embed-host{flex:1;min-width:0;position:relative;height:100vh}
.embed-host iframe{width:100%;height:100%;border:0;display:block;background:#fff;position:absolute;inset:0}
.embed-host iframe[hidden]{display:none}
.embed-host .embed-open{z-index:1}
.embed-wrap{margin:-24px -28px -60px;position:relative;height:100vh}
.embed-wrap iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.embed-open{position:absolute;right:14px;bottom:14px;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#8a8a8a;background:rgba(255,255,255,.92);border:1px solid #e6e6e5;border-radius:999px;padding:6px 12px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.embed-open:hover{color:#000}
@media(max-width:760px){.embed-host{height:calc(100vh - 58px)}
  .embed-wrap{margin:-18px -16px -96px;height:calc(100vh - 58px)}
  .embed-open{display:none}}

/* ---- account menu (rail foot) ---- */
.rail-foot{cursor:pointer;border-radius:8px}
.rail-foot:hover{background:#e6e6e4}
.um-pop{position:fixed;left:14px;bottom:64px;width:250px;background:#fff;border:1px solid #e6e6e5;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.12);padding:8px;z-index:900;display:none;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.011em}
.um-pop.open{display:block}
.um-head{padding:10px 10px 10px;border-bottom:1px solid #f0f0f0;margin-bottom:6px}
.um-name{font-weight:600;font-size:13.5px;color:#000}
.um-mail{font-size:12px;color:#8a8a8a;margin-top:1px}
.um-role{display:inline-block;margin-top:8px;font-size:10.5px;padding:3px 8px;border-radius:999px;background:#f2f2f1;color:#4a4a4a;font-weight:500}
.um-item{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;font-family:inherit;letter-spacing:inherit;font-size:13px;color:#000;padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left;text-decoration:none;box-sizing:border-box}
.um-item:hover{background:#f2f2f1}
.um-item svg{width:15px;height:15px;color:#5c5c5c;flex:none}
.um-item .hint{color:#8a8a8a;font-size:11px;margin-left:auto}
.um-sep{height:1px;background:#f0f0f0;margin:6px 0}
.um-picker{padding:8px 10px 4px;border-top:1px solid #f0f0f0;margin-top:2px}
.um-picker label{display:block;font-size:11px;font-weight:600;color:#8a8a8a;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em}
.um-picker-roles{display:flex;gap:5px;margin-bottom:10px}
.um-picker-roles button{flex:1;border:1px solid #e6e6e5;background:#fff;border-radius:7px;padding:6px 4px;font-size:12px;font-family:inherit;letter-spacing:inherit;cursor:pointer;color:#4a4a4a;transition:background .1s}
.um-picker-roles button:hover{background:#f2f2f1}
.um-picker-roles button.on{background:#000;color:#fff;border-color:#000}
.um-picker select{width:100%;border:1px solid #e6e6e5;border-radius:7px;padding:7px 9px;font-size:12.5px;font-family:inherit;letter-spacing:inherit;color:#000;background:#fff;margin-bottom:8px;box-sizing:border-box}
.um-picker select:focus{outline:none;border-color:#b5b5b3}
.um-picker-go{width:100%;border:none;border-radius:7px;background:#000;color:#fff;padding:8px;font-size:13px;font-weight:500;font-family:inherit;letter-spacing:inherit;cursor:pointer;margin-bottom:4px}
.um-picker-go:hover{background:#222}
html.dark .um-picker-roles button{background:#1a1a1a;border-color:#333;color:#ccc}
html.dark .um-picker-roles button.on{background:#fff;color:#000;border-color:#fff}
html.dark .um-picker select{background:#1a1a1a;border-color:#333;color:#fff}
.um-head{display:flex;gap:10px;align-items:flex-start}
.um-head .um-av{width:34px;height:34px;font-size:12px}

/* ---- preview bar (admin viewing as staff / leader / volunteer) ---- */
#previewBar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:200;
  background:#1a1a1a;color:#fff;border-radius:999px;padding:10px 14px 10px 16px;
  display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:500;
  box-shadow:0 4px 20px rgba(0,0,0,.35);white-space:nowrap;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.011em}
html.dark #previewBar{background:#2a2a2a}
#previewBar svg{width:16px;height:16px;flex:0 0 auto;color:var(--pb-accent)}
#previewBar .pb-exit{border:none;cursor:pointer;font-family:inherit;letter-spacing:inherit;font-size:12.5px;font-weight:600;
  background:var(--pb-accent);color:#fff;border-radius:999px;padding:5px 14px;margin-left:2px}
#previewBar .pb-exit:hover{filter:brightness(1.12)}
#previewBar .pb-campus,#previewBar .pb-role{border:none;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;
  cursor:pointer;padding:0;appearance:none;-webkit-appearance:none}
#previewBar .pb-campus{min-width:60px;max-width:160px}
#previewBar .pb-role{color:var(--pb-accent);font-weight:600;min-width:40px}
#previewBar .pb-campus option,#previewBar .pb-role option{color:#000}
#previewBar .pb-campus:hover,#previewBar .pb-role:hover{color:var(--pb-accent)}
#previewBar .pb-campus:focus,#previewBar .pb-role:focus{outline:2px solid var(--pb-accent);outline-offset:3px;border-radius:4px}
body.previewing .main{padding-bottom:76px}
@media(max-width:480px){.pb-label{display:none}}

/* ---- profile pictures ----
   Every place a photo is shown is listed once, here. Both rules matter: the
   circle has to clip (overflow) and the photo has to be told to fill it
   (width/height/object-fit). Miss either and a full-size photo spills across
   the page - which it has done twice. Showing a photo somewhere new means
   adding that class to BOTH selector lists below and nothing else. */
/* With no photo we show initials on the same blue as the primary button
   (--gathering), not a grey disc - the grey initials were too faint to read. */
.avatar,.pa-av,.um-head .um-av,.pf-av .ring,.au-ring{
  border-radius:50%;background:var(--gathering);overflow:hidden;flex:none;
  display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff}
.avatar img,.pa-av img,.um-head .um-av img,.pf-av .ring img,.au-ring img{
  width:100%;height:100%;object-fit:cover;display:block}
/* sizes only - everything else is shared above */
.pf-av{display:flex;align-items:center;gap:14px;margin:0 0 18px}
.pf-av .ring{width:64px;height:64px;font-size:20px}
.pa-av{width:24px;height:24px;font-size:9.5px;vertical-align:middle;margin-right:9px}

/* ---- appearance: dark theme re-points the neutral tokens; the type hues
   (which encode meaning) stay exactly as they are. ---- */
html.dark{color-scheme:dark}
html.dark body,html.dark #gate{background:#151514}
html.dark:root,html.dark{
  --surface:#1c1c1b; --rail:#161615; --rail-active:#2a2a28; --fill:#242422;
  --hairline:#302f2d; --separator:#262624; --grid:#37362f;
  --text:#f2f2f0; --text2:#9a9a95; --text3:#6d6d68;
}
html.dark .main,html.dark .app{background:#151514;color:var(--text)}
html.dark .rail{background:var(--rail);border-right-color:var(--hairline)}
html.dark .card,html.dark .pa-card,html.dark .rp-card,html.dark .drawer,html.dark .um-pop,html.dark .gate-card{background:var(--surface);border-color:var(--hairline);color:var(--text)}
html.dark .pa-table th,html.dark .rp-table th,html.dark .rp-table tr.rp-sec td{background:#201f1e;color:var(--text2)}
html.dark .pa-table td,html.dark .rp-table td{border-top-color:var(--separator)}
html.dark .pa-bar input,html.dark .pa-bar select,html.dark .pa-in,html.dark .pa-table select,html.dark .gate-card input{background:#242422;border-color:var(--hairline);color:var(--text)}
html.dark .um-item,html.dark .um-name,html.dark .gate-card h1,html.dark .gate-brand .name{color:var(--text)}
html.dark .um-item:hover{background:var(--fill)}
html.dark .um-role{background:var(--fill);color:var(--text2)}
/* the initials keep their blue in dark mode - white on it reads fine on both */
html.dark .um-head,html.dark .um-sep{border-color:var(--separator);background:none}
html.dark .btn-primary,html.dark .gate-btn{background:#f2f2f0;color:#151514}
html.dark .gate-brand .mark,html.dark .brand-mark{background:#f2f2f0}
html.dark .embed-open{background:rgba(28,28,27,.92);border-color:var(--hairline);color:var(--text2)}
html.dark .app-embed,html.dark .embed-wrap iframe{background:#fff}
html.dark .nav button{color:var(--text2)}
html.dark .nav button.on,html.dark .nav button:hover{color:var(--text);background:var(--rail-active)}
html.dark h1,html.dark h2,html.dark .brand-name,html.dark .who{color:var(--text)}
html.dark .navgroup,html.dark .sub,html.dark .empty{color:var(--text2)}
html.dark .badge,html.dark .count,html.dark .tag{background:var(--fill);color:var(--text2)}
html.dark .banner{background:var(--surface);border-color:var(--hairline);color:var(--text2)}
html.dark .cell,html.dark .wk-head div,html.dark .wk-body{border-color:var(--grid)}
html.dark .row:hover{background:var(--fill)}
/* permissions summary + editor */
.pa-perm{border:0;background:none;padding:0;cursor:pointer;display:inline-flex;gap:5px;flex-wrap:wrap;font-family:inherit}
.pa-pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--fill);color:#4a4a4a;white-space:nowrap}
.pa-pill.custom{background:#e8f0fa;color:#2c4c85}
.pa-perm:hover .pa-pill{background:#e6e6e4}
.pu-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.pu-head .ring{width:52px;height:52px;border-radius:50%;background:#e2e2e0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#5c5c5c;flex:none}
.pu-head .ring img{width:100%;height:100%;object-fit:cover}
.pu-sec{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text2);font-weight:600;margin:22px 0 8px}
.pu-note{font-size:12px;color:var(--text2);margin:8px 0 0;line-height:1.5}
.pu-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.pu-check{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 8px;border-radius:7px;cursor:pointer}
.pu-check:hover{background:var(--fill)}
.pu-check input{margin:0;width:15px;height:15px;flex:none;cursor:pointer}
.pu-danger{border:1px solid #f3c9c2;background:#fff;color:#8f2c32;font-family:inherit;letter-spacing:inherit;font-size:13px;font-weight:500;padding:9px 15px;border-radius:8px;cursor:pointer}
.pu-danger:hover{background:#fbe4e0}
.pu-danger:disabled{opacity:.55;cursor:default}
html.dark .pu-danger{background:transparent;border-color:#5c2a2a;color:#e88b8b}
.pu-lock{margin-left:auto;color:var(--text3);display:inline-flex}
.pu-lock svg{width:12px;height:12px}
/* your own profile: account on the left, password and appearance on the right */
.pf-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start;max-width:820px}
.pf-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.pf-grid .pa-card{padding:20px 22px}
.pf-cardsec{margin:0 0 14px}
@media(max-width:760px){.pf-grid{grid-template-columns:1fr}}
/* a person's own page in Admin */
.au-card{margin:0 0 4px;max-width:620px;overflow:visible}
.au-head{display:flex;gap:16px;align-items:center;padding:18px 20px}
.au-ring{width:64px;height:64px;font-size:20px}
.au-name{font-size:20px;font-weight:700;line-height:1.2}
.au-arch{font-size:11.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--text2);border:1px solid var(--hairline);border-radius:999px;padding:3px 9px;vertical-align:3px}
.au-mail{font-size:13px;color:var(--text2);margin-top:3px}
.au-photo{font-size:12px;color:var(--text2);text-decoration:underline;background:none;border:none;padding:0;margin:6px 12px 0 0;cursor:pointer;font-family:inherit}
.au-photo:hover{color:var(--text)}
.au-fields{border-top:1px solid var(--separator)}
.au-fields .kv{padding:11px 20px}
.au-foot{padding:14px 20px;border-top:1px solid var(--separator)}
/* per-app campus access */
.pu-apps{display:flex;flex-direction:column;gap:12px;max-width:760px}
.pu-app{padding:14px 16px}
.pu-apphead{display:flex;align-items:center;gap:12px}
.pu-appname{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.pu-access{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text2);flex:none}
.pu-yesno{font-size:12.5px;padding:3px 8px;flex:none}
.pu-appbody{margin-top:14px;padding-top:14px;border-top:1px solid var(--separator)}
.pu-appbody[hidden]{display:none}
.pu-sublbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin-bottom:8px}
.pu-sublbl+.pu-campuses,.pu-sublbl+.pu-perms{padding-left:0;padding-right:0}
.pu-appbody .pu-campuses{margin-bottom:14px;padding:0}
.pu-appbody .pu-perms{padding:0}
.pu-appoff{margin-top:8px;font-size:13px;color:var(--text2)}
.pu-perms{display:flex;flex-wrap:wrap;gap:6px 18px;padding:0 8px 10px 8px;max-width:620px}
.pu-perms[hidden]{display:none}
.pu-perm{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}
.pu-perm input{margin:0;width:14px;height:14px;flex:none;cursor:pointer}
.pu-perm-tag{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gathering-d)}
.pu-perm-ov{font-weight:500}
.pu-perm-group{display:contents}
.pu-perm-group-head{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600}
.pu-perm-group-head input{margin:0;width:14px;height:14px;flex:none;cursor:pointer;accent-color:var(--gathering)}
.pu-perm-badge{font-size:10px;font-weight:600;background:var(--gathering-t);color:var(--gathering-d);border-radius:999px;padding:1px 7px;cursor:pointer;white-space:nowrap;border:none;font-family:inherit;line-height:1.6}
.pu-perm-panel{width:100%;padding:7px 10px;background:var(--fill);border:1px solid var(--hairline);border-radius:6px;display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:2px}
.pu-perm-panel[hidden]{display:none}
.pu-perm-panel .pu-perm{font-size:12px}
.pu-perm-locked input{pointer-events:none}
.pu-perm-locked>span:first-of-type{color:var(--text2)}
.pu-lock-ico{font-size:9px;margin-left:2px}
.pu-dep-dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:9999}
.pu-dep-box{background:var(--surface);border:1px solid var(--hairline);border-radius:10px;padding:18px 20px;max-width:340px;font-size:13.5px;line-height:1.5}
.pu-dep-box p{margin:0 0 14px}
.pu-dep-box .btns{display:flex;gap:8px;justify-content:flex-end}
.pu-app{border-radius:7px}
/* per-campus permissions toggle + matrix */
.pu-permhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pu-pc-toggle{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);cursor:pointer;font-weight:400;white-space:nowrap}
.pu-pc-toggle input{width:13px;height:13px;margin:0;flex:none;cursor:pointer;accent-color:var(--gathering)}
.pu-pcmatrix{margin-top:10px;border:1px solid var(--hairline);border-radius:7px;overflow-x:auto}
.pu-pcmatrix[hidden]{display:none}
.pu-pcmatrix table{border-collapse:collapse;min-width:max-content}
.pu-pcmatrix th,.pu-pcmatrix td{border-bottom:1px solid var(--hairline)}
.pu-pcmatrix tbody tr:last-child td{border-bottom:none}
.pu-pcm-hc{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);padding:6px 12px;text-align:center;white-space:nowrap;background:var(--fill)}
.pu-pcm-hc:first-child{text-align:left;position:sticky;left:0;z-index:2;box-shadow:2px 0 0 var(--hairline)}
.pu-pcm-hc.campus-col{color:var(--gathering-d)}
.pu-pcmatrix tbody tr:nth-child(odd) td{background:var(--surface)}
.pu-pcmatrix tbody tr:nth-child(even) td{background:var(--fill)}
.pu-pcm-cell{padding:5px 12px;font-size:12px;color:var(--text);white-space:nowrap}
.pu-pcm-cell:first-child{position:sticky;left:0;z-index:1;box-shadow:2px 0 0 var(--hairline)}
.pu-pcm-cell.c{text-align:center}
.pu-pcm-cell input{width:14px;height:14px;margin:0;cursor:pointer;vertical-align:middle}
.pu-campuses{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:2px 8px 10px 8px;max-width:620px}
.pu-campuses[hidden]{display:none}
.pu-chip{display:inline-flex;align-items:center;gap:4px;background:var(--fill);border:1px solid var(--hairline);border-radius:999px;padding:3px 8px 3px 11px;font-size:12.5px}
.pu-chip button{line-height:1;font-size:14px;color:var(--text2);background:none;border:none;padding:0 0 0 2px;cursor:pointer;font-family:inherit}
.pu-chip button:hover{color:var(--text)}
.pu-chip-none{font-size:12.5px;color:var(--text2)}
.pu-chip-locked{opacity:.75}
.pu-chip-main{background:var(--gathering-t);border-color:var(--gathering)}
.pu-chip-tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--gathering-d);margin-left:3px}
html.dark .pu-chip-main{background:var(--fill);border-color:var(--gathering)}
.pu-addcampus{font-size:12.5px;color:var(--text2);border:1px dashed var(--hairline);border-radius:999px;padding:3px 9px;background:none;cursor:pointer;font-family:inherit}
html.dark .pu-chip,html.dark .pu-addcampus{background:var(--fill);border-color:var(--separator);color:var(--text2)}
html.dark .pa-pill{background:var(--fill);color:var(--text2)}
html.dark .pu-check:hover{background:var(--fill)}
.ap-seg{display:inline-flex;gap:2px;background:var(--fill);border-radius:9px;padding:3px}
.ap-seg button{border:0;background:none;font-family:inherit;letter-spacing:inherit;font-size:12.5px;padding:6px 12px;border-radius:6px;color:var(--text2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ap-seg button.on{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 0 0 1px var(--hairline)}

/* ---- native Admin page ---- */
.pa-bar{display:flex;gap:10px;align-items:center;margin:0 0 14px}
.pa-bar input,.pa-bar select{padding:8px 11px;border:1px solid #e6e6e5;border-radius:7px;font-family:inherit;letter-spacing:inherit;font-size:13px;background:#fff}
.pa-bar input{width:230px}
.pa-card{border:1px solid #e6e6e5;border-radius:10px;overflow:hidden}
.pa-table{width:100%;border-collapse:collapse;font-size:14px}
.pa-table th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#8a8a8a;font-weight:500;padding:12px 16px;background:#fafaf9}
.pa-table td{padding:9px 16px;border-top:1px solid #f0f0f0}
.pa-table select{padding:6px 9px;border:1px solid #e6e6e5;border-radius:7px;font-family:inherit;letter-spacing:inherit;font-size:12.5px;background:#fff;cursor:pointer}
.pa-name{border:none;background:none;cursor:pointer;padding:0;display:inline-flex;align-items:center;font-family:inherit;letter-spacing:inherit;font-size:14px;color:inherit;text-align:left}
.pa-name .nm{font-weight:500;border-bottom:1px solid transparent}
.pa-name:hover .nm{border-bottom-color:currentColor}
html.dark .pa-name{color:var(--text)}
.pa-lbl{display:block;font-size:12px;color:#8a8a8a;margin-bottom:5px}
.pa-in{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #e6e6e5;border-radius:7px;font-family:inherit;letter-spacing:inherit;font-size:14px;background:#fff}
.pa-tabs{display:inline-flex;gap:2px;background:#f2f2f1;border-radius:9px;padding:3px;margin:0 0 18px}
.pa-tabs button{border:0;background:none;font-family:inherit;letter-spacing:inherit;font-size:12.5px;padding:6px 13px;border-radius:6px;color:#5c5c5c;cursor:pointer}
.pa-tabs button.on{background:#fff;color:#000;font-weight:500;box-shadow:0 0 0 1px #e6e6e5}
.pa-dot{display:inline-block;width:6px;height:6px;background:var(--gathering);border-radius:50%;margin-left:5px;vertical-align:middle;position:relative;top:-1px}
.rp-desc{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;margin-bottom:18px}
.rp-card{border:1px solid #e6e6e5;border-radius:10px;padding:14px}
.rp-card .rp-role{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.rp-card p{margin:0;font-size:12.5px;color:#5c5c5c;line-height:1.5}
.rp-table{width:100%;border-collapse:collapse;font-size:13.5px}
/* The table scrolls inside its own card so the role headings stay put while
   you read down the permissions — sticky only works against a scrolling
   ancestor, which is what .rp-scroll is for. */
.rp-scroll{overflow:auto;max-height:calc(100vh - 300px)}
.rp-table th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:500;padding:12px 16px;background:#fafaf9;white-space:nowrap;position:sticky;top:0;z-index:2}
.rp-table td{padding:9px 16px;border-top:1px solid #f0f0f0}
.rp-table tr.rp-sec td{background:#fafaf9;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#8a8a8a;font-weight:500;padding:9px 16px}
.rp-yes{color:#0c6e4e;font-weight:600}
.rp-no{color:#b5b5b3}
.rp-all,.rp-lim{font-size:11.5px;padding:2px 8px;border-radius:999px;background:#f2f2f1;color:#4a4a4a}

:root{
  --surface:#ffffff; --rail:#f3f3f2; --rail-active:#e6e6e4; --fill:#f2f2f1;
  --hairline:#e6e6e5; --separator:#f0f0f0; --grid:#d9d9d6;
  --text:#000000; --text2:#8a8a8a; --text3:#b5b5b3;
  --gathering:#4f7fd1; --gathering-t:#e8f0fa; --gathering-d:#2c4c85;
  --comms:#9a63d4;     --comms-t:#f0e9fb;     --comms-d:#5f3691;
  --milestone:#de6a45; --milestone-t:#fceee7; --milestone-d:#8f3c22;
  --session:#6ac5a7;   --session-t:#e6f6f1;   --session-d:#2f7a63;
  --amber:#e8a33d;  --amber-t:#fdf3e3;  --amber-d:#8a5a12;
  --magenta:#ca5391;--magenta-t:#f9eaf1;--magenta-d:#8c2f5e;
  --indigo:#6f6ede; --indigo-t:#ecebfc; --indigo-d:#3f3e9c;
  --lime:#a9c957;   --lime-t:#f2f7e5;   --lime-d:#5d7326;
  --red:#cf4b53;    --red-t:#fbebec;    --red-d:#8f2c32;
  --slate:#8d979e;  --slate-t:#eceef0;  --slate-d:#4e565b;
  --neutral:#9a9a92;--neutral-t:#f0f0ed;--neutral-d:#55554f;
  --gathering-s:#3f6cba; --comms-s:#7a44b4; --milestone-s:#a8482a;
  --session-s:#2f8a70;   --amber-s:#b8791b; --magenta-s:#a63a72;
  --indigo-s:#4f4ec4;    --lime-s:#6f8a2f;  --red-s:#a63238;
  --slate-s:#5f6a70;     --neutral-s:#6e6e67;
  --r-ctrl:7px; --r-btn:8px; --r-card:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  letter-spacing:-.011em; color:var(--text); background:var(--surface);
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45;
}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gathering);outline-offset:2px;border-radius:4px}
.app{display:flex;min-height:100vh}

/* ---------- rail ---------- */
.rail{width:196px;flex:none;background:var(--rail);border-right:1px solid var(--hairline);
  padding:16px 10px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;padding:0 6px 16px}
/* Only on a phone, where the rail is a panel that has to be dismissed.
   Tapping the dimmed page works too, but a control you can see beats one
   you have to guess at. */
/* Collapsed, the rail keeps its icons exactly where they were and drops the
   words — nothing shifts sideways when you toggle it. Loyda's spec called
   ten items the ceiling for a fixed rail; this is the escape hatch it named. */
.rail-collapse{display:none;margin-left:auto;background:none;border:0;padding:6px;cursor:pointer;color:var(--text2)}
.rail-collapse:hover{color:var(--text)}
.rail-collapse svg{width:18px;height:18px;display:block}
@media (min-width:761px){ .rail-collapse{display:block} }
body.railmin .rail{width:62px;padding-left:8px;padding-right:8px}
body.railmin .brand-name,body.railmin .nav button>span:not(.tile):not(.badge):not(.lock),
body.railmin .navgroup,body.railmin .subnav,body.railmin .who,body.railmin .nav .badge{display:none}
body.railmin .brand{justify-content:center;padding:0 0 16px}
body.railmin .rail-collapse{margin:0}
body.railmin .nav button{justify-content:center;padding:8px 4px}
body.railmin .nav .lock{display:none}
body.railmin .rail-foot{justify-content:center}
body.railmin .nav button:hover::after{content:attr(data-tip);position:fixed;left:70px;
  background:var(--surface);color:var(--text);border:1px solid var(--hairline);border-radius:7px;
  padding:5px 9px;font-size:12.5px;white-space:nowrap;z-index:80;box-shadow:0 6px 18px rgba(0,0,0,.10)}
.rail-close{display:none;margin-left:auto;background:none;border:0;padding:6px;cursor:pointer;color:var(--text2)}
.rail-close:hover{color:var(--text)}
.rail-close svg{width:20px;height:20px;display:block}
.brand-mark{width:18px;height:18px;border-radius:5px;background:#000;flex:none}
.brand-name{font-size:13.5px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:1px;flex:1;min-height:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  scrollbar-width:thin}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:var(--rail-active);border-radius:3px}
.nav button{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--r-ctrl);
  font-size:13.5px;color:#5c5c5c;text-align:left;width:100%}
.nav button:hover{background:#eaeae8}
.nav button.on{background:var(--rail-active);color:#000;font-weight:500}
.nav svg{width:18px;height:18px;flex:none}
.navgroup{font-size:9.5px;letter-spacing:.09em;color:#a3a3a0;padding:14px 9px 4px}
.nav .lock{margin-left:auto;color:#a3a3a0;display:flex}
.nav .lock svg{width:13px;height:13px}
.nav .lock + .badge{margin-left:6px}
.nav .tile{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.fb-card{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:26px;padding:15px 17px;
  border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--surface)}
.fb-mark{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.fb-mark svg{width:17px;height:17px}
.fb-txt{flex:1;min-width:180px}
.fb-h{font-size:14px;font-weight:500;letter-spacing:-.011em}
.fb-s{font-size:12.5px;color:var(--text2);margin-top:2px}
.fb-tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);border:1px solid var(--hairline);border-radius:999px;padding:2px 8px;margin-right:6px;vertical-align:1px}
.fb-btns{display:flex;gap:8px;flex-wrap:wrap}
.fb-btn{font-size:12.5px;padding:7px 13px;border:1px solid var(--hairline);border-radius:999px;
  background:transparent;color:var(--text2);font-family:inherit;letter-spacing:inherit}
.fb-btn:hover{color:var(--text);border-color:var(--text3);background:var(--fill)}
.subnav{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 0;padding-left:12px;border-left:1px solid var(--rail-active)}
.subnav button{display:block;width:100%;text-align:left;font-size:12.5px;color:#6f6f6c;padding:5px 9px;border-radius:var(--r-ctrl)}
.subnav button:hover{background:var(--rail-active);color:var(--text)}
.subnav button.on{background:var(--rail-active);color:var(--text);font-weight:500}
.subgroup{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#a3a3a0;padding:9px 9px 3px}
html.dark .subnav button{color:var(--text2)}
html.dark .subnav button:hover,html.dark .subnav button.on{color:var(--text);background:var(--rail-active)}
.nav .tile svg{width:15px;height:15px}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;max-width:330px}
.sw{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center}
.sw svg{width:13px;height:13px;color:#fff}
.sw.sel{box-shadow:0 0 0 2px #fff inset}
.badge{margin-left:auto;font-size:9px;font-weight:500;letter-spacing:.06em;
  color:#4a4a4a;background:#e2e2e0;border-radius:4px;padding:2px 5px}
.count{margin-left:auto;font-size:12px;color:var(--text3)}
.rail-foot{margin-top:auto;border-top:1px solid var(--rail-active);padding-top:11px;
  display:flex;align-items:center;gap:9px}
.avatar{width:24px;height:24px;border-radius:50%;background:#e2e2e0;font-size:10px;
  font-weight:500;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.who{font-size:12.5px;color:var(--text2)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:24px 28px 60px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;position:relative}
/* The New menu. Anchored to the button rather than centred on the screen: it is
   a short list of places to go, not a dialog to be dismissed. */
.newmenu{display:none;position:absolute;top:100%;right:0;margin-top:8px;z-index:40;
  min-width:280px;background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--r-card);box-shadow:0 12px 32px rgba(0,0,0,.14);padding:6px}
.newmenu.on{display:block}
.nm-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:10px 12px;border:0;background:none;border-radius:var(--r-btn);cursor:pointer;color:var(--text)}
.nm-row:hover{background:var(--fill)}
.nm-ic{flex:none;width:32px;height:32px;border-radius:var(--r-btn);display:grid;place-items:center;
  background:var(--fill);color:var(--text2)}
.nm-ic svg{width:16px;height:16px}
.nm-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.nm-l{font-size:13.5px;font-weight:600}
.nm-s{font-size:11.5px;color:var(--text2)}
@media (max-width:560px){.newmenu{left:0;right:auto;min-width:0;width:100%}}
h1{font-size:30px;font-weight:600;letter-spacing:-.03em;margin:0;line-height:1.1}
.sub{font-size:14px;color:var(--text2);margin-top:5px}
h2{font-size:16px;font-weight:600;letter-spacing:-.015em;margin:0 0 6px}
.btn-primary{background:var(--gathering);color:#fff;font-size:13px;font-weight:500;padding:9px 16px;border-radius:var(--r-btn)}
.btn-primary:hover{filter:brightness(.94)}
.btn-ghost{border:1px solid var(--hairline);font-size:13px;padding:8px 14px;border-radius:var(--r-btn)}
.btn-ghost:hover{background:var(--fill)}

.cardScrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;
  transition:opacity .16s;z-index:40}
.cardScrim.open{opacity:1;pointer-events:auto}
.cardWrap{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-48%) scale(.99);
  width:min(760px,calc(100vw - 40px));max-height:88vh;background:#fff;border-radius:18px;
  box-shadow:0 24px 70px rgba(0,0,0,.22);display:none;flex-direction:column;opacity:0;
  transition:opacity .16s ease,transform .16s ease}
.cardWrap.open{display:flex;opacity:1;transform:translate(-50%,-50%) scale(1)}
.cardClose{position:absolute;top:14px;right:14px;z-index:1;background:none;border:0;padding:6px;
  cursor:pointer;color:var(--text2);line-height:0}
.cardClose:hover{color:var(--text)}
.cardClose svg{width:18px;height:18px;display:block}
.cardBody{overflow-y:auto;padding:30px 34px 34px}
/* On a phone it is a sheet off the bottom, because a centred box that tall
   leaves nothing of the calendar to see behind it anyway. */
@media(max-width:640px){
  .cardWrap{left:0;top:auto;bottom:0;transform:translateY(12px);width:100vw;max-height:92vh;
    border-radius:18px 18px 0 0}
  .cardWrap.open{transform:none}
  .cardBody{padding:26px 18px 30px}
}
.callist{border-top:1px solid var(--grid)}
.cl-day{display:flex;gap:16px;padding:12px 4px;border-bottom:1px solid var(--separator)}
.cl-day.today .cl-num{background:#111;color:#fff;border-radius:8px}
.cl-when{flex:none;width:52px;text-align:center;padding-top:4px}
.cl-dow{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--text3)}
.cl-num{display:inline-block;min-width:26px;padding:1px 4px;font-size:17px;font-weight:600;letter-spacing:-.02em}
.cl-evs{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cl-ev{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 8px;border-radius:8px;background:none;border:0;cursor:pointer}
.cl-ev:hover{background:var(--fill)}
.cl-dot{flex:none;width:8px;height:8px;border-radius:50%}
.cl-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.cl-name{font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-meta{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:640px){.cl-ev .tag{display:none}}
.seg{display:inline-flex;background:var(--fill);border-radius:var(--r-ctrl);padding:2px}
.seg button{font-size:12px;padding:5px 11px;border-radius:6px;color:#5c5c5c}
.seg button.on{background:#111;color:#fff;font-weight:500}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:28px}
.card{border:1px solid var(--hairline);border-radius:var(--r-card);padding:13px 15px;text-align:left;width:100%}
.card:hover{background:#fcfcfc}
.card .k{font-size:12px;color:var(--text2)}
.card .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.05;margin-top:7px}
.card .n{font-size:12px;color:var(--text2);margin-top:3px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.row{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--separator);
  font-size:14px;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:#fcfcfc}
.row .txt{flex:1;min-width:0;display:block}
.row .txt > .name{display:block}
.row .meta{display:block;font-size:12px;color:var(--text2);margin-top:3px}
.row .when{font-size:13px;color:var(--text2);min-width:52px;flex:none;padding-top:1px}
.tick{width:17px;height:17px;border-radius:50%;border:1.5px solid #d4d4d4;flex:none;margin-top:2px;
  display:flex;align-items:center;justify-content:center}
.tick.done{background:#000;border-color:#000}
.tick.done svg{width:11px;height:11px;color:#fff}
.done-text{color:var(--text3);text-decoration:line-through}

/* ---------- filters ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:12px;padding:5px 10px;border-radius:var(--r-ctrl);border:1px solid var(--hairline);
  color:#5c5c5c;display:inline-flex;align-items:center;gap:7px;background:#fff}
.chip:hover{background:#fafafa}
.chip.on{background:var(--fill);border-color:#dedede;color:#000;font-weight:500}
.chip.off{opacity:.45}
.swatch{width:7px;height:7px;border-radius:2px;flex:none}
/* A drawer that asks for something is still a card: a head that says what it
   is, a body, and the actions on their own row — the shape of the item card,
   so the portal does not change language between reading and writing. */
.dcard-head{padding:0 0 14px;border-bottom:1px solid var(--separator);margin-bottom:18px}
.dcard-head h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
.dcard-head .sub{margin-top:4px;font-size:13px;color:var(--text2);line-height:1.5}
.dcard-body{display:flex;flex-direction:column;gap:13px}
.dcard-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  margin-top:20px;padding-top:16px;border-top:1px solid var(--separator)}
/* Saying nothing after a write is how people lose an afternoon, so this is a
   block that holds its ground, not grey text under a button. */
.dnote{display:none;margin-top:14px;padding:11px 13px;border-radius:var(--r-ctrl);
  font-size:13px;line-height:1.45}
.dnote.show{display:block}
.dnote.ok{background:var(--session-t);color:var(--session-d)}
.dnote.err{background:var(--red-t);color:var(--red-d)}
.dnote.warn{background:var(--amber-t);color:var(--amber-d)}
.campussel{margin-left:auto;font-family:inherit;font-size:12px;color:var(--text);
  background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-ctrl);
  padding:5px 9px;cursor:pointer}
.campussel:hover{border-color:var(--grid)}

/* ---------- calendar ----------
   ONE CALENDAR, EVERYWHERE. Loyda, 8 Sep: "we want all the calendars to look
   the same… I'm still seeing the same user interface, so I'm not feeling like
   I'm pivoting." Comms and the Planning Board already agree; the portal was
   the odd one out and read as messy beside them. These numbers are Comms'
   (public/index.html) — the panel, the uppercase head on a tinted ground, the
   124px cell, the 8px padding, the 4px gap, the pill. Change them here and in
   Comms together, or the three drift apart again.

   What is deliberately NOT copied is how status is drawn. Comms puts a flag
   on the pill; the portal fills it, because hue = type and fill = status is
   the rule in docs/mosaic-tokens.css and the legend below the grid says so. */
.calwrap{background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--r-card);overflow:hidden}
.wk-head,.wk-body{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk-head{background:var(--fill)}
.wk-head div{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;
  color:var(--text2);padding:14px 12px;text-align:left}
.wk-head div.today{color:var(--text)}
.cell{border-top:1px solid var(--separator);border-left:1px solid var(--separator);
  padding:8px;min-height:124px;display:flex;flex-direction:column;gap:4px;min-width:0;
  overflow:hidden;background:var(--surface)}
.cell:nth-child(7n+1){border-left:0}
.cell.out{background:var(--fill)}
.cell.out .daynum{opacity:.4}
.daynum{font-size:13px;color:var(--text2);font-weight:500;margin-bottom:2px}
.daynum.today span{background:var(--text);color:#fff;border-radius:50%;width:24px;height:24px;
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.ev{display:block;width:100%;text-align:left;font-size:11px;line-height:1.3;padding:4px 8px;
  border-radius:4px;font-weight:500;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;transition:transform .1s ease,filter .15s ease}
.ev:hover{transform:translateX(2px);filter:brightness(.95)}
.more{font-size:11px;color:var(--text3);text-align:left;padding:0 8px}
/* One dot per source a card merged, so the merge is visible rather than
   silent — you can see at a glance that this one card is the board entry, the
   staff calendar entry and the room booking. */
.evdots{display:inline-flex;gap:3px;margin-left:5px;vertical-align:1px}
.evdots i{width:5px;height:5px;border-radius:50%;display:block}

/* THE HOVER CARD. Loyda, 8 Sep: "I hover over, it gives me time, facilities
   check or pending, and then who's responsible… you let me not do more work,
   but you let me get the information I'm looking for, simply by moving my
   cursor." So this answers the entry without opening it, and the click still
   opens the full card underneath.
   Pointer only — a phone has no hover, and a card that needs one is a card
   half the staff never see. The tap opens the drawer instead. */
.hovercard{position:fixed;z-index:60;width:272px;background:var(--surface);
  border:1px solid var(--hairline);border-radius:var(--r-card);padding:13px 14px;
  box-shadow:0 6px 22px rgba(0,0,0,.10);pointer-events:none;opacity:0;
  transition:opacity .12s ease}
html.dark .hovercard{box-shadow:0 6px 22px rgba(0,0,0,.5)}
.hovercard.on{opacity:1}
.hovercard .hc-t{font-size:14.5px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
.hovercard .hc-tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:8px}
.hovercard .hc-row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;
  color:var(--text2);margin-top:7px}
.hovercard .hc-row b{font-weight:500;color:var(--text);text-align:right;min-width:0}
.hc-pill{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap}
/* Level templatizes the workflow; it is not a badge anyone should have to
   reason about, so it whispers next to the type rather than sitting as a pill. */
.hc-lvl{font-size:10.5px;color:var(--text3);font-weight:500}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding-top:4px}
.bar{font-size:10px;padding:2px 7px;border-radius:4px;margin:0 3px 4px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;text-align:left;width:calc(100% - 6px)}
/* Five key moments, drawn as diamonds so they never read as phases. */
.mstrip{display:flex;gap:0;align-items:flex-start;overflow-x:auto;padding:4px 0 2px}
.mspt{flex:1;min-width:74px;text-align:center;font-size:11px;color:var(--text2)}
.mspt b{display:block;color:var(--text);font-weight:600;font-size:11.5px}
.msdia{width:9px;height:9px;background:var(--milestone);transform:rotate(45deg);
  border-radius:1px;margin:0 auto 7px;display:block}
.mspt.past .msdia{background:var(--neutral)}
/* Affirmations are not tasks: ticking one means "this is now true". */
.rq{font-size:13px;color:var(--text2);margin:0 0 9px}
.aff{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--text2);margin-bottom:7px}
.aff.on{color:var(--text)}
.affbox{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--grid);flex:none;
  margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff}
.aff.on .affbox{background:var(--session-d);border-color:var(--session-d)}
.affbox svg{width:10px;height:10px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--text2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}

/* ---------- timeline ---------- */
.tl-scale{display:flex;font-size:11.5px;color:var(--text2);margin-left:118px;margin-bottom:4px}
.tl-scale div{border-left:1px solid var(--grid);padding-left:6px}
.tl-scale div:first-child{border-left:0;padding-left:0}
.tl-row{display:flex;align-items:center;border-top:1px solid var(--grid);min-height:38px}
.tl-label{width:118px;flex:none;font-size:12.5px;padding-right:10px}
.tl-label .meta{font-size:10.5px;color:var(--text2)}
.tl-track{flex:1;position:relative;height:38px}
.tl-bar{position:absolute;top:9px;height:20px;border-radius:5px;font-size:10.5px;
  padding:0 7px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.tl-now{position:absolute;top:0;bottom:0;width:1px;background:#000;opacity:.35}

/* ---------- misc ---------- */
.bars-chart{display:flex;align-items:flex-end;gap:9px;height:120px}
.bar-v{flex:1;background:var(--fill);border-radius:3px 3px 0 0}
.bar-v.hi{background:var(--gathering)}
.bar-labels{display:flex;gap:9px;margin-top:6px}
.bar-labels div{flex:1;text-align:center;font-size:11px;color:var(--text2)}
.goal{border:1px solid var(--hairline);border-radius:var(--r-card);padding:14px 15px}
.goal .k{font-size:12px;color:var(--text2)}
.goal .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:5px}
.goal .of{font-size:13px;color:var(--text3);font-weight:400}
.track{height:6px;border-radius:3px;background:var(--fill);margin-top:12px;position:relative}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.track .pace{position:absolute;top:-3px;width:1.5px;height:12px;background:#000}
.pill{font-size:11px;padding:3px 8px;border-radius:6px;display:inline-block;margin-top:11px}
.note{font-size:12.5px;color:var(--text2);margin-top:14px}
.banner{border:1px solid var(--hairline);background:#fafafa;border-radius:var(--r-card);
  padding:12px 14px;font-size:13px;color:#5c5c5c;margin-bottom:20px;display:flex;gap:10px;align-items:flex-start}
.banner svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--text2)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:396px;max-width:92vw;background:#fff;
  border-left:1px solid var(--hairline);transform:translateX(100%);transition:transform .22s ease;
  overflow:hidden;z-index:2;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{flex:none;display:flex;align-items:center;gap:8px;padding:14px 14px 0}
.drawer-title{flex:1;font-size:15px;font-weight:600;letter-spacing:-.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-title:empty{display:none}
.drawer-close{color:var(--text2);background:none;border:0;padding:4px;cursor:pointer;flex:none}
.drawer-close:hover{color:var(--text)}
.drawer-close svg{width:18px;height:18px;display:block}
#drawerBody{flex:1;overflow-y:auto;padding:10px 22px 40px}
[data-av-wrap]:hover .av-overlay{opacity:1!important}
.tag{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--fill);color:#4a4a4a;margin-right:5px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--separator)}
.kv span:first-child{color:var(--text2)}
.eyebrow{font-size:10.5px;letter-spacing:.06em;color:var(--text2);margin:20px 0 4px}
.mini{display:flex;gap:22px;margin:4px 0 2px}
.mini .v{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.mini .k{font-size:11.5px;color:var(--text2);margin-top:2px}
.foot-links .foot-out{font-size:13px;color:var(--gathering);text-decoration:none}
.foot-links .foot-out:hover{text-decoration:underline}
.foot-links button{font-family:inherit;letter-spacing:inherit;font-size:13px;color:var(--gathering);background:none;border:0;padding:0;cursor:pointer}
.foot-links button:hover{text-decoration:underline}
/* An address inside the card, made followable by linkify(). Scoped to the
   card: a value that wraps needs to break and stay right-aligned, and the
   label/value rows on the admin screens should not change shape for it. */
.ecard .kv a,.desc a{color:var(--gathering);text-decoration:none;overflow-wrap:anywhere}
.ecard .kv a:hover,.desc a:hover{text-decoration:underline}
.ecard .kv span:last-child{text-align:right;min-width:0}
.kv button{font-family:inherit;letter-spacing:inherit;font-size:inherit;background:none;border:0;padding:0;cursor:pointer}
.kv button:hover{text-decoration:underline}
/* Campus hero cards — one collapsible card per top-level campus, styled after
   Metrics' own Campus settings screen (label/value pairs, expand for detail). */
.cc-card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);padding:18px 20px;margin-bottom:14px}
.cc-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none}
.cc-head::-webkit-details-marker{display:none}
.cc-name{font-size:15.5px;font-weight:600}
.cc-chev{display:inline-flex;color:var(--text2);transition:transform .15s}
.cc-card[open] .cc-chev{transform:rotate(180deg)}
.cc-kv{display:flex;gap:14px;font-size:13px;padding:9px 0 0}
.cc-kv:first-of-type{padding-top:14px}
.cc-kv>span:first-child{width:120px;flex:none;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);padding-top:1px}
.cc-kv>span:last-child{font-weight:600}
.cc-body{border-top:1px solid var(--separator);margin-top:16px;padding-top:14px}
.cc-loc-block{padding:12px 0;border-bottom:1px solid var(--separator)}
.cc-loc-block:last-of-type{border-bottom:0}
.cc-loc{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:600}
.cc-loc-right{display:flex;align-items:center;gap:14px;font-size:12.5px;font-weight:400}
.cc-times{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:10px}
.cc-addtime,.cc-addloc{display:inline-flex;align-items:center;gap:7px}
.cc-addloc{margin-top:14px}
.cc-addtime input,.cc-addloc input{font-family:inherit;font-size:12.5px;border:1px solid var(--hairline);border-radius:999px;padding:5px 12px;width:120px;background:var(--surface);color:var(--text)}
.cc-addloc input{width:180px}
.cc-addtime button,.cc-addloc button{font-size:12.5px;white-space:nowrap}
.cc-inactive-toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text2);margin-bottom:14px;cursor:pointer}
.cc-inactive-toggle input{cursor:pointer}
.cc-users{padding:2px 0 12px}
.cc-user{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:13px}
.cc-divider{display:flex;align-items:center;gap:12px;margin:22px 0 14px;color:var(--text2);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.cc-divider::before,.cc-divider::after{content:'';flex:1;height:1px;background:var(--hairline)}
button.linkout{font-family:inherit;letter-spacing:inherit;background:none;border:0;padding:0;cursor:pointer}
button.linkout:hover{text-decoration:underline}
.linkout{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--gathering);margin-top:16px}
.linkout svg{width:14px;height:14px}
.empty{font-size:13px;color:var(--text2);background:var(--fill);border-radius:var(--r-card);padding:12px 14px}

/* ---------- settings ---------- */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:13px 0;border-bottom:1px solid var(--separator)}
.set-row .k{font-size:14px}
.set-row .d{font-size:12.5px;color:var(--text2);margin-top:2px}
select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--hairline);
  border-radius:var(--r-btn);background:#fff}

/* ---------- event page ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);margin-bottom:14px}
.back svg{width:15px;height:15px}
.ecard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px;margin-top:22px}
.desc{font-size:14px;line-height:1.55;color:#2c2c2a}
.nm2{border-radius:9px;padding:10px 12px;flex:1;min-width:0}
.nm2 .v{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.nm2 .k{font-size:11px;color:var(--text2);margin-top:3px}
.pg{height:5px;border-radius:3px;background:var(--fill);position:relative;margin:7px 0 4px}
.pg i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--gathering)}
.bar-v.q{background:repeating-linear-gradient(45deg,#efefec,#efefec 3px,#fbfbf9 3px,#fbfbf9 6px);
  border:1px dashed var(--grid);border-bottom:0}
.foot-links{display:flex;gap:20px;flex-wrap:wrap;margin-top:26px;padding-top:16px;
  border-top:1px solid var(--hairline);font-size:13px}
.foot-links a{color:var(--gathering);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.foot-links svg{width:13px;height:13px}
@media (max-width:860px){.ecard{grid-template-columns:1fr;gap:24px}}

/* ---------- responsive ---------- */
/* Phone chrome: a bar with the menu, the name, and you. Hidden on desktop,
   where the rail is always visible. */
.mtop{display:none;position:fixed;top:0;left:0;right:0;height:56px;z-index:50;align-items:center;gap:10px;
  padding:0 12px;background:var(--rail);border-bottom:1px solid var(--hairline)}
.mtop-btn,.mtop-av{background:none;border:0;padding:6px;display:flex;align-items:center;cursor:pointer;color:var(--text)}
.mtop-btn svg{width:22px;height:22px}
.mtop-name{flex:1;min-width:0;font-size:14.5px;font-weight:500;letter-spacing:-.011em}
.mtop-av .avatar{width:30px;height:30px;font-size:11px}
.mobile-only{display:none}
@media (max-width:860px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:1fr;gap:22px}
}
@media (max-width:760px){
  .app{flex-direction:column}
  /* A bottom bar couldn't hold ten sections without hiding most of them behind
     a swipe. The rail slides in instead — the whole list at once, with its
     groups, the way it reads on a desktop. */
  .mtop{display:flex}
  .rail{position:fixed;top:0;bottom:0;left:0;width:264px;max-width:82vw;height:auto;z-index:60;
    transform:translateX(-100%);transition:transform .22s ease;
    border-right:1px solid var(--hairline);padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
  .rail.open{transform:translateX(0)}
  .rail-close{display:block}
  .brand{padding:2px 2px 14px}
  .rail-foot{flex:none;background:var(--rail)}
  .nav button{width:100%;font-size:14.5px;padding:9px 8px}
  .main{padding:74px 16px 40px}
  h1{font-size:24px}
  .desktop-only{display:none!important}
  .mobile-only{display:block}
  .um-pop{left:auto;right:10px;top:62px;bottom:auto;max-width:calc(100vw - 20px)}
  .drawer{width:100%;max-width:100%;top:56px}
  .page-head{flex-wrap:wrap;gap:10px}
  .pa-bar{flex-wrap:wrap}
  .pa-bar input{min-width:0;flex:1 1 100%}
  /* wide admin tables scroll inside their card instead of stretching the page */
  .pa-card{overflow-x:auto}
  .pa-table{min-width:600px}
  .rp-table{min-width:600px}
}
</style>
</head>
<body>

<!-- ============ sign-in gate — same accounts as Mosaic Metrics ============ -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-brand"><div class="mark"></div><div class="name">Mosaic Portal</div></div>
    <h1 id="gTitle">Welcome</h1>
    <p class="gsub" id="gSub">Sign in with your Mosaic account.</p>
    <div id="g-email-row">
      <label for="gEmail">Email</label>
      <input id="gEmail" type="email" autocomplete="email" placeholder="you@mosaic.org">
    </div>
    <div id="g-pass-row">
      <label for="gPass">Password</label>
      <input id="gPass" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div id="g-newpass-rows" style="display:none">
      <div>
        <label for="gNewPass">New password</label>
        <input id="gNewPass" type="password" autocomplete="new-password" placeholder="At least 8 characters">
      </div>
      <div>
        <label for="gNewPass2">Confirm new password</label>
        <input id="gNewPass2" type="password" autocomplete="new-password" placeholder="Type it again">
      </div>
    </div>
    <button id="gLoginBtn" class="gate-btn">Sign in</button>
    <button id="gSendResetBtn" class="gate-btn" style="display:none">Email me a reset link</button>
    <button id="gUpdatePassBtn" class="gate-btn" style="display:none">Set new password</button>
    <button id="gForgotLink" class="gate-ghost">Forgot your password?</button>
    <button id="gBackToSignIn" class="gate-ghost" style="display:none">← Back to sign in</button>
    <div id="gateNote" class="gate-note"></div>
  </div>
</div>

<div class="app">
  <div class="mtop">
    <button class="mtop-btn" id="mMenu" aria-label="Open menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="mtop-name">Mosaic Portal</div>
    <button class="mtop-av" id="mAv" aria-label="Your account"><span class="avatar">·</span></button>
  </div>
  <nav class="rail" aria-label="Sections">
    <div class="brand"><div class="brand-mark"></div><div class="brand-name">Mosaic Portal</div>
      <button class="rail-collapse" id="railToggle" aria-label="Collapse sidebar" title="Collapse sidebar (⌘\\)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.5 4v16"/></svg>
      </button>
      <button class="rail-close" id="mClose" aria-label="Close menu" title="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 6l-6 6 6 6M11 6l-6 6 6 6"/></svg>
      </button></div>
    <div class="nav" id="nav"></div>
    <div class="rail-foot"><div class="avatar">L</div><div class="who" id="who">Loyda</div></div>
  </nav>
  <main class="main" id="main"></main>
  <!-- The embedded apps live here, NOT inside #main, because render() replaces
       #main's innerHTML and a detached iframe reloads when it is put back. -->
  <div class="embed-host" id="embedHost" hidden><a class="embed-open" id="embedOpen" target="_blank" rel="noopener">open</a></div>
</div>
<div class="scrim" id="scrim"></div>
<!-- The event card. It floats over whatever you were looking at, the way the
     planning board's own dialog does, so opening one entry does not cost you
     the month you were reading. -->
<div class="cardScrim" id="cardScrim"></div>
<div class="cardWrap" id="cardWrap" role="dialog" aria-label="Event" aria-hidden="true">
  <button class="cardClose" id="cardClose" aria-label="Close">SVGX</button>
  <div class="cardBody" id="cardBody"></div>
</div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Details" aria-hidden="true">
  <div class="drawer-head"><span class="drawer-title" id="drawerTitle"></span><button class="drawer-close" id="drawerClose" aria-label="Close">SVGX</button></div>
  <div id="drawerBody"></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

/* WHICH ROW AN ENTRY BELONGS IN — decided by what it IS, not by which system
   stores it. The first cut routed on the source, so "Mosaic Calendar" meant
   "came from the planning board" and "Staff" meant "came from Outlook". Since
   Outlook holds nearly everything, Staff swallowed the week: Mosaic Future,

   Hannita's rule, 10 Sep, and it is the right one:
     Mosaic Calendar — the church: board items, plus Outlook entries that are

     Staff           — the employee: PTO, birthdays, huddles, internal meetings
     Facilities      — the building: the AC, the doors, rentals, bookings

   An event that is BOTH — Men's Camp, a gathering with a room held — stays one
   card under Mosaic Calendar and carries its facilities state as an attribute.
   Drawing it twice is the duplication the merge just removed. Facilities holds
   what is only about the building.

   subject line today: calendar-events asks Graph for subject, times, location

const INTERNAL=/\b(huddle|staff meeting|staff zoom|staff lunch|all[- ]staff|team meeting|team zoom|arena call|1:1|one[- ]on[- ]one|check[- ]in|stand[- ]?up|b'?day|birthday|payroll|onboarding|performance review)\b/i;

   The planning board stores "LA" and "NYC" (its CAMPUS_BASE); facilities
   stores the campuses table's own name, "Los Angeles". Same campus, two
   spellings, so a filter that compared the raw strings would show a campus
   half its own work. Everything is folded onto CAMPUS_ORDER's names here. */
const CAMPUS_ALIAS={
  'la':'Los Angeles','los angeles':'Los Angeles',
  'nyc':'New York City','ny':'New York City','new york':'New York City',
  'new york city':'New York City',
  'oc':'Orange County','orange county':'Orange County',
  'chicago':'Chicago','atlanta':'Atlanta','seattle':'Seattle','london':'London',
  'mexico':'Mexico','mexico city':'Mexico','cdmx':'Mexico','mx':'Mexico',
  'ecuador':'Ecuador','online':'Mosaic Online','mosaic online':'Mosaic Online'
};
function campusOf(e){
  const raw=(e&&e.campus||'').trim();
  if(!raw)return '';
  return CAMPUS_ALIAS[raw.toLowerCase()]||raw;
}

/* Does this entry belong to a source the person still has switched on?
   An item whose type maps to no source (comms) is never on the calendar. */
function shown(e){
  const src=laneOf(e);

  // An entry with no campus — most of the shared staff calendar — belongs to
  // everybody, so a campus filter narrows the board without hiding it. A card
  // nobody can see is a card nobody works on.
  const c=campusOf(e);
  return !S.campus||!c||c===S.campus;
}
/* Only the campuses actually on the calendar, so the dropdown never offers a
   campus with nothing behind it. The person's own campus is always listed,
   even in a quiet week, or the default would select something invisible. */
function campusesOnCalendar(){
  const seen=new Set();
  EVENTS.forEach(e=>{const c=campusOf(e);if(c)seen.add(c);});
  CAMPAIGNS.forEach(e=>{const c=campusOf(e);if(c)seen.add(c);});
  if(S.campus)seen.add(S.campus);
  return [...seen].sort((a,b)=>campusSortIndex(a)-campusSortIndex(b));
}

const CE_STATUS={sent:'done',approved:'done',complete:'done',scheduled:'scheduled',waiting:'waiting','waiting for approval':'waiting',proposed:'drafting','in progress':'drafting',incomplete:'drafting'};
function mapLive(pis,ces){
  EVENTS=[];CAMPAIGNS=[];ATTN=[];CLOSEOUT=0;
  pis.forEach(r=>{
    if(r.deleted||!r.date)return;   // undated items live on the board, not a calendar
    const title=r.title||(r.is_sunday?'Sunday Gathering':'(untitled)');
    const past=D(r.date)<TODAY;
    /* The mirror carries more than the calendar was keeping: the board's own
       type (Event, Program, Campaign, Staff date), its own status wording, the
       time, the location and whether it repeats. Dropping them here is why the
       card showed less than the board's drawer does.
       Milestones and the Rhythm's ticks are here too, since the sync started
       computing them off the board's own milestoneDates() and PHASE_INFO. */
    const base={type:'event',title,boardId:r.id,campus:r.campus,level:r.level,phase:r.phase_now,speaker:r.speaker,
      boardType:r.type,boardStatus:r.status,recur:r.recur,location:r.location,timeOfDay:r.time_of_day,
      milestones:r.milestones||null,rhythm:r.rhythm||null,
      series:r.is_series?title:undefined,owner:(r.owners||[]).join(', '),desc:r.description,
      detail:(r.speaker?r.speaker+(r.is_sunday?' speaking':''):(r.type||''))+(r.campus&&r.campus!=='LA'?' · '+r.campus:'')};
    if(r.recur==='weekly'&&r.date_end){
      let d=D(r.date),i=0;
      while(d<=D(r.date_end)&&i<60){
        EVENTS.push(Object.assign({},base,{id:'pm:'+r.id+':'+key(d),date:key(d),status:(r.status==='Complete'||d<TODAY)?'done':'scheduled'}));
        d=addDays(d,7);i++;
      }
      return;
    }
    /* A RUN IS STILL AN EVENT. This used to push a multi-day item into
       CAMPAIGNS and return, so Men's Camp existed on the calendar only as the
       bar across the top — nothing to click, nothing to merge with, and the
       richest record we hold about it (owner, phase, the sign-up notes, its
       comms) was unreachable from the calendar. What you could click was the
       shared calendar's bare copy, whose drawer had a title and a date in it
       and nothing else.
       So: keep the bar, which is what shows the shape of a run, AND put the
       item on its start day like every other entry, carrying dateEnd. It is
       how a facility booking has always worked. */
    if(r.date_end&&r.date_end!==r.date){
      CAMPAIGNS.push({title,start:r.date,end:r.date_end,type:'event',campus:r.campus});
      EVENTS.push(Object.assign({},base,{id:'pm:'+r.id,date:r.date,dateEnd:r.date_end,
        status:(r.status==='Complete'||D(r.date_end)<TODAY)?'done':'scheduled'}));
      return;
    }
    const id='pm:'+r.id;
    EVENTS.push(Object.assign({},base,{id,date:r.date,status:(r.status==='Complete'||past)?'done':'scheduled'}));
    if(past&&!r.parent_id&&r.status&&r.status!=='Complete')CLOSEOUT++;
    if(r.is_sunday&&!r.speaker&&!past&&D(r.date)<=addDays(TODAY,42))
      ATTN.push({evId:id,title:'No speaker yet — '+title,date:r.date,meta:(r.campus||'')+' · '+((r.owners||[])[0]||'')});
    if(r.needs_review&&!past)
      ATTN.push({evId:id,title:'Flagged to review — '+title,date:r.date,meta:(r.campus||'')+' · '+((r.owners||[])[0]||'')});
  });
  ATTN.sort((a,b)=>D(a.date)-D(b.date));
  ces.forEach(r=>{
    if(r.archived||!r.event_date)return;
    EVENTS.push({id:'ce:'+r.id,date:r.event_date,type:'comms',boardItemId:r.board_item_id||null,
      status:CE_STATUS[String(r.status||'').toLowerCase()]||'drafting',
      title:r.title||(r.type||'Comm'),
      detail:(r.subtitle||r.type||'')+(r.sender?' · '+r.sender:'')});
  });
  EVENTS.sort((a,b)=>D(a.date)-D(b.date));
}

   the same Supabase project, through the signed-in person's own session. RLS
   decides what comes back: your own requests always, everyone's with
   facilities view_all. Declined, cancelled and archived rows are left out;
   they are not on anybody's calendar.

   A booking is the room being unavailable, so the times shown include the
   setup and teardown either side — block_start and block_end, not start_at.
   Reading start_at would put a 2pm setup on the calendar as a 5pm wedding
   and let somebody book the room at three. */
async function loadFacilities(){
  if(!sb)return;
  const iso=d=>d.toISOString().slice(0,10);
  try{
    const {data,error}=await sb.from('v_fac_requests')
      .select('id,ref,title,request_type,status,campus_name,space_name,organization,'+
              'requester_name,requested_by_name,attendees,block_start,block_end,archived_at')
      .in('status',['submitted','in_review','approved','completed'])
      .is('archived_at',null)
      .gte('block_start',addDays(TODAY,-120).toISOString())
      .lte('block_start',addDays(TODAY,300).toISOString());
    if(error||!data)return;
    data.forEach(r=>{
      const from=new Date(r.block_start), to=new Date(r.block_end);
      const waiting=r.status==='submitted'||r.status==='in_review';

        // calendar: it is the room somebody is about to be told they can
        // have, or cannot.
        status:waiting?'waiting':(to<TODAY?'done':'scheduled'),
        detail:[r.space_name||r.campus_name,
                from.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),
                r.organization||''].filter(Boolean).join(' · '),

  {page:'history',  label:'History'}
];
/* Metrics hides tabs by role, and this rail is a hand-written copy of them, so
   it has to hide the same ones or it offers doors that do not open. Metrics
   bounces a role to Overview rather than erroring, which is worse than an
   error: the tab looks clicked and the page silently is not the one asked for.
   This is ROLE_TABS from mosaic-metrics, kept deliberately identical — the
   two lists are the thing that has to stay in step, and an unknown role falls
   to the most restrictive, exactly as Metrics does. */
const METRICS_ROLE_TABS={
  admin:     ['overview','campuses','kidsyouth','trends','report','history'],
  staff:     ['overview','campuses','kidsyouth','trends','history'],
  leader:    ['overview','trends'],
  volunteer: ['overview']
};

}

function goalsNavItems(){
