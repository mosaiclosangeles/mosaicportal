<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaic Facilities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --surface:#ffffff; --rail:#f3f3f2; --rail-active:#e6e6e4; --fill:#f2f2f1;
  --hairline:#e6e6e5; --separator:#f0f0f0; --grid:#d9d9d6;
  --text:#000000; --text2:#8a8a8a; --text3:#b5b5b3;
  --gathering:#4f7fd1; --gathering-t:#e8f0fa; --gathering-d:#2c4c85; --gathering-s:#3f6cba;
  --comms:#9a63d4;     --comms-t:#f0e9fb;     --comms-d:#5f3691;
  --milestone:#de6a45; --milestone-t:#fceee7; --milestone-d:#8f3c22;
  --session:#6ac5a7;   --session-t:#e6f6f1;   --session-d:#2f7a63; --session-s:#2f8a70;
  --amber:#e8a33d;  --amber-t:#fdf3e3;  --amber-d:#8a5a12;
  --magenta:#ca5391;--magenta-t:#f9eaf1;--magenta-d:#8c2f5e;
  --indigo:#6f6ede; --indigo-t:#ecebfc; --indigo-d:#3f3e9c;
  --lime:#a9c957;   --lime-t:#f2f7e5;   --lime-d:#5d7326;
  --red:#cf4b53;    --red-t:#fbebec;    --red-d:#8f2c32;
  --slate:#8d979e;  --slate-t:#eceef0;  --slate-d:#4e565b;
  --neutral:#9a9a92;--neutral-t:#f0f0ed;--neutral-d:#55554f;
  --r-ctrl:7px; --r-btn:8px; --r-card:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  letter-spacing:-.011em;color:var(--text);background:var(--surface);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gathering);outline-offset:2px;border-radius:4px}
.app{display:flex;min-height:100vh}

/* ---------- sign-in gate (same accounts as Mosaic Metrics / Portal) ---------- */
#gate{position:fixed;inset:0;background:#fafaf9;z-index:1000;display:flex;align-items:center;
  justify-content:center;padding:24px}
#gate.hide{display:none}
.gate-card{width:100%;max-width:360px;background:#fff;border:1px solid var(--hairline);border-radius:12px;padding:32px 30px}
.gate-brand{display:flex;align-items:center;gap:9px;margin-bottom:20px}
.gate-brand .mark{width:18px;height:18px;border-radius:5px;background:#000;flex:none}
.gate-brand .name{font-size:13.5px;font-weight:600}
.gate-card h1{font-size:22px;font-weight:600;letter-spacing:-.03em;margin:0 0 4px}
.gate-card .gsub{font-size:13px;color:var(--text2);margin:0 0 22px}
.gate-card label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin:14px 0 5px}
.gate-card input{width:100%;padding:9px 11px;border:1px solid var(--hairline);border-radius:7px;
  font-size:14px;background:#fff}
.gate-card input:focus{outline:none;border-color:#b5b5b3}
.gate-btn{width:100%;margin-top:20px;padding:10px;border-radius:8px;background:#000;color:#fff;
  font-size:14px;font-weight:500;cursor:pointer}
.gate-btn:disabled{opacity:.55;cursor:default}
.gate-ghost{display:block;margin:14px auto 0;font-size:12.5px;color:var(--text2)}
.gate-ghost:hover{color:#000;text-decoration:underline}
.gate-note{margin-top:14px;font-size:13px;line-height:1.45;border-radius:7px;display:none}
.gate-note.show{display:block;padding:9px 11px}
.gate-note.err{background:var(--red-t);color:var(--red-d)}
.gate-note.ok{background:var(--session-t);color:var(--session-d)}
.gate-note.warn{background:var(--amber-t);color:var(--amber-d)}

/* ---------- rail ---------- */
.rail{width:200px;flex:none;background:var(--rail);border-right:1px solid var(--hairline);
  padding:16px 10px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;padding:0 6px 16px}
.brand-mark{width:18px;height:18px;border-radius:5px;background:#000;flex:none}
.brand-name{font-size:13.5px;font-weight:500;line-height:1.15}
.brand-name span{display:block;font-size:9.5px;letter-spacing:.09em;color:#a3a3a0;font-weight:500}
.nav{display:flex;flex-direction:column;gap:1px;flex:1;min-height:0}
.nav button{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--r-ctrl);
  font-size:13.5px;color:#5c5c5c;text-align:left;width:100%}
.nav button:hover{background:#eaeae8}
.nav button.on{background:var(--rail-active);color:#000;font-weight:500}
.nav .tile{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.nav .tile svg{width:15px;height:15px}
.nav .count{margin-left:auto;font-size:11px;font-weight:600;background:var(--amber);color:#fff;
  border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.navgroup{font-size:9.5px;letter-spacing:.09em;color:#a3a3a0;padding:14px 9px 4px}
.rail-foot{margin-top:auto;border-top:1px solid var(--rail-active);padding-top:11px;
  display:flex;align-items:center;gap:9px;cursor:pointer;border-radius:8px}
.rail-foot:hover{background:#e6e6e4}
.avatar{width:24px;height:24px;border-radius:50%;background:#4f7fd1;color:#fff;font-size:10px;
  font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.who{font-size:12.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.um-pop{position:fixed;left:14px;bottom:64px;width:250px;background:#fff;border:1px solid var(--hairline);
  border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.12);padding:8px;z-index:900;display:none}
.um-pop.open{display:block}
.um-head{padding:10px;border-bottom:1px solid var(--separator);margin-bottom:6px}
.um-name{font-weight:600;font-size:13.5px}
.um-mail{font-size:12px;color:var(--text2);margin-top:1px}
.um-role{display:inline-block;margin-top:8px;font-size:10.5px;padding:3px 8px;border-radius:999px;
  background:var(--fill);color:#4a4a4a;font-weight:500}
.um-item{display:flex;align-items:center;gap:9px;width:100%;font-size:13px;padding:8px 10px;
  border-radius:7px;text-align:left;text-decoration:none;color:inherit}
.um-item:hover{background:var(--fill)}
.um-item svg{width:15px;height:15px;color:#5c5c5c;flex:none}
.um-sep{height:1px;background:var(--separator);margin:6px 0}

/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:24px 28px 60px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
h1{font-size:30px;font-weight:600;letter-spacing:-.03em;margin:0;line-height:1.1}
.sub{font-size:14px;color:var(--text2);margin-top:5px}
h2{font-size:16px;font-weight:600;letter-spacing:-.015em;margin:0 0 6px}
h3{font-size:13.5px;font-weight:600;margin:0 0 12px}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text2);
  font-weight:600;margin:0 0 10px}
.btn-primary{background:var(--gathering);color:#fff;font-size:13px;font-weight:500;padding:9px 16px;
  border-radius:var(--r-btn);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn-primary:hover{filter:brightness(.94)}
.btn-primary:disabled{opacity:.5;cursor:default;filter:none}
.btn-ghost{border:1px solid var(--hairline);font-size:13px;padding:8px 14px;border-radius:var(--r-btn);background:#fff;
  display:inline-flex;align-items:center;gap:6px}
.btn-ghost:hover{background:var(--fill)}
.btn-ok{background:var(--session-d);color:#fff;font-size:13px;font-weight:500;padding:10px 16px;border-radius:var(--r-btn);
  display:inline-flex;align-items:center;gap:7px}
.btn-no{background:var(--red-d);color:#fff;font-size:13px;font-weight:500;padding:10px 16px;border-radius:var(--r-btn);
  display:inline-flex;align-items:center;gap:7px}
.btn-primary svg,.btn-ghost svg,.btn-ok svg,.btn-no svg{width:15px;height:15px;flex:none}
.banner{border:1px solid var(--hairline);background:#fafafa;border-radius:var(--r-card);
  padding:12px 14px;font-size:13px;color:#5c5c5c;margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
.banner svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--text2)}
.banner.warn{background:var(--amber-t);border-color:#f2ddb4;color:var(--amber-d)}
.banner.warn svg{color:var(--amber-d)}
.empty{font-size:13px;color:var(--text2);background:var(--fill);border-radius:var(--r-card);padding:14px 16px}

/* ---------- cards / stats ---------- */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}
.card{border:1px solid var(--hairline);border-radius:var(--r-card);padding:13px 15px;text-align:left;width:100%;background:#fff}
.card:hover{background:#fcfcfc}
.card.on{border-color:#000}
.card .k{font-size:12px;color:var(--text2)}
.card .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.05;margin-top:7px}
.card .n{font-size:12px;color:var(--text2);margin-top:3px}

/* ---------- chips / status ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip{font-size:12px;padding:5px 10px;border-radius:var(--r-ctrl);border:1px solid var(--hairline);
  color:#5c5c5c;display:inline-flex;align-items:center;gap:7px;background:#fff}
.chip:hover{background:#fafafa}
.chip.on{background:var(--fill);border-color:#dedede;color:#000;font-weight:500}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  border-radius:999px;padding:3px 9px;white-space:nowrap}
.st i{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none}
.st.lg{font-size:12.5px;padding:5px 12px}
.seg{display:inline-flex;background:var(--fill);border-radius:var(--r-ctrl);padding:2px}
.seg button{font-size:12px;padding:5px 11px;border-radius:6px;color:#5c5c5c}
.seg button.on{background:#fff;color:#000;font-weight:500;box-shadow:0 0 0 1px var(--hairline)}

/* ---------- split view ---------- */
.split{display:grid;grid-template-columns:392px minmax(0,1fr);gap:0;border:1px solid var(--hairline);
  border-radius:var(--r-card);overflow:hidden;min-height:520px}
.split-list{border-right:1px solid var(--hairline);max-height:calc(100vh - 260px);overflow-y:auto;background:#fcfcfc}
.split-detail{padding:24px 26px;max-height:calc(100vh - 260px);overflow-y:auto}
.rq{display:block;width:100%;text-align:left;padding:13px 16px;border-bottom:1px solid var(--separator);background:none}
.rq:hover{background:#f6f6f5}
.rq.on{background:#fff;box-shadow:inset 3px 0 0 var(--gathering)}
.rq-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.rq-title{font-size:13.5px;font-weight:600;line-height:1.25;min-width:0}
.rq-meta{font-size:11.5px;color:var(--text2);display:flex;gap:10px;flex-wrap:wrap}
.rq-ref{font-size:10.5px;color:var(--text3);font-weight:500;letter-spacing:.03em}

/* ---------- key/value ---------- */
.kvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:18px 0}
.kvbox{background:#fafafa;border-radius:9px;padding:10px 13px}
.kvbox .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);font-weight:600}
.kvbox .v{font-size:13.5px;font-weight:500;margin-top:3px;word-break:break-word}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 13px;
  background:#fafafa;border-radius:9px;margin-bottom:7px;font-size:13.5px}
.line .ico{font-size:16px;flex:none}

/* ---------- forms ---------- */
.form{max-width:780px}
.fcard{border:1px solid var(--hairline);border-radius:var(--r-card);padding:22px 24px;margin-bottom:16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgrid .wide{grid-column:1/-1}
.f label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text2);margin-bottom:5px}
.f label .req{color:var(--red)}
.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid var(--hairline);
  border-radius:var(--r-ctrl);font-size:13.5px;background:#fff}
.f textarea{resize:vertical;min-height:70px}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--gathering)}
.f .hint{font-size:11.5px;color:var(--text2);margin-top:5px;line-height:1.45}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}
.type{border:1.5px solid var(--hairline);border-radius:var(--r-card);padding:13px 14px;text-align:left;background:#fff}
.type:hover{border-color:#cfcfcd}
.type.on{border-color:#000;background:#000;color:#fff}
.type .t{font-size:13.5px;font-weight:600;margin-top:7px}
.type .d{font-size:11.5px;color:var(--text2);margin-top:2px;line-height:1.4}
.type.on .d{color:rgba(255,255,255,.6)}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.rcell{border:1.5px solid var(--hairline);border-radius:var(--r-ctrl);padding:10px 12px;background:#fff;text-align:left}
.rcell:hover{border-color:#cfcfcd}
.rcell.on{border-color:#000;background:#000;color:#fff}
.rcell .rl{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500}
.qty{display:flex;align-items:center;gap:6px;margin-top:8px}
.qty button{width:22px;height:22px;border-radius:5px;background:rgba(255,255,255,.18);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
.qty span{font-size:12.5px;min-width:34px;text-align:center;color:#fff}
.checkline{display:flex;align-items:flex-start;gap:9px;font-size:13px;margin-bottom:9px}
.f label.checkline{font-weight:400;letter-spacing:-.011em;text-transform:none;color:var(--text)}
.checkline input{width:15px;height:15px;margin-top:2px;flex:none}

/* ---------- calendar ---------- */
.cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-bottom:4px}
.cal-head div{font-size:11px;color:var(--text2);text-align:center;padding-bottom:6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--grid);
  border-left:1px solid var(--grid)}
.day{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);min-height:104px;padding:5px 5px 7px}
.day.out{background:#fcfcfc}
.day.out .daynum{color:var(--text3)}
.daynum{font-size:11.5px;color:var(--text2);margin-bottom:4px}
.daynum.today span{background:#000;color:#fff;border-radius:50%;width:19px;height:19px;
  display:inline-flex;align-items:center;justify-content:center;font-size:10.5px}
.cev{display:block;width:100%;text-align:left;font-size:10.5px;line-height:1.3;padding:2px 5px;
  border-radius:4px;margin-bottom:3px;border-left:2.5px solid;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--text2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);
  font-weight:500;padding:11px 14px;background:#fafaf9}
.tbl td{padding:9px 14px;border-top:1px solid var(--separator)}
.tblwrap{border:1px solid var(--hairline);border-radius:var(--r-card);overflow:hidden}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:#000;color:#fff;
  font-size:13px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:1200}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:1fr}
  .split-list{border-right:0;border-bottom:1px solid var(--hairline);max-height:320px}
  .split-detail{max-height:none}}
@media (max-width:760px){
  .app{flex-direction:column}
  .rail{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;
    border-right:0;border-top:1px solid var(--hairline);padding:6px 4px;z-index:3;overflow-x:auto}
  .brand,.rail-foot,.navgroup{display:none}
  .nav{flex-direction:row;gap:2px;width:100%}
  .nav button{flex-direction:column;gap:3px;font-size:10px;padding:6px 4px;justify-content:center;text-align:center}
  .nav .count{display:none}
  .main{padding:18px 16px 96px}
  h1{font-size:24px}
  .fgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ===== sign-in gate — same accounts as Mosaic Metrics / Mosaic Portal ===== -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-brand"><div class="mark"></div><div class="name">Mosaic Facilities</div></div>
    <h1>Welcome</h1>
    <p class="gsub">Sign in with your Mosaic account.</p>
    <div id="g-email-row">
      <label for="gEmail">Email</label>
      <input id="gEmail" type="email" autocomplete="email" placeholder="you@mosaic.org">
    </div>
    <div id="g-pass-row">
      <label for="gPass">Password</label>
      <input id="gPass" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div id="g-newpass-rows" style="display:none">
      <div><label for="gNewPass">New password</label>
        <input id="gNewPass" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div>
      <div><label for="gNewPass2">Confirm new password</label>
        <input id="gNewPass2" type="password" autocomplete="new-password" placeholder="Type it again"></div>
    </div>
    <button id="gLoginBtn" class="gate-btn">Sign in</button>
    <button id="gSendResetBtn" class="gate-btn" style="display:none">Email me a reset link</button>
    <button id="gUpdatePassBtn" class="gate-btn" style="display:none">Set new password</button>
    <button id="gForgotLink" class="gate-ghost">Forgot your password?</button>
    <button id="gBackToSignIn" class="gate-ghost" style="display:none">← Back to sign in</button>
    <div id="gateNote" class="gate-note"></div>
  </div>
</div>

<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand"><div class="brand-mark"></div>
      <div class="brand-name">Mosaic<span>FACILITIES</span></div></div>
    <div class="nav" id="nav"></div>
    <div class="rail-foot"><div class="avatar" id="railAv">?</div><div class="who" id="who"></div></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================ icons ============================ */
const P={
  inbox:'M4 13h4l2 3h4l2-3h4M4 13l2.5-7A2 2 0 018.4 5h7.2a2 2 0 011.9 1.3L20 13v5a2 2 0 01-2 2H6a2 2 0 01-2-2z',
  plus:'M12 5v14M5 12h14',
  calendar:'M4 7a2 2 0 012-2h12a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2zM16 3v4M8 3v4M4 11h16',
  door:'M4 21h16M6 21V5a2 2 0 012-2h8a2 2 0 012 2v16M14 12h.01',
  settings:'M10.3 4.3a1.9 1.9 0 013.4 0l.4.8a1.9 1.9 0 002.2 1l.9-.2a1.9 1.9 0 011.7 3l-.6.7a1.9 1.9 0 000 2.4l.6.7a1.9 1.9 0 01-1.7 3l-.9-.2a1.9 1.9 0 00-2.2 1l-.4.8a1.9 1.9 0 01-3.4 0l-.4-.8a1.9 1.9 0 00-2.2-1l-.9.2a1.9 1.9 0 01-1.7-3l.6-.7a1.9 1.9 0 000-2.4l-.6-.7a1.9 1.9 0 011.7-3l.9.2a1.9 1.9 0 002.2-1zM9.5 12a2.5 2.5 0 105 0 2.5 2.5 0 00-5 0',
  check:'M5 12l5 5L20 7', x:'M6 6l12 12M18 6L6 18',
  left:'M15 6l-6 6 6 6', right:'M9 6l6 6-6 6',

/* Postgres refuses an RLS violation with its own wording; nobody needs to read that. */
function why(err){
  const m=(err&&err.message)||'';
  if(/row-level security|violates row-level/i.test(m))
    return "You don't have access to change this — ask an admin for approver access in the Portal.";

/* ============================ dates ============================ */
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TODAY=new Date();TODAY.setHours(0,0,0,0);
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
/* A date + "HH:MM" in the browser's own zone → the ISO instant Postgres stores. */
function toISO(dateStr,timeStr){
  if(!dateStr)return null;
  const [y,m,d]=dateStr.split('-').map(Number);
  const [hh,mm]=(timeStr||'00:00').split(':').map(Number);
  return new Date(y,m-1,d,hh||0,mm||0).toISOString();
}
function localDate(iso){const d=new Date(iso);return dkey(d);}
function localTime(iso){return new Date(iso).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
function fmtDay(iso){const d=new Date(iso);return DOW[d.getDay()]+' '+MON[d.getMonth()].slice(0,3)+' '+d.getDate();}
function fmtRange(a,b){
  const s=fmtDay(a), e=new Date(b);
  return s+', '+localTime(a)+'–'+localTime(b)+(localDate(a)!==localDate(b)?' ('+fmtDay(b)+')':'');
}
function fmtWhen(iso){
  const d=new Date(iso), days=Math.round((new Date(dkey(d))-TODAY)/86400000);
  if(days===0)return 'Today'; if(days===1)return 'Tomorrow'; if(days===-1)return 'Yesterday';
  return MON[d.getMonth()].slice(0,3)+' '+d.getDate()+(d.getFullYear()!==TODAY.getFullYear()?', '+d.getFullYear():'');
}
function ago(iso){
  const mins=Math.round((Date.now()-new Date(iso))/60000);
  if(mins<1)return 'just now'; if(mins<60)return mins+'m ago';
  const h=Math.round(mins/60); if(h<24)return h+'h ago';
  const d=Math.round(h/24); if(d<30)return d+'d ago';
  return fmtWhen(iso);
}

const AUTH_COOKIE_OK=/\.mosaic\.org$/.test(location.hostname);
const AUTH_CHUNK=3000;
function _cookieAll(){const all={};document.cookie.split(/;\s*/).forEach(p=>{const i=p.indexOf("=");if(i>0)all[p.slice(0,i)]=p.slice(i+1);});return all;}
function _cookieGet(name){
  const all=_cookieAll();let raw=all[name];
  if(raw===undefined){raw="";let i=0;while(all[name+"."+i]!==undefined){raw+=all[name+"."+i];i++;}}
  if(!raw)return null;
  try{return decodeURIComponent(raw);}catch(e){return null;}
}
function _cookieSetRaw(k,v,maxAge){document.cookie=k+"="+v+";domain=.mosaic.org;path=/;max-age="+maxAge+";secure;samesite=lax";}
function _cookieClear(name){_cookieSetRaw(name,"",0);for(let i=0;i<20;i++)_cookieSetRaw(name+"."+i,"",0);}
const mosaicAuthStorage={
  getItem(key){
    if(AUTH_COOKIE_OK){const v=_cookieGet(key);if(v)return v;}
    try{return localStorage.getItem(key);}catch(e){return null;}
  },
  setItem(key,value){
    if(AUTH_COOKIE_OK){
      _cookieClear(key);
      const enc=encodeURIComponent(value);
      if(enc.length<=AUTH_CHUNK)_cookieSetRaw(key,enc,31536000);
      else for(let i=0;i*AUTH_CHUNK<enc.length;i++)_cookieSetRaw(key+"."+i,enc.slice(i*AUTH_CHUNK,(i+1)*AUTH_CHUNK),31536000);
    }
    try{localStorage.setItem(key,value);}catch(e){}
  },
  removeItem(key){
    if(AUTH_COOKIE_OK)_cookieClear(key);
    try{localStorage.removeItem(key);}catch(e){}
  }
};

    actions='<button class="btn-ghost" data-decide="approved" style="color:var(--session-d);border-color:#bde5d8">Reverse — approve it</button>';

        esc(k.replace(/_/g,' ').replace(/^./,m=>m.toUpperCase()))+'</span><span style="font-weight:500">'+
        esc(v===true?'Yes':v)+'</span></div>').join('')+'</div>':'')+

    (r.requester_notes?'<div class="fcard" style="padding:15px 17px;margin-top:16px"><div class="eyebrow">Note from the requester</div>'+
      '<div style="font-size:13.5px;white-space:pre-wrap">'+esc(r.requester_notes)+'</div></div>':'')+

    (r.decision_note?'<div class="banner" style="margin-top:16px;background:var(--fill)">'+ic('info')+
      '<div><strong>Decision note.</strong> '+esc(r.decision_note)+'</div></div>':'')+

    (actions?'<div style="margin-top:22px">'+actions+'</div>':'')+

    '<div style="margin-top:26px"><div class="eyebrow">Notes</div>'+commentsHtml+
      '<div style="margin-top:12px" class="f">'+
      '<textarea id="cmBody" placeholder="Add a note for this request…" style="min-height:58px"></textarea>'+
      '<div style="display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap">'+
        '<button class="btn-primary" data-comment="1">Add note</button>'+
        (CAN.approve?'<label class="checkline" style="margin:0;font-size:12.5px;color:var(--text2)">'+
          '<input type="checkbox" id="cmInternal"> Internal — the requester won\'t see it</label>':'')+
      '</div></div></div>'+

    (activityHtml?'<div style="margin-top:24px"><div class="eyebrow">History</div>'+activityHtml+'</div>':'');
}

/* ---- decisions ---- */
async function decide(id,status){
  const r=reqById(id);if(!r)return;
  let note=null;
  if(status==='declined'){
    note=prompt('Why is this being declined? (the requester sees this)');
    if(note===null)return;
  }
  const patch={status};
  if(status==='approved'||status==='declined'){
    patch.decided_by=ME.id;patch.decided_at=new Date().toISOString();
    if(note)patch.decision_note=note;
  }
  const {error}=await sb.from('fac_requests').update(patch).eq('id',id);
  if(error){toast("Couldn't save — "+why(error));return;}
  delete LINES[id];
  // Approving the request approves every resource still sitting at pending.
  if(status==='approved'){
    await sb.from('fac_request_resources').update({status:'approved'}).eq('request_id',id).eq('status','pending');
    delete LINES[id];
  }
  if(status==='declined'){
    await sb.from('fac_request_resources').update({status:'declined'}).eq('request_id',id).eq('status','pending');
    delete LINES[id];
  }
  toast(status==='approved'?'Approved.':status==='declined'?'Declined.':status==='cancelled'?'Cancelled.':'Saved.');
  await loadRequests();render();
}
async function setResourceStatus(lineId,status){
  const {error}=await sb.from('fac_request_resources').update({status}).eq('id',lineId);
  if(error){toast("Couldn't save — "+why(error));return;}
  delete LINES[S.selected];toast('Saved.');hydrateDetail();
}
async function addComment(){
  const body=($g('cmBody').value||'').trim();
  if(!body){toast('Write something first.');return;}
  const internal=$g('cmInternal')?$g('cmInternal').checked:false;
  const {error}=await sb.from('fac_request_comments')
    .insert({request_id:S.selected,author_id:ME.id,body,is_internal:internal});
  if(error){toast("Couldn't save — "+why(error));return;}
  delete LINES[S.selected];hydrateDetail();
}
</script>

async function checkFormConflicts(){
  const box=$g('conflictBox');if(!box)return;
  const f=S.form;
  if(!sb||!f.space_id||!f.date||!f.start||!f.end){box.innerHTML='';return;}
  const start=new Date(toISO(f.date,f.start)).getTime()-(+f.setup_minutes||0)*60000;
  const end=new Date(toISO(f.date,f.end)).getTime()+(+f.teardown_minutes||0)*60000;
  if(end<=start){box.innerHTML='<div class="banner warn">'+ic('info')+'<div>The end time is before the start time.</div></div>';return;}
  const {data,error}=await sb.rpc('fac_conflicts',{
    p_space_id:f.space_id,p_start:new Date(start).toISOString(),p_end:new Date(end).toISOString(),p_exclude:null});
  if(error){box.innerHTML='';return;}
  const hits=data||[];
  if(!hits.length){
    box.innerHTML='<div class="banner" style="background:var(--session-t);border-color:#bde5d8;color:var(--session-d);margin:0">'+
      ic('check')+'<div>That space is free then.</div></div>';
    return;
  }
  box.innerHTML='<div class="banner warn" style="margin:0">'+ic('info')+
    '<div><strong>Already spoken for.</strong> '+hits.map(h=>esc(h.title)+' ('+
      (STATUS[h.status]||{label:h.status}).label.toLowerCase()+', '+localTime(h.start_at)+'–'+localTime(h.end_at)+')').join(', ')+
    '. You can still submit — the facilities team will sort it out.</div></div>';
}
async function submitForm(){
  const f=S.form,note=$g('formNote');
  const missing=[];
  if(!f.title.trim())missing.push('a title');
  if(!f.campus_id)missing.push('a campus');
  if(!f.date)missing.push('a date');
  if(!f.start||!f.end)missing.push('a start and end time');
  if(f.request_type!=='maintenance'&&!f.space_id)missing.push('a space');
  if(missing.length){note.textContent='Still need '+missing.join(', ')+'.';return;}
  const start_at=toISO(f.date,f.start), end_at=toISO(f.date,f.end);
  if(new Date(end_at)<=new Date(start_at)){note.textContent='The end time has to be after the start time.';return;}
  note.textContent='';f.saving=true;render();

  const {data,error}=await sb.from('fac_requests').insert({
    request_type:f.request_type,title:f.title.trim(),purpose:f.purpose.trim()||null,
    campus_id:f.campus_id,space_id:f.space_id||null,requested_by:ME.id,
    requester_name:ME.name,requester_email:ME.email,requester_phone:f.requester_phone.trim()||null,
    organization:f.is_external?(f.organization.trim()||null):null,is_external:!!f.is_external,
    start_at,end_at,setup_minutes:+f.setup_minutes||0,teardown_minutes:+f.teardown_minutes||0,
    attendees:f.attendees===''?null:+f.attendees,category:f.category,
    details:f.details,requester_notes:f.requester_notes.trim()||null,status:'submitted'
  }).select('id').single();

  if(error){f.saving=false;render();$g('formNote').textContent="Couldn't submit — "+why(error);return;}

  const lines=Object.entries(f.resources).map(([resource_id,qty])=>({request_id:data.id,resource_id,qty}));
  if(lines.length){
    const {error:lineErr}=await sb.from('fac_request_resources').insert(lines);
    if(lineErr)toast('Request submitted, but the resource list did not save — '+lineErr.message);
  }
  S.form=blankForm();
  await loadRequests();
  S.section='requests';S.filter='open';S.selected=data.id;
  render();toast('Request submitted.');
}

<script>
/* ============================ calendar ============================ */
function pageCalendar(){
  const y=S.month.getFullYear(), m=S.month.getMonth();
  const first=new Date(y,m,1), start=addDays(first,-first.getDay());
  const byDay={};
  REQUESTS.filter(r=>r.status!=='cancelled'&&r.status!=='declined').forEach(r=>{
    const k=localDate(r.start_at);(byDay[k]=byDay[k]||[]).push(r);
  });
  let cells='';
  for(let i=0;i<42;i++){
    const d=addDays(start,i), k=dkey(d), out=d.getMonth()!==m;
    const evs=(byDay[k]||[]).sort((a,b)=>a.start_at.localeCompare(b.start_at));
    cells+='<div class="day'+(out?' out':'')+'">'+
      '<div class="daynum'+(k===dkey(TODAY)?' today':'')+'"><span>'+d.getDate()+'</span></div>'+
      evs.slice(0,3).map(r=>{
        const c=STATUS[r.status].c;
        return '<button class="cev" data-open="'+r.id+'" title="'+esc(r.title)+'" '+
          'style="border-left-color:var('+c+');background:var('+c+'-t);color:var('+c+'-d)">'+
          localTime(r.start_at).replace(':00','')+' '+esc(r.title)+'</button>';
      }).join('')+
      (evs.length>3?'<div style="font-size:10px;color:var(--text3);padding-left:5px">+'+(evs.length-3)+' more</div>':'')+
    '</div>';
  }
  return '<div class="page-head"><div><h1>Calendar</h1>'+
      '<div class="sub">Everything approved or waiting on a decision.</div></div>'+
      '<button class="btn-primary" data-go="new">'+ic('plus')+'New request</button></div>'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'+
      '<button class="btn-ghost" data-month="-1" style="padding:6px 11px">'+ic('left')+'</button>'+
      '<h2 style="font-size:19px;margin:0">'+MON[m]+' '+y+'</h2>'+
      '<button class="btn-ghost" data-month="1" style="padding:6px 11px">'+ic('right')+'</button></div>'+
    '<div class="cal-head">'+DOW.map(d=>'<div>'+d+'</div>').join('')+'</div>'+
    '<div class="cal">'+cells+'</div>'+
    '<div class="legend">'+['submitted','in_review','approved','completed'].map(k=>
      '<span><i style="background:var('+STATUS[k].c+')"></i>'+STATUS[k].label+'</span>').join('')+'</div>';
}

    '<td style="font-weight:500">'+esc(s.name)+'</td>'+

    '<td style="color:var(--text2)">'+(r.campus_id?esc(campusName(r.campus_id)):'All campuses')+'</td>'+
  '</tr>').join('');

  return '<div class="page-head"><div><h1>Spaces &amp; resources</h1>'+
      '<div class="sub">'+(canEdit?'What can be booked, and what comes with it.':'What can be booked, and what comes with it. Ask an admin to change this list.')+'</div></div></div>'+
    (canEdit?'<div class="fcard f" style="max-width:820px"><div class="eyebrow">Add a space</div>'+
      '<div class="fgrid">'+
      '<div><label>Name <span class="req">*</span></label><input id="nsName" placeholder="e.g. Room 201"></div>'+
      '<div><label>Campus</label><select id="nsCampus">'+CAMPUSES.map(c=>
        '<option value="'+c.id+'"'+(ME.campus_id===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div>'+
      '<div><label>Building / area</label><input id="nsBuilding" placeholder="Optional"></div>'+
      '<div><label>Capacity</label><input id="nsCap" type="number" min="0" placeholder="Optional"></div>'+
      '</div><button class="btn-primary" data-addspace="1" style="margin-top:14px">Add space</button></div>':'')+
    '<h2 style="margin:22px 0 10px">Spaces</h2>'+
    '<div class="tblwrap"><table class="tbl"><thead><tr><th>Space</th><th>Building</th><th>Campus</th>'+
      '<th>Capacity</th><th>Status</th>'+(canEdit?'<th></th>':'')+'</tr></thead><tbody>'+
      (rows||'<tr><td colspan="6" style="color:var(--text2)">No spaces yet.</td></tr>')+'</tbody></table></div>'+
    '<h2 style="margin:26px 0 10px">Resources</h2>'+
    '<div class="tblwrap"><table class="tbl"><thead><tr><th>Resource</th><th>Type</th><th>Counted</th>'+
      '<th>Inventory</th><th>Where</th></tr></thead><tbody>'+resRows+'</tbody></table></div>';
}
async function addSpace(){
  const name=($g('nsName').value||'').trim();
  if(!name){toast('Give the space a name.');return;}
  const cap_=$g('nsCap').value;
  const {error}=await sb.from('fac_spaces').insert({
    name,campus_id:$g('nsCampus').value,building:($g('nsBuilding').value||'').trim()||null,
    capacity:cap_===''?null:+cap_});
  if(error){toast("Couldn't add it — "+why(error));return;}
  await loadCatalog();render();toast('Space added.');
}
async function retireSpace(id){
  if(!confirm('Retire this space? It stays on past requests but nobody can book it again.'))return;
  const {error}=await sb.from('fac_spaces').update({active:false}).eq('id',id);
  if(error){toast("Couldn't save — "+why(error));return;}
  await loadCatalog();render();toast('Space retired.');
}

/* ============================ events ============================ */
document.addEventListener('click',async e=>{
  const t=e.target;
  const go_=t.closest('[data-go]');            if(go_){go(go_.dataset.go);return;}
  const open=t.closest('[data-open]');
  if(open){S.section='requests';S.selected=open.dataset.open;
    if(!filteredRequests().some(r=>r.id===S.selected))S.filter='all';
    render();return;}
  const filt=t.closest('[data-filter]');       if(filt){S.filter=filt.dataset.filter;render();return;}
  const scope=t.closest('[data-scope]');
  if(scope){S.scope=scope.dataset.scope;await loadRequests();render();return;}
  const dec=t.closest('[data-decide]');        if(dec){decide(S.selected,dec.dataset.decide);return;}
  if(t.closest('[data-comment]')){addComment();return;}
  const ty=t.closest('[data-type]');
  if(ty){S.form.request_type=ty.dataset.type;S.form.details={};render();return;}
  const qty=t.closest('[data-qty]');
  if(qty){const id=qty.dataset.qty,d=+qty.dataset.delta;
    S.form.resources[id]=Math.max(1,(S.form.resources[id]||1)+d);render();return;}
  if(t.closest('[data-stop]'))return;   // the qty stepper sits inside the resource cell
  const res=t.closest('[data-res]');
  if(res){const id=res.dataset.res;
    if(S.form.resources[id]!==undefined)delete S.form.resources[id];else S.form.resources[id]=1;
    render();return;}
  if(t.closest('[data-submit]')){submitForm();return;}
  if(t.closest('[data-reset]')){S.form=blankForm();render();return;}
  const mo=t.closest('[data-month]');
  if(mo){S.month=new Date(S.month.getFullYear(),S.month.getMonth()+ +mo.dataset.month,1);render();return;}
  if(t.closest('[data-addspace]')){addSpace();return;}
  const del=t.closest('[data-delspace]');      if(del){retireSpace(del.dataset.delspace);return;}
});
document.addEventListener('input',e=>{
  const f=e.target.closest('[data-f]');
  if(f&&S.form){
    const k=f.dataset.f;
    S.form[k]=f.type==='checkbox'?f.checked:f.value;
    if(k==='is_external')render();
    if(['space_id','date','start','end','setup_minutes','teardown_minutes'].includes(k))checkFormConflicts();
    if(k==='campus_id'){S.form.space_id='';render();}
    return;
  }
  const d=e.target.closest('[data-d]');
  if(d&&S.form){S.form.details[d.dataset.d]=d.type==='checkbox'?d.checked:d.value;return;}
});
document.addEventListener('change',e=>{
  const line=e.target.closest('[data-resline]');
  if(line){setResourceStatus(line.dataset.resline,line.value);return;}
});

/* ============================ boot ============================ */
async function enterApp(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return;
  ME.id=user.id;ME.email=user.email;
  const {data:prof}=await sb.from('profiles')
    .select('role,display_name,full_name,campus_id,avatar_url').eq('id',user.id).single();
  if(prof){ME.role=prof.role;ME.name=prof.display_name||prof.full_name;
    ME.campus_id=prof.campus_id;ME.avatar_url=prof.avatar_url||null;}
  if(!ME.name||ME.name.includes('@'))ME.name=prettyNameFromEmail(ME.email);

  const perms=['view','submit_request','view_all','approve','manage_spaces'];
  const results=await Promise.all(perms.map(p=>sb.rpc('can',{p_app:'facilities',p_perm:p})));
  perms.forEach((p,i)=>{CAN[p]=results[i].data===true;});
  if(!CAN.view_all)S.scope='mine';

  $g('gate').classList.add('hide');
  if(S.booted)return;
  S.booted=true;
  await loadCatalog();
  S.form=blankForm();
  await loadRequests();
  if(!REQUESTS.some(isOpen))S.filter='all';
  render();
}
(function initAuth(){
  if(!sb){gateNote("Can't reach the sign-in service — check your connection and reload the page.");return;}
  const inviting=location.hash.includes('type=invite');
  const recovering=location.hash.includes('type=recovery')||inviting;
  if(recovering)gateMode('recover');
  if(inviting)gateNote('Welcome! Choose a password to finish setting up your account.','ok');
  sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')gateMode('recover');});
  sb.auth.getSession().then(({data})=>{if(data.session&&!recovering)enterApp();});
})();
</script>
